            async login() {
                const email = (document.getElementById('loginEmail') || {}).value?.trim().toLowerCase() || '';
                const pass = ((document.getElementById('loginPassword') || {}).value || '').trim();
                if (!email || !pass) { toast('Enter email and password.', 'error'); return; }
                authFlowInProgress = true;
                try {
                let role = null,
                    user = null;

                // 1) Try real Supabase Auth first — this is the normal path
                //    once an account has been migrated.
                if (sbEnabled()) {
                    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
                    if (!error && data.user) {
                        const uid = data.user.id;
                        user = DB.customers.find(u => u.userId === uid); if (user) role = 'customer';
                        if (!user) { user = DB.staff.find(u => u.userId === uid); if (user) role = 'staff'; }
                        if (!user) { user = DB.admins.find(u => u.userId === uid); if (user) role = 'admin'; }
                    }
                }

                // 2) Fall back to the legacy plaintext check for accounts that
                //    haven't been migrated yet (seed demo accounts, staff
                //    invited by a pharmacy owner, etc). On a successful match
                //    here, silently create their real Auth account too, so
                //    every future login goes through path 1 instead.
                if (!user) {
                    user = DB.customers.find(u => u.email.toLowerCase() === email && u.password === pass && !u.userId);
                    if (user) role = 'customer';
                    if (!user) { user = DB.staff.find(u => u.email.toLowerCase() === email && u.password === pass && !u.userId); if (user) role = 'staff'; }
                    if (!user) { user = DB.admins.find(u => u.email.toLowerCase() === email && u.password === pass && !u.userId); if (user) role = 'admin'; }
                    if (user && sbEnabled()) {
                        const { data } = await sb.auth.signUp({ email, password: pass });
                        if (data && data.user) {
                            user.userId = data.user.id;
                            sbUpsert(role === 'customer' ? 'customers' : role === 'staff' ? 'staff' : 'admins', user);
                        }
                    }
                }

                if (!user) { toast('Invalid email or password.', 'error'); return; }
                if (role === 'staff' && user.status === 'pending') { toast(
                        'Your pharmacy is awaiting admin approval.', 'error'); return; }
                if (role === 'staff' && user.status === 'rejected') { toast(
                        'Registration was rejected. Contact support.', 'error'); return; }
                if (role !== 'admin' && user.status === 'disabled') { toast(
                        'Account disabled. Contact support.', 'error'); return; }
                state.activeRole = role;
                state.session[role] = user.id;
                // Carry a guest straight to the remedy they were looking at.
                if (role === 'customer' && state.publicMedId && medicine(state.publicMedId)) {
                    state.customer.medId = state.publicMedId;
                    state.customer.view = 'medicine';
                }
                state.publicView = 'landing';
                state.publicMedId = null;
                toast('Welcome, ' + user.name.split(' ')[0] + '!', 'success');
                update();
                } finally {
                    authFlowInProgress = false;
                }
            },
            logout() {
                if (sbEnabled()) sb.auth.signOut();
                if (state.activeRole) state.session[state.activeRole] = null;
                state.activeRole = null;
                state.authView = 'login';

            setReviewRating(medId, orderId, rating) {
                const key = medId + '|' + orderId;
                if (!state.reviewDraft[key]) state.reviewDraft[key] = { rating: 5 };
                state.reviewDraft[key].rating = rating;
                update();
            },
            submitReview(medId, orderId) {
                const custId = state.session.customer;
                const key = medId + '|' + orderId;
                const draft = state.reviewDraft[key] || { rating: 5 };
                const rating = Math.min(5, Math.max(1, draft.rating));

                // Ratings are only allowed on an order this customer has actually received.
                const o = order(orderId);
                if (!o || o.customerId !== custId || o.status !== 'completed' ||
                    !o.items.some(it => it.medId === medId)) {
                    toast('You can only rate medicines from a completed order.', 'error');
                    return;
                }

                // Check if already reviewed for this order
                const existing = DB.reviews.find(r => r.medId === medId && r.customerId === custId && r
                    .orderId === orderId);
                if (existing) {
                    toast('You already rated this product for this order.', 'error');
                    return;
                }

                const id = 'rv' + (counters.review++);
                const rev = {
                    id,
                    medId,
                    customerId: custId,
                    orderId,
                    rating,
                    at: new Date()
                };
                DB.reviews.push(rev);
                sbUpsert('reviews', rev);
                delete state.reviewDraft[key];
                toast('Thank you for your rating! 🌟', 'success');
                update();
            },

            addToCartFX(fromEl) {
                try {
                    const cartIcon = document.getElementById('satchelIcon');
                    if (!fromEl || !cartIcon) return;
                    const startRect = fromEl.getBoundingClientRect();
                    const endRect = cartIcon.getBoundingClientRect();
                    const particle = document.createElement('div');
                    particle.className = 'fly-particle';
                    particle.style.left = (startRect.left + startRect.width / 2 - 8) + 'px';
                    particle.style.top = (startRect.top + startRect.height / 2 - 8) + 'px';
                    document.body.appendChild(particle);
                    requestAnimationFrame(() => {
                        particle.style.transform =
                            `translate(${endRect.left-startRect.left}px, ${endRect.top-startRect.top}px) scale(.2)`;
                        particle.style.opacity = '0';
                    });
                    setTimeout(() => particle.remove(), 550);
                    for (let i = 0; i < 4; i++) {
                        const p = document.createElement('span');
                        p.className = 'petal-particle';
                        p.style.left = (startRect.left + startRect.width / 2) + 'px';
                        p.style.top = (startRect.top + startRect.height / 2) + 'px';
                        p.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
                        p.style.setProperty('--dy', (Math.random() * -45 - 10) + 'px');

                } else if (method === 'paymaya') {

                }

                state.checkout.processing = true;

                update();
                const gatewayName = { card: 'Stripe', paypal: 'PayPal', paymaya: 'PayMaya' }[method];

            async payWithGcash(cart, paymentLabel) {
                state.checkout.processing = true;
                update();
                const items = cart.items.map(it => ({ medId: it.medId, qty: it.qty, price: medicine(it.medId).price }));
                const total = items.reduce((s, it) => s + it.price * it.qty, 0);
                const custId = state.session.customer;
                const redirectBase = window.location.origin + window.location.pathname;
                const referenceId = 'cp_' + custId + '_' + Date.now();
                try {
                    const res = await fetch('/.netlify/functions/create-gcash-charge', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            amount: total,
                            referenceId,
                            successRedirectUrl: redirectBase + '?gcash=success',
                            failureRedirectUrl: redirectBase + '?gcash=failed'
                        })
                    });
                    const json = await res.json();
                    if (!res.ok) throw new Error(json.error || 'Could not start GCash payment.');
                    // Stash everything needed to create the order — a full
                    // redirect to Xendit's checkout and back wipes all
                    // in-memory JS state, so this can't live in `state` alone.
                    sessionStorage.setItem('cp_pending_gcash_order', JSON.stringify({
                        customerId: custId, pharmacyId: cart.pharmacyId, items,
                        fulfillment: state.checkout.fulfillment, addressId: state.checkout.addressId,
                        paymentLabel, chargeId: json.chargeId
                    }));
                    window.location.href = json.checkoutUrl;
                } catch (err) {
                    state.checkout.processing = false;
                    toast(err.message || 'Could not start GCash payment.', 'error');
                    update();
                }
            },

            finalizeOrder() {
                const custId = state.session.customer;
                const cart = state.carts[custId];
                if (!cart) { state.checkout.processing = false;
                    update();
                    return; }
                const pending = state.checkout._pending || {};
                const id = 'o' + (counters.order++);
                const items = cart.items.map(it => ({ medId: it.medId, qty: it.qty, price: medicine(it.medId)
                        .price }));
                items.forEach(it => { const med = medicine(it.medId);
                    med.stock -= it.qty;
                    med.sold = (med.sold || 0) + it.qty; });
                const newOrder = { id, customerId: custId, pharmacyId: cart.pharmacyId, items, fulfillment: state
                        .checkout.fulfillment, addressId: state.checkout.addressId, status: 'pending',
                    createdAt: new Date(), paymentMethod: pending.method || 'card',
                    paymentLabel: pending.paymentLabel || 'Card' };
                DB.orders.push(newOrder);
                items.forEach(it => { const med = medicine(it.medId); if (med) sbUpsert('medicines', med); });
                sbUpsert('orders', newOrder);
                notifyOrderEvent(order(id), 'orderPlaced');
                sendReceiptEmail(newOrder);
                delete state.carts[custId];
                state.checkout = { fulfillment: 'pickup', addressId: null, paymentMethod: 'card', processing: false };
                state.customer.view = 'receipt';
                state.customer.orderId = id;
                update();
            },

                    if (ph) {

            requestReturn(orderId) {

                if (orderReturn(orderId)) { toast('A return is already on file for this order.', 'error'); return; }

                }
                const reason = prompt('Why are you returning this order?');
                if (!reason || !reason.trim()) return;
                const rr = { id: 'r' + (counters.ret++), orderId, customerId: o.customerId,
                    pharmacyId: o.pharmacyId, reason: reason.trim(), status: 'requested', refundAmount: null,
                    at: new Date(), source: 'customer' };
                DB.returns.push(rr); sbUpsert('returns', rr);
                toast('Return request sent to the pharmacy.', 'success');

                if (orderReturn(orderId)) { toast('A return already exists for this order.', 'error'); return; }
                const reason = prompt('Reason for the return / refund:');
                if (!reason || !reason.trim()) return;
                const rr2 = { id: 'r' + (counters.ret++), orderId, customerId: o.customerId,
                    pharmacyId: o.pharmacyId, reason: reason.trim(), status: 'approved', refundAmount: null,

                const window_ = parseInt(val('setReturnWindow'), 10);
                if (!name || !email) { toast('Platform name and support email are required.', 'error'); return; }
                if (isNaN(fee) || fee < 0 || isNaN(freeOver) || freeOver < 0) {
                    toast('Delivery amounts must be zero or more.', 'error');
                    return;
                }
                if (isNaN(lowStock) || lowStock < 0 || isNaN(window_) || window_ < 0) {
                    toast('Low-stock level and return window must be whole numbers.', 'error');
                    return;
                }
                const payments = {};
                PAYMENT_METHODS.forEach(pm => { payments[pm.id] = checked('setPay_' + pm.id); });
                const pickup = checked('setPickup');
                const delivery = checked('setDelivery');
                if (!pickup && !delivery) { toast('Enable at least one fulfillment option.', 'error'); return; }
                if (!Object.values(payments).some(Boolean)) { toast('Enable at least one payment option.', 'error'); return; }
                Object.assign(s, { platformName: name, supportEmail: email, currency: val('setCurrency'),
                    pickupEnabled: pickup, deliveryEnabled: delivery, deliveryFee: fee, freeDeliveryOver: freeOver,
                    lowStockThreshold: lowStock, returnWindowDays: window_, payments });
                sbSaveSettings(s);
                logAudit('Updated platform settings');
                toast('Settings saved.', 'success');
                update();
            },
            resetSettings() {
                if (!confirm('Reset all platform settings to their defaults?')) return;
                Object.assign(DB.settings, { platformName: 'CarePoint', supportEmail: 'support@carepoint.ph',
                    currency: 'PHP', pickupEnabled: true, deliveryEnabled: true, deliveryFee: 49,
                    freeDeliveryOver: 1500, lowStockThreshold: 10, returnWindowDays: 7,
                    payments: { card: true, gcash: true, paymaya: true, paypal: true, cod: true } });
                sbSaveSettings(DB.settings);
                logAudit('Reset platform settings to defaults');
                toast('Settings restored to defaults.', 'success');
                update();
            },

            /* =====================================================
               PHASE 4 — ADMIN: Content Management System (CMS)
               ===================================================== */
            editPage(key) { state.admin.editPageKey = key;
                update(); },
            cancelPageEdit() { state.admin.editPageKey = null;
                update(); },
            savePage(key) {
                const p = DB.pages[key];
                if (!p) { toast('Page not found.', 'error'); return; }
                const title = (document.getElementById('pageTitle_' + key) || {}).value?.trim();
                const body = (document.getElementById('pageBody_' + key) || {}).value?.trim();
                if (!title || !body) { toast('Title and content are required.', 'error'); return; }
                p.title = title;
                p.body = body;
                state.admin.editPageKey = null;
                sbSavePages(DB.pages);
                logAudit('Updated the "' + title + '" page');
                toast('Page updated.', 'success');
                update();
            },

            startAddFaq() { state.admin.addingFaq = true;
                state.admin.editFaqId = null;
                update(); },
            cancelFaqForm() { state.admin.addingFaq = false;
                state.admin.editFaqId = null;
                update(); },
            addFaq() {
                const q = (document.getElementById('newFaqQ') || {}).value?.trim();
                const a = (document.getElementById('newFaqA') || {}).value?.trim();
                if (!q || !a) { toast('Fill in both the question and answer.', 'error'); return; }
                const nf = { id: 'faq' + (counters.faq++), q, a };
                DB.faqs.push(nf); sbUpsert('faqs', nf);
                state.admin.addingFaq = false;
                logAudit('Added FAQ: ' + q);
                toast('FAQ added.', 'success');
                update();
            },
            editFaq(id) { state.admin.editFaqId = id;
                state.admin.addingFaq = false;
                update(); },
            saveFaq(id) {
                const f = DB.faqs.find(x => x.id === id);
                if (!f) { toast('FAQ not found.', 'error'); return; }
                const q = (document.getElementById('editFaqQ') || {}).value?.trim();
                const a = (document.getElementById('editFaqA') || {}).value?.trim();
                if (!q || !a) { toast('Fill in both the question and answer.', 'error'); return; }
                f.q = q;
                f.a = a;
                sbUpsert('faqs', f);
                state.admin.editFaqId = null;
                logAudit('Updated FAQ: ' + q);
                toast('FAQ updated.', 'success');
                update();
            },
            removeFaq(id) {
                if (!confirm('Remove this FAQ entry?')) return;
                DB.faqs = DB.faqs.filter(f => f.id !== id);
                sbDelete('faqs', id);
                logAudit('Removed an FAQ entry');
                toast('FAQ removed.', 'success');
                update();
            },

            editBanner() { state.admin.editingBanner = true;
                update(); },
            cancelBannerEdit() { state.admin.editingBanner = false;
                update(); },
            saveBanner() {
                const b = DB.homepageBanner;
                const headline = (document.getElementById('bannerHeadline') || {}).value?.trim();
                const subtext = (document.getElementById('bannerSubtext') || {}).value?.trim();
                const ctaLabel = (document.getElementById('bannerCta') || {}).value?.trim();
                const active = !!(document.getElementById('bannerActive') || {}).checked;
                if (!headline || !subtext || !ctaLabel) { toast('Fill in all banner fields.', 'error'); return; }
                Object.assign(b, { headline, subtext, ctaLabel, active });
                sbSaveBanner(b);
                state.admin.editingBanner = false;
                logAudit('Updated the homepage banner');
                toast('Homepage banner updated.', 'success');
                update();
            },

            startAddPromo() { state.admin.addingPromo = true;
                state.admin.editPromoId = null;
                update(); },
            cancelPromoForm() { state.admin.addingPromo = false;
                state.admin.editPromoId = null;
                update(); },
            addPromo() {
                const title = (document.getElementById('newPromoTitle') || {}).value?.trim();
                const text = (document.getElementById('newPromoText') || {}).value?.trim();
                if (!title || !text) { toast('Fill in both fields.', 'error'); return; }
                const np = { id: 'promo' + (counters.promo++), title, text, active: true };
                DB.promotions.push(np); sbUpsert('promotions', np);
                state.admin.addingPromo = false;
                logAudit('Added promotion: ' + title);
                toast('Promotion added.', 'success');
                update();
            },
            editPromo(id) { state.admin.editPromoId = id;
                state.admin.addingPromo = false;
                update(); },
            savePromo(id) {
                const p = DB.promotions.find(x => x.id === id);
                if (!p) { toast('Promotion not found.', 'error'); return; }
                const title = (document.getElementById('editPromoTitle') || {}).value?.trim();
                const text = (document.getElementById('editPromoText') || {}).value?.trim();
                if (!title || !text) { toast('Fill in both fields.', 'error'); return; }
                p.title = title;
                p.text = text;
                sbUpsert('promotions', p);
                state.admin.editPromoId = null;
                logAudit('Updated promotion: ' + title);
                toast('Promotion updated.', 'success');
                update();
            },
            togglePromo(id) {
                const p = DB.promotions.find(x => x.id === id);
                if (!p) return;
                p.active = !p.active;
                sbUpsert('promotions', p);
                logAudit((p.active ? 'Activated' : 'Deactivated') + ' promotion: ' + p.title);
                toast('Promotion ' + (p.active ? 'activated' : 'deactivated') + '.', 'success');
                update();
            },
            removePromo(id) {
                const p = DB.promotions.find(x => x.id === id);
                if (!confirm('Remove this promotion?')) return;
                DB.promotions = DB.promotions.filter(x => x.id !== id);
                sbDelete('promotions', id);
                logAudit('Removed promotion: ' + (p ? p.title : id));
                toast('Promotion removed.', 'success');
                update();
            },

            /* =====================================================
               PHASE 4 — ADMIN: Audit Trail
               ===================================================== */
            setAuditFilter(v) { state.admin.auditFilter = v;
                update(); },
        };

        (async function boot() {
            console.log('[Boot] location.origin =', location.origin, '| isNativeAndroidApp() =', isNativeAndroidApp());
            if (isNativeAndroidApp() && !state.activeRole) state.publicView = 'auth';
            setupCapacitorAuthListener();
            if (sbEnabled()) {
                // Upload built-in accounts if the remote project is still empty
                const seeded = await seedSupabaseIfEmpty();
                const loaded = await loadAllFromSupabase();
                if (!loaded) {
                    console.warn('[Supabase] Could not load — using local data. Did you run the SQL schema?');
                } else if (seeded) {
                    await loadAllFromSupabase();
                }
                setupRealtimeThreads();
                setupRealtimeOrders();
                setupRealtimeNotifications();
                setupRealtimeMedicines();
                setupRealtimeCustomers();

                // Pick up a Google OAuth redirect coming back, or an
                // already-active session from an earlier visit.
                const { data: { session } } = await sb.auth.getSession();
                if (session && session.user && !state.activeRole) {
                    await resolveAuthSession(session.user);
                }
                sb.auth.onAuthStateChange((event, sess) => {
                    if (event === 'SIGNED_IN' && sess && sess.user && !state.activeRole && !authFlowInProgress) {
                        resolveAuthSession(sess.user);
                    }
                });
                await checkGcashReturn();
            }
            update();
            // Fade out our branded boot screen now that real content is
            // ready — works immediately regardless of native splash image
            // asset setup, since it's just HTML/CSS we fully control.
            const bootEl = document.getElementById('bootSplash');
            if (bootEl) {
                bootEl.classList.add('fade-out');
                setTimeout(() => bootEl.remove(), 400);
            }
            // Also hide the native Capacitor splash screen (belt-and-braces
            // — same bridge-loading race as the auth listener, so poll
            // briefly rather than risk missing it and leaving it stuck).
            (function hideSplash(tries) {
                if (window.CapSplash && window.CapSplash.hide) {
                    window.CapSplash.hide().catch(() => {});
                    return;
                }
                if (tries < 60) setTimeout(() => hideSplash(tries + 1), 50);
            })(0);
        })();
    </script>
</body>
