        /* ---------- Shop scaffolding shared by the guest catalog and the customer shop ---------- */
        function sortOptions() {
            const s = state.search.sort;
            return [['newest','Newest'],['popularity','Popular'],['priceLow','Price: low to high'],['priceHigh','Price: high to low'],['name','Name A–Z'],['brand','Brand A–Z']]
                .map(([v, l]) => `<option value="${v}" ${s===v?'selected':''}>${l}</option>`).join('');
        }
        function brandOptions() {
            return `<option value="All" ${state.search.brand==='All'?'selected':''}>All brands</option>` +
                allBrands().map(b=>`<option value="${esc(b)}" ${state.search.brand===b?'selected':''}>${esc(b)}</option>`).join('');
        }
        function railOpt(active, call, labelHtml, count) {
            return `<button class="rail-opt ${active?'active':''}" aria-pressed="${active}" onclick="${call}"><span class="rail-opt-label">${labelHtml}</span>${count !== '' && count != null ? `<span class="rail-count">${count}</span>` : ''}</button>`;
        }
        function activeFilterChips() {
            const s = state.search;
            const chips = [];
            if (s.category !== 'All') chips.push([esc(s.category), "App.setSearchField('category','All')"]);
            if (s.pharmacy !== 'All') chips.push([esc(pharmacyName(s.pharmacy)), "App.setSearchField('pharmacy','All')"]);
            if (s.brand && s.brand !== 'All') chips.push(['Brand: ' + esc(s.brand), "App.setSearchField('brand','All')"]);
            if (s.priceMin) chips.push(['From ' + currencySymbol() + esc(s.priceMin), "App.setSearchField('priceMin','')"]);
            if (s.priceMax) chips.push(['Up to ' + currencySymbol() + esc(s.priceMax), "App.setSearchField('priceMax','')"]);
            const filters = chips.length;
            if (s.query) chips.push(['“' + esc(s.query) + '”', "App.setSearchQuery('')"]);
            return { count: filters, html: chips.map(([l, call]) => `<button class="filter-chip" onclick="${call}" aria-label="Remove filter ${l}">${l}${icon('close',12)}</button>`).join('') };
        }
        function filterRail(approvedPharmacies) {
            const s = state.search;
            const pub = publicMedicines();
            const any = s.category!=='All'||s.pharmacy!=='All'||s.brand!=='All'||s.priceMin||s.priceMax||s.query;
            return `<aside class="filter-rail" aria-label="Filters">
                <div class="rail-head"><span class="rail-title">Refine the shelf</span>${any ? `<button class="btn-link" onclick="App.clearFilters()">Clear all</button>` : ''}</div>
                <div class="rail-group">
                  <div class="rail-label">Shelf</div>
                  <div class="rail-list">
                    ${railOpt(s.category==='All', "App.setSearchField('category','All')", 'All remedies', pub.length)}
                    ${CATEGORIES.map(c => railOpt(s.category===c, `App.setSearchField('category','${esc(c)}')`, `${catIcon(c)}<span>${esc(c)}</span>`, pub.filter(m => m.category === c).length)).join('')}
                  </div>
                </div>
                <div class="rail-group">
                  <div class="rail-label">Price (${currencySymbol()})</div>
                  <div class="price-range-inputs">
                    <input type="number" min="0" inputmode="numeric" id="priceMinInput" aria-label="Minimum price" placeholder="Min" value="${esc(s.priceMin)}" oninput="App.setSearchField('priceMin', this.value)">
                    <span aria-hidden="true">–</span>
                    <input type="number" min="0" inputmode="numeric" id="priceMaxInput" aria-label="Maximum price" placeholder="Max" value="${esc(s.priceMax)}" oninput="App.setSearchField('priceMax', this.value)">
                  </div>
                </div>
                <div class="rail-group">
                  <div class="rail-label">Pharmacy</div>
                  <div class="rail-list">
                    ${railOpt(s.pharmacy==='All', "App.setSearchField('pharmacy','All')", 'Every pharmacy', '')}
                    ${approvedPharmacies.map(p => railOpt(s.pharmacy===p.id, `App.setSearchField('pharmacy','${p.id}')`, `<span class="rail-ph"><span>${esc(p.name)}</span><small>${esc(p.hours)}</small></span>`, '')).join('')}
                  </div>
                </div>
                <div class="rail-group">
                  <label class="rail-label" for="brandSelect">Brand</label>
                  <select id="brandSelect" class="select" onchange="App.setSearchField('brand', this.value)">${brandOptions()}</select>
                </div>
              </aside>`;
        }
        function filterSheetHtml(approvedPharmacies, withCategories) {
            if (!state.mobileFilterSheetOpen) return '';
            const s = state.search;
            return `<div class="more-sheet-overlay" onclick="App.toggleFilterSheet()">
                <div class="more-sheet filter-sheet" role="dialog" aria-modal="true" aria-label="Filters" onclick="event.stopPropagation();">
                  <div class="more-sheet-handle"></div>
                  <div class="sheet-head"><h2 class="sheet-title">Refine the shelf</h2><button class="icon-btn" aria-label="Close filters" onclick="App.toggleFilterSheet()">${icon('close',18)}</button></div>
                  <div class="sheet-body">
                    ${withCategories ? `<div class="field"><label>Shelf</label><div class="chip-row">
                        ${['All'].concat(CATEGORIES).map(c => `<button class="chip ${s.category===c?'active':''}" onclick="App.setSearchField('category','${esc(c)}')">${c==='All' ? 'All' : catIcon(c) + ' ' + esc(c)}</button>`).join('')}
                      </div></div>` : ''}
                    <div class="field"><label for="sheetPharmacy">Pharmacy</label>
                      <select id="sheetPharmacy" onchange="App.setSearchField('pharmacy', this.value)">
                        <option value="All" ${s.pharmacy==='All'?'selected':''}>All</option>
                        ${approvedPharmacies.map(p=>`<option value="${p.id}" ${s.pharmacy===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
                      </select>
                    </div>
                    <div class="field"><label for="sheetBrand">Brand</label>
                      <select id="sheetBrand" onchange="App.setSearchField('brand', this.value)">${brandOptions()}</select>
                    </div>
                    <div class="field"><label for="sheetSort">Sort</label>
                      <select id="sheetSort" onchange="App.setSearchField('sort', this.value)">${sortOptions()}</select>
                    </div>
                    <div class="field"><label>Price (${currencySymbol()})</label>
                      <div class="price-range-inputs">
                        <input type="number" min="0" inputmode="numeric" id="sheetPriceMin" aria-label="Minimum price" placeholder="Min" value="${esc(s.priceMin)}" oninput="App.setSearchField('priceMin', this.value)">
                        <span aria-hidden="true">–</span>
                        <input type="number" min="0" inputmode="numeric" id="sheetPriceMax" aria-label="Maximum price" placeholder="Max" value="${esc(s.priceMax)}" oninput="App.setSearchField('priceMax', this.value)">
                      </div>
                    </div>
                  </div>
                  <div class="sheet-foot">
                    <button class="btn btn-outline" onclick="App.clearFilters();App.toggleFilterSheet()">Clear filters</button>
                    <button class="btn btn-primary" onclick="App.toggleFilterSheet()">Show results</button>
                  </div>
                </div>
              </div>`;
        }
        function shopLayout(meds, medsPage, key, approvedPharmacies, cardFn, hasRxResults, searchId) {
            const chips = activeFilterChips();
            return `<div class="shop">
                ${filterRail(approvedPharmacies)}
                <section class="shop-results" aria-label="Products">
                  <div class="shop-toolbar">
                    <label class="search-field">${icon('search',18)}<span class="sr-only">Search remedies</span><input type="text" id="${searchId}" placeholder="Search remedies, pharmacies…" value="${esc(state.search.query)}" oninput="App.setSearchQuery(this.value)" autocomplete="off"></label>
                    <button class="btn btn-outline filter-toggle" onclick="App.toggleFilterSheet()">${icon('sliders',16)} Filters${chips.count ? `<span class="filter-toggle-n">${chips.count}</span>` : ''}</button>
                    <label class="sort-field"><span>Sort</span><select id="${searchId}Sort" onchange="App.setSearchField('sort', this.value)">${sortOptions()}</select></label>
                  </div>
                  <div class="results-meta"><span class="results-count">${meds.length} remed${meds.length===1?'y':'ies'}</span>${chips.html}</div>
                  ${hasRxResults ? `<div class="apo-note apo-note--inline"><span class="apo-note-tag">Rx</span><p>Some items need a prescription — message the pharmacist to ask.</p></div>` : ''}
                  ${meds.length ? `<div class="product-grid">${medsPage.items.map(m => cardFn(m)).join('')}</div>`
                    : emptyState('jar', 'Nothing on this shelf matches.', 'Try a different search, or loosen a filter or two.', chips.count || state.search.query ? `<button class="btn btn-outline" onclick="App.clearFilters()">Clear filters</button>` : '')}
                  ${paginationHtml(key, medsPage.page, medsPage.totalPages)}
                </section>
              </div>
              ${filterSheetHtml(approvedPharmacies, true)}`;
        }

        function publicCatalog() {
            const meds = filteredMedicines();
            const medsPage = paginate(meds, 'publicCatalog', 12);
            const approvedPharmacies = DB.pharmacies.filter(p => p.status === 'approved');
            return `${crumbs("App.goPublic('landing')", 'Home', 'The shelf')}
              ${pageHead('The full <em>shelf</em>', 'Everything in stock across the neighborhood — browse freely, and log in when you are ready to order.', '', 'Browse')}
              ${shopLayout(meds, medsPage, 'publicCatalog', approvedPharmacies, publicMedCard, false, 'publicSearchInput')}`;
        }

        /* ---------- Product detail (shared frame for guests & customers) ---------- */
        function ratingSummary(reviews, avg) {
            if (!reviews.length) return '';
            const counts = [5, 4, 3, 2, 1].map(n => ({ n, c: reviews.filter(r => Math.round(r.rating) === n).length }));
            const max = Math.max(1, ...counts.map(x => x.c));
            return `<div class="rating-summary">
                <div class="rating-big"><span class="rating-big-n">${avg.toFixed(1)}</span>${starRow(avg, null, 15)}<span class="hint">${reviews.length} verified rating${reviews.length===1?'':'s'}</span></div>
                <div class="rating-dist">${counts.map(x => `<div class="rating-dist-row"><span class="mono">${x.n}★</span><span class="rating-dist-track"><span style="width:${x.c / max * 100}%"></span></span><span class="mono">${x.c}</span></div>`).join('')}</div>
              </div>`;
        }
        function reviewsList(reviews, emptyText) {
            if (!reviews.length) return `<p class="hint">${emptyText}</p>`;
            return `<div class="review-list">${reviews.map(r => {
                const nm = customer(r.customerId) ? customer(r.customerId).name : 'Customer';
                return `<div class="review-item">
                    <span class="avatar avatar--sm">${initials(nm)}</span>
                    <div class="review-main">
                      <div class="review-head"><span class="review-name">${esc(nm)}</span>${starRow(r.rating, null, 13)}</div>
                      <div class="review-date">Verified purchase · ${fmtDate(r.at)}</div>
                    </div>
                  </div>`; }).join('')}</div>`;
        }
        function availabilityText() {
            const s = DB.settings;
            const how = s.pickupEnabled && s.deliveryEnabled ? 'Pickup at the counter or home delivery' : s.pickupEnabled ? 'Pickup at the counter' : 'Home delivery';
            return how + (s.deliveryEnabled && s.freeDeliveryOver > 0 ? ` · free delivery over ${money(s.freeDeliveryOver)}` : '');
        }
        function pdpHtml(m, o) {
            const ph = pharmacy(m.pharmacyId);
            const reviews = medReviews(m.id).slice().sort((a, b) => b.at - a.at);
            const avg = medRatingAvg(m.id);
            const map = pharmacyMapHtml(ph, o.mapId);
            return `${o.crumbs}
              <div class="pdp">
                <div class="pdp-media">${medGalleryHtml(m)}</div>
                <div class="pdp-info">
                  <div class="pdp-cat">${catIcon(m.category)} ${esc(m.category)}${m.prescription ? ' <span class="badge badge-rx">Prescription</span>' : ''}</div>
                  <h1 class="pdp-title">${esc(m.name)}</h1>
                  <div class="pdp-rating">${starRow(avg, reviews.length, 16)}</div>
                  <p class="pdp-seller">${o.seller}</p>
                  <div class="pdp-buy">
                    <div class="pdp-price-row">
                      <span class="pdp-price">${money(m.price)}</span>
                      ${m.prescription ? '' : `<span class="stock-line"><span class="${stockDotClass(m.stock)}"></span>${stockText(m.stock)}</span>`}
                    </div>
                    ${o.buy}
                  </div>
                  <ul class="assure">
                    <li>${icon('shield',16)} Listed by a CarePoint-approved pharmacy</li>
                    <li>${icon(DB.settings.pickupEnabled ? 'store' : 'truck',16)} ${availabilityText()}</li>
                    <li>${icon('star',16)} Ratings only from completed orders</li>
                  </ul>
                  <section class="pdp-section">
                    <h2 class="pdp-h">About this remedy</h2>
                    <p class="pdp-desc">${esc(productDescription(m))}</p>
                  </section>
                  <section class="pdp-section pdp-label">
                    <h2 class="pdp-h">Label &amp; specifications</h2>
                    ${specsHtml(m)}
                  </section>
                  ${map ? `<section class="pdp-section">
                    <h2 class="pdp-h">Where it’s kept</h2>
                    <p class="pdp-where">${icon('pin',15)} ${esc(ph.location)} · ${esc(ph.hours)}</p>
                    ${map}
                  </section>` : ''}
                  <section class="pdp-section">
                    <h2 class="pdp-h">Ratings <span class="pdp-h-n">${reviews.length}</span></h2>
                    ${ratingSummary(reviews, avg)}
                    ${o.rateForm || ''}
                    ${reviewsList(reviews, o.emptyReviews)}
                  </section>
                </div>
              </div>`;
        }

        function publicMedicineDetail() {
            const m = medicine(state.publicMedId);
            if (!m) return emptyState('jar', 'We couldn’t find that remedy.', 'It may have been delisted by the pharmacy.', `<button class="btn btn-primary" onclick="App.goPublic('catalog')">Back to the shelf</button>`);
            const ph = pharmacy(m.pharmacyId);
            return pdpHtml(m, {
                crumbs: crumbs("App.goPublic('catalog')", 'The shelf', esc(m.category)),
                mapId: 'publicMedPharmMap',
                seller: `Sold by <strong>${esc(ph ? ph.name : 'a pharmacy')}</strong>${m.brand ? ` <span class="sep-dot">·</span> Brand: <strong>${esc(m.brand)}</strong>` : ''}`,
                buy: `${m.prescription ? `<div class="apo-note"><span class="apo-note-tag">Rx</span><p>This remedy needs a prescription. Once you have an account, the pharmacist can review yours.</p></div>` : ''}
                  <div class="pdp-cta"><button class="btn btn-primary btn-lg" onclick="App.guestPrompt()">${icon('lock',17)} Log in to order</button></div>
                  <p class="hint">Browsing is free — an account is only needed to order or message the pharmacist.</p>`,
                emptyReviews: 'No ratings yet — only customers who received this remedy can rate it.',
            });
        }

        /* ---------- Main router ---------- */
        function mainContent() {
            const role = state.activeRole;
            if (!role || !state.session[role]) return publicScreen();
            if (role === 'customer') return customerView();
            if (role === 'staff') return staffView();
            if (role === 'admin') return adminView();
            return '';
        }

        /* ================= AUTH ================= */
        function authScreen() {
            const view = state.authView;
            const tabs = `<div class="auth-tabs" role="tablist">
                <button role="tab" aria-selected="${view==='login'}" class="${view==='login'?'active':''}" onclick="App.setAuthView('login')">Log in</button>
                <button role="tab" aria-selected="${view==='register'}" class="${view==='register'?'active':''}" onclick="App.setAuthView('register')">Create account</button>
              </div>`;
            let body = '';
            if (view === 'login') body = loginForm();
            else if (view === 'register') body = customerRegisterForm();
            else if (view === 'registerPharmacy') body = staffRegisterForm();

            const copy = {
                login: { kicker: 'Welcome back', title: 'Log in to your <em>apothecary</em>.', sub: 'Your satchel, orders and pharmacist conversations are right where you left them.' },
                register: { kicker: 'New here', title: 'Open an <em>account</em>.', sub: 'Free, and only needed once you are ready to order or message a pharmacist.' },
                registerPharmacy: { kicker: 'For pharmacies', title: 'List your <em>pharmacy</em>.', sub: 'Tell us about your counter. Every application is reviewed by hand before it opens.' },
            }[view] || { kicker: '', title: 'CarePoint', sub: '' };

            const footNote = view === 'registerPharmacy' ?
                `<p class="auth-foot"><a href="#" onclick="event.preventDefault();App.setAuthView('register')">${icon('arrowLeft',14)} Back to customer sign-up</a></p>` :
                view === 'register' ?
                `<p class="auth-foot">Own a pharmacy? <a href="#" onclick="event.preventDefault();App.setAuthView('registerPharmacy')">Register it here</a>.</p>` :
                `<p class="auth-foot">Need an account? <a href="#" onclick="event.preventDefault();App.setAuthView('register')">Create one</a>.</p>`;

            return `<div class="auth-split ${view==='registerPharmacy'?'auth-split--pharmacy':''}">
                <section class="auth-form-col">
                  <div class="auth-form-inner">
                    <button class="crumb-back" onclick="App.goPublic('landing')">${icon('arrowLeft',15)}<span>Keep browsing without an account</span></button>
                    <div class="eyebrow">${copy.kicker}</div>
                    <h1 class="auth-title">${copy.title}</h1>
                    <p class="auth-sub">${copy.sub}</p>
                    ${view!=='registerPharmacy' ? tabs : ''}
                    <div class="auth-body">${body}</div>
                    ${footNote}
                  </div>
                </section>
                ${authPanel(view)}
              </div>`;
        }

        function authPanel(view) {
            const stats = platformStats();
            const pharmacySide = view === 'registerPharmacy';
            const lines = pharmacySide ? [
                ['users', 'Reach the customers already living around your counter'],
                ['mortar', 'Run orders, stock and returns from one workbench'],
                ['lock', 'You create every staff login — nobody signs up on their own'],
            ] : [
                ['shield', 'Every pharmacy is reviewed by hand before it opens'],
                ['star', 'Ratings come only from completed orders'],
                ['quill', 'Prescriptions are checked by a licensed pharmacist'],
            ];
            return `<aside class="auth-panel" aria-label="Why CarePoint">
                <div class="auth-panel-art" aria-hidden="true">${cabinetArt()}</div>
                <div class="auth-panel-copy">
                  <p class="auth-panel-quote">${pharmacySide ? 'Your counter,<br><em>open online.</em>' : 'Real pharmacists.<br>Real medicine.<br><em>Down your street.</em>'}</p>
                  <ul class="auth-ledger">${lines.map(([ic, t]) => `<li>${icon(ic, 18)}<span>${t}</span></li>`).join('')}</ul>
                  <div class="auth-stats mono"><span>${stats.pharmacies} pharmac${stats.pharmacies===1?'y':'ies'} open</span><span>${stats.meds} remedies listed</span></div>
                </div>
              </aside>`;
        }

        /* ================= CUSTOMER ================= */
        function customerView() {
            const v = state.customer.view;
            if (v === 'home') return customerHome();
            if (v === 'medicine') return customerMedicineDetail();
            if (v === 'wishlist') return customerWishlist();
            if (v === 'cart') return customerCart();

            if (v === 'receipt') return customerReceipt();

        /* Unique, alphabetized list of brands currently on the shelf (approved
           pharmacies, listed products only) — feeds the customer Brand filter. */
        function allBrands() {
            const set = new Set();
            DB.medicines.forEach(m => {
                const ph = pharmacy(m.pharmacyId);
                if (ph && ph.status === 'approved' && isListed(m) && m.brand) set.add(m.brand);
            });
            return Array.from(set).sort((a, b) => a.localeCompare(b));
        }

        function filteredMedicines() {
            const q = state.search.query.trim().toLowerCase();
            const min = parseFloat(state.search.priceMin);
            const max = parseFloat(state.search.priceMax);
            let list = DB.medicines.filter(m => {
                const ph = pharmacy(m.pharmacyId);
                if (!ph || ph.status !== 'approved') return false;
                if (!isListed(m)) return false;
                if (state.search.category !== 'All' && m.category !== state.search.category) return false;
                if (state.search.pharmacy !== 'All' && m.pharmacyId !== state.search.pharmacy) return false;
                if (state.search.brand && state.search.brand !== 'All' && m.brand !== state.search.brand) return false;
                if (!isNaN(min) && m.price < min) return false;
                if (!isNaN(max) && m.price > max) return false;
                if (!q) return true;
                return m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q) || ph.name
                .toLowerCase().includes(q);
            });
            const sort = state.search.sort;
            if (sort === 'priceLow') list = list.slice().sort((a, b) => a.price - b.price);
            else if (sort === 'priceHigh') list = list.slice().sort((a, b) => b.price - a.price);
            else if (sort === 'name') list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
            else if (sort === 'brand') list = list.slice().sort((a, b) => (a.brand || '').localeCompare(b.brand || ''));
            else if (sort === 'popularity') list = list.slice().sort((a, b) => (b.sold || 0) - (a.sold || 0));
            else list = list.slice().sort((a, b) => b.addedAt - a.addedAt);
            return list;
        }

        /* -------------------- REVIEW FORM (no comments) -------------------- */
        function reviewFormIfEligible(medId) {
            const custId = state.session.customer;
            if (!custId) return '';

            // Check if the user has a COMPLETED order containing this product AND hasn't reviewed it for that order yet.
            const eligibleOrder = DB.orders.find(o =>
                o.customerId === custId &&
                o.status === 'completed' &&
                o.items.some(it => it.medId === medId) &&
                !DB.reviews.some(r => r.customerId === custId && r.medId === medId && r.orderId === o.id)
            );

            if (!eligibleOrder) {
                const hasOpenOrder = DB.orders.some(o => o.customerId === custId && o.status !== 'cancelled' &&
                    o.status !== 'completed' && o.items.some(it => it.medId === medId));
                if (hasOpenOrder) {
                    return `<div class="apo-note"><span class="apo-note-tag">Note</span><p>You can rate this once your order is completed or you confirm you received it.</p></div>`;
                }
                const alreadyRated = DB.reviews.some(r => r.customerId === custId && r.medId === medId);
                if (alreadyRated) {
                    return `<div class="apo-note"><span class="apo-note-tag">Thanks</span><p>You have already rated this remedy. Order it again to rate it again.</p></div>`;
                }
                return `<div class="apo-note"><span class="apo-note-tag">Note</span><p>Only customers who received this remedy can rate it.</p></div>`;
            }

            return `<div class="rate-box">
                  <div class="rate-box-head">Rate this remedy <span class="mono">Order #${eligibleOrder.id.replace('o','')}</span></div>
                  ${ratingWidget(medId, eligibleOrder.id)}
                </div>`;
        }

            const pct = Math.min(100, subtotal / s.freeDeliveryOver * 100);
            return `<div class="meter">

                  <p>Confirmation sent to <strong>${esc(cust.email)}</strong>.<br>We’ll notify you as the pharmacy prepares your order.</p>
                </div>
                <div class="receipt-actions">
                  <button class="btn btn-primary" onclick="App.setView('customer','orders')">${icon('receipt',16)} View my orders</button>
                  <button class="btn btn-outline" onclick="App.setView('customer','home')">Continue shopping</button>
                </div>
              </div>
            </div>`;
        }

        /* ---------- Payment methods ---------- */
        const PAYMENT_METHODS = [
            { id: 'card', label: 'Card', icon: 'card' },
            { id: 'gcash', label: 'GCash', icon: 'wallet' },
            { id: 'paymaya', label: 'PayMaya', icon: 'wallet' },
            { id: 'paypal', label: 'PayPal', icon: 'globe' },
            { id: 'cod', label: 'Cash on Delivery', icon: 'cash' },
        ];
        const PAYMENT_HINT = {
            card: 'Card payment processed securely.',
            gcash: 'Pay with GCash.',
            paymaya: 'Pay with PayMaya.',
            paypal: 'Pay with PayPal.',
            cod: 'Pay in cash when your order is picked up or delivered.',
        };
        function paymentMethodPicker() {
            const methods = enabledPaymentMethods();
            if (!methods.length) return `<p class="hint">No payment method is currently enabled. Please contact support.</p>`;
            if (!methods.some(pm => pm.id === state.checkout.paymentMethod)) state.checkout.paymentMethod = methods[0].id;
            return `<div class="pay-grid" role="radiogroup" aria-label="Payment method">
                ${methods.map(pm => `<button class="pay-method ${state.checkout.paymentMethod===pm.id?'active':''}" role="radio" aria-checked="${state.checkout.paymentMethod===pm.id}" onclick="App.setPaymentMethod('${pm.id}')">${icon(pm.icon,18)}<span>${pm.label}</span></button>`).join('')}
              </div>`;
        }
        function paymentMethodFields() {
            const method = state.checkout.paymentMethod;
            if (method === 'card') {
                return `<div class="pay-fields">
                    <div class="field"><label for="cardName">Name on card</label><input type="text" id="cardName" placeholder="Juan Dela Cruz" autocomplete="cc-name"></div>
                    <div class="field"><label for="cardNumber">Card number</label><input type="text" id="cardNumber" class="mono-input" placeholder="4242 4242 4242 4242" inputmode="numeric" autocomplete="cc-number"></div>
                    <div class="field-row">
                      <div class="field"><label for="cardExpiry">Expiry</label><input type="text" id="cardExpiry" class="mono-input" placeholder="MM/YY" autocomplete="cc-exp"></div>
                      <div class="field"><label for="cardCvv">CVV</label><input type="text" id="cardCvv" class="mono-input" placeholder="123" inputmode="numeric" autocomplete="cc-csc"></div>
                    </div>
                  </div>`;
            }
            if (method === 'gcash' || method === 'paymaya') {
                const brand = method === 'gcash' ? 'GCash' : 'PayMaya';
                return `<div class="pay-fields">
                    <div class="field"><label for="ewalletNumber">${brand}-registered mobile number</label><input type="text" id="ewalletNumber" class="mono-input" placeholder="09XX XXX XXXX" inputmode="tel" autocomplete="tel"></div>
                    <p class="hint">${method === 'gcash' ? `You’ll be taken to ${brand} to approve this payment, then brought back here.` : `You'll get a one-time PIN in the ${brand} app to confirm this payment.`}</p>
                  </div>`;
            }
            if (method === 'paypal') {
                return `<div class="pay-fields">
                    <div class="field"><label for="paypalEmail">PayPal email</label><input type="email" id="paypalEmail" placeholder="you@example.com" autocomplete="email"></div>
                    <p class="hint">You'll be redirected to PayPal to confirm this payment.</p>
                  </div>`;
            }
            return `<div class="apo-note"><span class="apo-note-tag">Cash</span><p>Have the exact amount ready — payment is collected in cash on pickup or delivery.</p></div>`;
        }

        function customerOrders() {
            const myOrders = DB.orders.filter(o => o.customerId === state.session.customer).sort((a, b) => b.createdAt - a
                .createdAt);
            if (myOrders.length === 0) return pageHead('My Orders', 'Every order you place lands here, from pending to received.', '', 'Orders') +
                `<div class="card">${emptyState('pad', 'No orders yet.', 'When you place an order, you can follow it here from the counter to your hands.', `<button class="btn btn-primary" onclick="App.setView('customer','home')">Browse the shelf</button>`)}</div>`;
            const ordersPage = paginate(myOrders, 'customerOrders');
            const open = myOrders.filter(o => o.status !== 'completed' && o.status !== 'cancelled').length;
            return pageHead('My Orders', `${myOrders.length} order${myOrders.length===1?'':'s'}${open ? ` · <strong>${open} in progress</strong>` : ''}`, '', 'Orders') +
                `<section class="panel"><div class="table-wrap"><table class="data">
                  <thead><tr><th>Order</th><th>Pharmacy</th><th>Fulfillment</th><th class="text-right">Total</th><th class="col-status">Status</th><th>Placed</th><th class="col-actions"><span class="sr-only">Actions</span></th></tr></thead>
                  <tbody>${ordersPage.items.map(o=>`<tr>
                    <td class="mono strong">#${o.id.replace('o','')}</td><td>${esc(pharmacyName(o.pharmacyId))}</td>
                    <td><span class="ful">${icon(o.fulfillment==='pickup'?'store':'truck',15)} <span style="text-transform:capitalize;">${o.fulfillment}</span></span></td>
                    <td class="text-right mono">${money(orderTotal(o))}</td>
                    <td class="col-status">${statusPill(o.status)}</td><td class="mono muted nowrap">${fmtDate(o.createdAt)}</td>
                    <td class="col-actions"><button class="btn btn-outline btn-xs" onclick="App.openOrder('customer','${o.id}')">View</button></td>
                  </tr>`).join('')}</tbody>
                </table></div>${paginationHtml('customerOrders', ordersPage.page, ordersPage.totalPages)}</section>`;
        }

        /* Order items keep a price snapshot, so a delisted medicine still renders sensibly. */
        function orderItemMed(it) {
            return medicine(it.medId) || { id: it.medId, name: 'Delisted item', category: 'Pain Relief',
                price: it.price, stock: 0, prescription: false };
        }

        function orderAddressText(o) {
            const c = customer(o.customerId);
            const addr = c && c.addresses ? c.addresses.find(a => a.id === o.addressId) : null;
            return addr ? addr.text : 'address on file';
        }

        /* Horizontal order stepper. The fill grows to the current step and
           the current node pulses, so a status change reads as movement. */
        const STEP_ICON = { pending: 'receipt', confirmed: 'mortar', ready: 'store', completed: 'leaf' };
        function bloomTimeline(o) {
            if (o.status === 'cancelled') {
                return `<div class="timeline-cancelled" role="status">${icon('close',18)}<div><strong>This order was cancelled.</strong><span>Contact the pharmacy if this was a mistake.</span></div></div>`;
            }
            const idx = Math.max(0, STATUS_FLOW.indexOf(o.status));
            const pct = (idx / (STATUS_FLOW.length - 1)) * 100;
            const sub = { pending: 'Received by the pharmacy', confirmed: 'Being prepared', ready: o.fulfillment === 'pickup' ? 'Waiting at the counter' : 'On its way to you', completed: 'In your hands' };
            return `<div class="timeline" style="--progress:${pct}%">
                <div class="timeline-track" aria-hidden="true"><div class="timeline-fill"></div></div>
                <ol class="timeline-steps">${STATUS_FLOW.map((s, i) => {
                  const done = i < idx || (i === idx && i === STATUS_FLOW.length - 1);
                  const cls = done ? 'is-done' : i === idx ? 'is-current' : 'is-todo';
                  return `<li class="timeline-step ${cls}" ${i===idx?'aria-current="step"':''}>
                      <span class="timeline-node">${icon(done ? 'check' : STEP_ICON[s], 16)}</span>
                      <span class="timeline-label">${STATUS_LABEL[s]}</span>
                      <span class="timeline-sub">${sub[s]}</span>
                    </li>`;
                }).join('')}</ol>
              </div>`;
        }
        function orderHeadline(o) {
            return { pending: 'Received by the pharmacy', confirmed: 'Being prepared', ready: o.fulfillment === 'pickup' ? 'Ready for pickup' : 'Out for delivery',
                completed: 'Completed', cancelled: 'Cancelled' }[o.status] || STATUS_LABEL[o.status];
        }
        function orderItemsTable(o) {
            return `<div class="table-wrap table-wrap--flat"><table class="data">
                <thead><tr><th>Item</th><th class="text-center">Qty</th><th class="text-right">Unit</th><th class="text-right">Subtotal</th></tr></thead>
                <tbody>${o.items.map(it=>{ const m=orderItemMed(it); return `<tr><td><div class="cell-with-thumb">${medPicture(m,44)}<span class="cell-text">${esc(m.name)}</span></div></td><td class="text-center mono">${it.qty}</td><td class="text-right mono muted">${money(it.price)}</td><td class="text-right mono">${money(it.price*it.qty)}</td></tr>`; }).join('')}</tbody>
                <tfoot><tr><td colspan="3">Total</td><td class="text-right mono">${money(orderTotal(o))}</td></tr></tfoot>
              </table></div>`;
        }

        function customerOrderDetail() {
            const o = order(state.customer.orderId);
            if (!o) return `<div class="card">${emptyState('pad', 'Order not found.', '', '')}</div>`;
            const ph = pharmacy(o.pharmacyId);
            const relatedThread = DB.threads.find(t => t.orderId === o.id);
            const ret = orderReturn(o.id);
            return `${crumbs("App.setView('customer','orders')", 'My orders', 'Order #' + o.id.replace('o',''))}
                <header class="order-head">
                  <div>
                    <div class="eyebrow mono">Order #${o.id.replace('o','')} · placed ${fmtDate(o.createdAt)}</div>
                    <h1 class="page-title">${orderHeadline(o)}</h1>
                    <p class="page-sub">${esc(pharmacyName(o.pharmacyId))}</p>
                  </div>
                  ${statusPill(o.status)}
                </header>
                <section class="card timeline-card">${bloomTimeline(o)}</section>
                <div class="split split--detail">
                  <section class="card">
                    <h2 class="card-title">Items</h2>
                    ${orderItemsTable(o)}
                  </section>
                  <aside class="card">
                    <h2 class="card-title">Details</h2>
                    <dl class="detail-list">
                      <div><dt>${icon(o.fulfillment==='pickup'?'store':'truck',15)} Fulfillment</dt><dd>${o.fulfillment==='pickup' ? 'Pickup at '+esc(ph ? ph.location : 'the pharmacy') : 'Delivery to '+esc(orderAddressText(o))}</dd></div>
                      <div><dt>${icon('card',15)} Payment</dt><dd><span class="pay-summary">${orderPaymentIcon(o)} ${esc(orderPaymentLabel(o))}</span></dd></div>
                      ${ph ? `<div><dt>${icon('clock',15)} Pharmacy hours</dt><dd>${esc(ph.hours)}</dd></div>` : ''}
                    </dl>
                    ${o.fulfillment==='pickup' ? pharmacyMapHtml(ph, 'orderDetailPharmMap') : ''}
                  </aside>
                </div>
                ${ret ? `<div class="apo-note"><span class="apo-note-tag">Return</span><p><strong>Return ${RETURN_LABEL[ret.status]}</strong> — ${esc(ret.reason)}${ret.refundAmount!=null?` · ${money(ret.refundAmount)} refunded`:''}</p></div>` : ''}
                ${orderRatingSection(o)}
                <div class="action-bar" role="toolbar" aria-label="Order actions">
                  <div class="action-bar-text">${canConfirmReceipt(o) ? 'Confirming receipt completes the order and unlocks rating for these items.' : 'Questions about this order? The pharmacist is a message away.'}</div>
                  <div class="action-bar-btns">
                    <button class="btn btn-outline" onclick="${relatedThread ? `App.openThread('customer','${relatedThread.id}')` : `App.newOrderMessage('${o.id}')`}">${icon('message',16)} Message pharmacist</button>
                    <button class="btn btn-ghost" onclick="App.emailReceipt('${o.id}')">${icon('envelope',16)} Email my receipt</button>
                    ${o.status==='completed' && !ret ? `<button class="btn btn-ghost" onclick="App.requestReturn('${o.id}')">${icon('returns',16)} Request return</button>` : ''}
                    ${canConfirmReceipt(o) ? `<button class="btn btn-sage" onclick="App.confirmReceived('${o.id}')">${icon('check',16)} I received this order</button>` : ''}
                  </div>
                </div>`;
        }

        /* A customer may close the loop themselves once the pharmacy has the order ready. */
        function canConfirmReceipt(o) {
            return o.customerId === state.session.customer && (o.status === 'ready' || o.status === 'confirmed');
        }

        function orderRatingSection(o) {
            if (o.customerId !== state.session.customer) return '';
            if (o.status !== 'completed') {
                if (o.status === 'cancelled') return '';
                return `<section class="card rate-card rate-card--locked">
                    <div>${icon('lock',18)}</div>
                    <div><h2 class="card-title">Rate your medicines</h2>
                    <p class="hint">You can rate these items once the order is completed or you confirm you received them.</p></div>
                  </section>`;
            }
            return `<section class="card rate-card">
                <h2 class="card-title">Rate your medicines</h2>
                <p class="hint">Order received — tell the neighborhood how these worked out for you.</p>
                <div class="rate-list">
                ${o.items.map(it => {
                  const m = orderItemMed(it);
                  const existing = DB.reviews.find(r => r.medId === it.medId && r.customerId === o.customerId && r.orderId === o.id);
                  return `<div class="rate-row">
                      <div class="cell-with-thumb">${medPicture(m,46)}<span class="cell-text"><strong>${esc(m.name)}</strong></span></div>
                      ${existing
                        ? `<div class="rated">${starRow(existing.rating,null,14)}<span class="hint">Your rating · ${fmtDate(existing.at)}</span></div>`
                        : `<div class="rate-inline">${ratingWidget(it.medId, o.id)}</div>`}
                    </div>`;
                }).join('')}
                </div>
              </section>`;
        }

        /* Shared star picker used on the medicine page and inside a completed order. */
        const RATING_WORD = { 1: 'Poor', 2: 'Fair', 3: 'Good', 4: 'Very good', 5: 'Excellent' };
        function ratingWidget(medId, orderId) {
            const key = medId + '|' + orderId;
            const draft = state.reviewDraft[key] || { rating: 5 };
            return `<div class="star-input" role="radiogroup" aria-label="Rating">
                ${[1,2,3,4,5].map(i => `<button type="button" class="star-btn ${draft.rating >= i ? 'is-on' : ''}" role="radio" aria-checked="${draft.rating === i}" aria-label="${i} star${i===1?'':'s'}" onclick="App.setReviewRating('${medId}','${orderId}', ${i})">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">${ICONS.star}</svg>
                  </button>`).join('')}
                <span class="star-word">${RATING_WORD[draft.rating] || ''}</span>
              </div>
              <button class="btn btn-primary btn-sm" onclick="App.submitReview('${medId}','${orderId}')">Submit rating</button>`;
        }

        function customerMessages() {
            const myThreads = DB.threads.filter(t => t.customerId === state.session.customer);
            const uploadBtn =
                `<button class="btn btn-primary" onclick="App.newPrescriptionUpload()">${icon('camera',16)} Upload a prescription</button>`;
            if (myThreads.length === 0) return pageHead('Messages', 'Talk to the pharmacist behind the counter.', uploadBtn, 'Counter') +
                `<div class="card">${emptyState('envelope', 'No conversations yet.', 'Ask about a prescription, an order, or how to take something — a pharmacist will reply here.')}</div>`;
            const threadsPage = paginate(myThreads, 'customerMessages');
            return pageHead('Messages', 'Talk to the pharmacist behind the counter.', uploadBtn, 'Counter') +
                `<div class="thread-list">${threadsPage.items.map(threadRow('customer')).join('')}</div>${paginationHtml('customerMessages', threadsPage.page, threadsPage.totalPages)}`;
        }

        function threadRow(role) {
            return function(t) {
                const last = t.messages[t.messages.length - 1];
                const ph = pharmacy(t.pharmacyId);
                const hasImage = t.messages.some(m => m.image);
                const isUnread = role === 'customer' ? t.unreadForCustomer : t.unreadForStaff;
                const other = role === 'customer' ? (ph ? ph.name : 'Pharmacy') : customerName(t.customerId);
                let preview = 'No messages yet';
                if (last) {
                    if (last.text) preview = esc(last.text.slice(0, 72)) + (last.text.length > 72 ? '…' : '');
                    else if (last.image) preview = 'Rx photo attached';
                }
                return `<button class="thread-row ${isUnread?'is-unread':''}" onclick="App.openThread('${role}','${t.id}')">
                  <span class="avatar ${t.type==='prescription'?'avatar--rx':''}">${t.type==='prescription' ? icon('quill',16) : initials(other)}</span>
                  <span class="thread-main">
                    <span class="thread-top">
                      <span class="thread-subject">${isUnread?'<span class="row-unread-dot" title="New"></span>':''}${esc(t.subject)}${hasImage?` <span class="thread-clip" title="Has a photo">${icon('camera',13)}</span>`:''}</span>
                      <span class="thread-time mono">${last ? fmtDate(last.at) : ''}</span>
                    </span>
                    <span class="thread-preview"><strong>${esc(other)}</strong> · ${preview}</span>
                  </span>
                  <span class="thread-tags"><span class="tag">${t.type==='prescription' ? 'Rx inquiry' : 'Order'}</span><span class="badge badge-${t.status}">${t.status}</span></span>
                </button>`;
            };
        }

        function threadView(role) {
            const id = state[role].threadId;
            const t = thread(id);
            if (!t) return `<div class="card">${emptyState('envelope', 'Conversation not found.', '', '')}</div>`;
            const other = role === 'customer' ? pharmacyName(t.pharmacyId) : customerName(t.customerId);
            const mineFrom = role === 'staff' ? 'staff' : 'customer';
            return `${crumbs(`App.setView('${role}','messages')`, role === 'customer' ? 'Messages' : 'Counter', '')}
                <div class="convo">
                  <header class="convo-head">
                    <span class="avatar ${t.type==='prescription'?'avatar--rx':''}">${t.type==='prescription' ? icon('quill',16) : initials(other)}</span>
                    <div class="convo-title">
                      <h1>${esc(t.subject)}</h1>
                      <p>${t.type==='prescription' ? 'Prescription inquiry' : 'Order-related'} · with ${esc(other)}</p>
                    </div>
                    <div class="convo-head-actions">
                      <span class="badge badge-${t.status}">${t.status}</span>
                      ${role==='staff' && t.status==='open' ? `<button class="btn btn-sage btn-sm" onclick="App.resolveThread('${t.id}')">${icon('check',15)} Mark resolved</button>` : ''}
                    </div>
                  </header>
                  <div class="convo-body">
                    ${t.messages.map(m => {
                      const mine = m.from === mineFrom;
                      const who = mine ? 'You' : (m.from === 'staff' ? esc(pharmacyName(t.pharmacyId)) : esc(customerName(t.customerId)));
                      return `<div class="thread-msg ${m.from} ${mine?'mine':'theirs'}">${m.image?`<img src="${m.image}" alt="Prescription photo" onclick="App.openLightbox(this.src)">`:''}${m.text?`<div class="thread-msg-text">${esc(m.text)}</div>`:''}<div class="meta">${who} · ${fmtDate(m.at)}</div></div>`;
                    }).join('') || `<div class="convo-empty">${illustration('envelope')}<p>Say hello to start the conversation.</p></div>`}
                  </div>
                  <div class="convo-compose">
                    <label class="sr-only" for="msgText">Your message</label>
                    <textarea id="msgText" rows="2" placeholder="Type your message…"></textarea>
                    <div class="convo-compose-bar">
                      ${role==='customer' ? (state.pendingImage
                        ? `<div class="img-preview"><img src="${state.pendingImage.dataUrl}" alt="Prescription photo to send"><button aria-label="Remove photo" onclick="App.clearPendingImage()">${icon('close',12)}</button></div>`
                        : `<label class="upload-btn">${icon('camera',16)} Attach Rx photo<input type="file" accept="image/*" onchange="App.handleImageSelect(this)"></label>`) : '<span></span>'}
                      <button class="btn btn-primary" onclick="App.sendMessage('${role}','${t.id}')">Send ${icon('arrowRight',15)}</button>
                    </div>
                    ${role==='customer' ? `<p class="hint">Attach a clear, well-lit photo of the whole prescription.</p>` : ''}
                  </div>
                </div>`;
        }

        function customerProfile() {
            const c = currentCustomer();
            return pageHead('Profile', 'Your account details and delivery addresses.', `<button class="btn btn-ghost" onclick="App.logout()">${icon('logout',16)} Log out</button>`, 'Account') +
                `<div class="split split--even">
                  <section class="card">
                    <h2 class="card-title">Account</h2>
                    <div class="field"><label for="custName">Name</label><input type="text" id="custName" value="${esc(c.name)}" autocomplete="name"></div>
                    <div class="field"><label for="custEmail">Email</label><input type="email" id="custEmail" value="${esc(c.email)}" autocomplete="email"></div>
                    <button class="btn btn-primary" onclick="App.saveCustomerProfile()">Save changes</button>
                  </section>
                  <section class="card">
                    <h2 class="card-title">Addresses</h2>
                    <div class="addr-list">
                    ${c.addresses.map(a=>`<div class="addr">
                        <span class="addr-icon">${icon('pin',16)}</span>
                        <div class="addr-text"><strong>${esc(a.label)}</strong><span>${esc(a.text)}</span></div>
                        <button class="btn btn-ghost btn-xs" onclick="App.removeAddress('${a.id}')">Remove</button>
                      </div>`).join('') || `<p class="hint">No saved addresses yet.</p>`}
                    </div>
                    <div class="form-divider"><span>Add an address</span></div>
                    <div class="field-row field-row--addr">
                      <div class="field"><label for="newAddrLabel">Label</label><input type="text" id="newAddrLabel" placeholder="Home, Office…"></div>
                      <div class="field"><label for="newAddrText">Address</label><input type="text" id="newAddrText" placeholder="Street, district" autocomplete="street-address"></div>
                    </div>
                    <button class="btn btn-outline" onclick="App.addAddress()">${icon('plus',15)} Add address</button>
                  </section>
                </div>`;
        }

        /* ================= STAFF ================= */
        function staffView() {
            const v = state.staff.view;
            if (v === 'orders') return staffOrders();
            if (v === 'orderDetail') return staffOrderDetail();
            if (v === 'listings') return staffListings();
            if (v === 'inventory') return staffInventory();
            if (v === 'returns') return staffReturns();
            if (v === 'notices') return staffNotifications();
            if (v === 'messages') return staffMessages();
            if (v === 'thread') return threadView('staff');
            if (v === 'sales') return staffSales();
            if (v === 'team') return isPharmacyOwner() ? staffTeam() : staffOrders();
            if (v === 'profile') return staffProfile();
            return '';
        }

        function staffOrders() {
            const ph = currentStaffPharmacy();
            const all = DB.orders.filter(o => o.pharmacyId === ph.id);
            const newOrders = all.filter(o => o.status === 'pending').length;
            const openMsgs = unreadForStaffPharmacy(ph.id);
            const lowStock = DB.medicines.filter(m => m.pharmacyId === ph.id && !m.prescription && m.stock <= 10).length;
            const filter = state.staff.orderFilter;
            const filtered = all.filter(o => filter === 'all' ? true :
                    filter === 'toPrepare' ? o.status === 'pending' :
                    filter === 'beingMade' ? (o.status === 'confirmed' || o.status === 'ready') :
                    o.status === filter)
                .sort((a, b) => b.createdAt - a.createdAt);
            const filteredPage = paginate(filtered, 'staffOrders');
            const inProgress = all.filter(o => o.status === 'confirmed' || o.status === 'ready').length;
            const owner = isPharmacyOwner();
            const emptyText = { toPrepare: 'No new orders waiting — the counter is clear.', beingMade: 'Nothing is being prepared right now.',
                completed: 'No completed orders yet.', cancelled: 'No cancelled orders.', all: 'Orders from customers will appear here.' }[filter];
            return pageHead('Workbench', `${esc(ph.name)} · ${todayLabel()}`, '', 'Today at the counter') +
                `<div class="stat-row">
                  ${statCard('New orders', newOrders, { icon: 'bell', tone: newOrders ? 'alert' : '', note: newOrders ? 'Waiting to be confirmed' : 'Nothing waiting', onclick: "App.setStaffFilter('toPrepare')" })}
                  ${statCard('Being prepared', inProgress, { icon: 'mortar', note: 'Confirmed or ready', onclick: "App.setStaffFilter('beingMade')" })}
                  ${statCard('Unread messages', openMsgs, { icon: 'message', tone: openMsgs ? 'info' : '', note: openMsgs ? 'Customers waiting on a reply' : 'Inbox clear', onclick: "App.setView('staff','messages')" })}
                  ${statCard('Low stock', lowStock, { icon: 'box', tone: lowStock ? 'warn' : '', note: 'OTC items at 10 or fewer', onclick: owner ? "App.setView('staff','inventory')" : '' })}
                </div>
                <section class="panel">
                  <div class="panel-head">

            const body = `
                <fieldset class="form-section-plain">

                    <div class="field"><label for="medBrand">Brand</label><input type="text" id="medBrand" value="${m?esc(m.brand||''):''}" placeholder="e.g. Unilab, Pfizer, GSK"></div>
                  </div>

                    </div>

                    <div class="field"><label for="medStock">Stock</label><input type="text" id="medStock" class="mono-input" value="${m?m.stock:''}" placeholder="50" inputmode="numeric"></div>
                  </div>

                    <div class="field"><label for="medThreshold">Low-stock alert at</label><input type="text" id="medThreshold" class="mono-input" value="${m&&m.lowStockThreshold!=null?m.lowStockThreshold:''}" placeholder="${DB.settings.lowStockThreshold}" inputmode="numeric"></div>
                    <div class="field"><label for="medStatus">Status</label>
                      <select id="medStatus">
                        <option value="active" ${status==='active'?'selected':''}>Active — visible to shoppers</option>
                        <option value="inactive" ${status==='inactive'?'selected':''}>Inactive — hidden</option>
                      </select>
                    </div>
                  </div>
                  <label class="check"><input type="checkbox" id="medPrescription" ${m&&m.prescription?'checked':''}><span>Requires prescription</span></label>

                  </label>
                  <div class="img-strip">
                    ${imgs.map((src,i)=>`<div class="img-thumb" style="background-image:url('${src}');">

                      </div>`).join('') || `<p class="hint">No images uploaded yet.</p>`}
                  </div>
                </fieldset>`;

                </div>`;

        /* ---------- Inventory ---------- */
        function staffInventory() {
            const ph = currentStaffPharmacy();
            const meds = pharmacyMedicines(ph.id);
            const low = lowStockMedicines(ph.id);
            const out = outOfStockMedicines(ph.id);
            const units = meds.reduce((s, m) => s + m.stock, 0);
            const value = meds.reduce((s, m) => s + m.stock * m.price, 0);
            const sorted = meds.slice().sort((a, b) => a.stock - b.stock);
            const sortedPage = paginate(sorted, 'staffInventory');
            return pageHead('Inventory', `${esc(ph.name)} · stock levels and alerts`, '', 'Stockroom') +
                `<div class="stat-row stat-row--5">
                  ${statCard('Products', meds.length, { icon: 'jar' })}
                  ${statCard('Units on hand', units, { icon: 'box' })}
                  ${statCard('Low stock', low.length, { icon: 'bell', tone: low.length ? 'warn' : '' })}
                  ${statCard('Out of stock', out.length, { icon: 'close', tone: out.length ? 'alert' : '' })}
                  ${statCard('Stock value', money(value), { icon: 'cash' })}
                </div>
                ${(low.length || out.length) ? `<section class="panel panel--alert">
                    <div class="panel-head"><h2 class="panel-title">${icon('bell',16)} Stock alerts <span class="seg-n">${low.length + out.length}</span></h2></div>
                    <ul class="alert-list">
                    ${out.map(m=>`<li class="alert-row"><span class="badge badge-cancelled">Out</span><span class="alert-name">${esc(m.name)}</span><span class="alert-meta mono">0 left</span>
                        <button class="btn btn-sage btn-xs" onclick="App.adjustStock('${m.id}',25)">Restock +25</button></li>`).join('')}
                    ${low.map(m=>`<li class="alert-row"><span class="badge badge-pending">Low</span><span class="alert-name">${esc(m.name)}</span><span class="alert-meta mono">${m.stock} left · alert at ${lowStockThreshold(m)}</span>
                        <button class="btn btn-sage btn-xs" onclick="App.adjustStock('${m.id}',25)">Restock +25</button></li>`).join('')}
                    </ul>
                  </section>` : `<div class="all-good">${icon('check',16)} Every product is comfortably in stock.</div>`}
                <section class="panel">
                  <div class="panel-head"><h2 class="panel-title">Stock ledger</h2><span class="panel-meta">Lowest stock first</span></div>
                  <div class="table-wrap"><table class="data">
                    <thead><tr><th>Product</th><th class="text-right">On hand</th><th class="text-right">Sold</th><th class="text-right">Alert at</th><th class="col-status">Status</th><th class="col-actions">Adjust</th></tr></thead>
                    <tbody>${sortedPage.items.map(m=>{
                      const st = m.stock === 0 ? 'out' : isLowStock(m) ? 'low' : 'ok';
                      const badge = st==='out' ? '<span class="badge badge-cancelled">Out</span>' : st==='low' ? '<span class="badge badge-pending">Low</span>' : '<span class="badge badge-active">In stock</span>';
                      return `<tr>
                        <td><div class="cell-with-thumb">${medPicture(m,40)}<span class="cell-text">${esc(m.name)}</span></div></td>
                        <td class="text-right mono"><span class="${stockDotClass(m.stock)}"></span> ${m.stock}</td>
                        <td class="text-right mono muted">${m.sold||0}</td>
                        <td class="text-right"><input type="text" class="cell-input mono-input" aria-label="Low-stock alert level for ${esc(m.name)}" value="${lowStockThreshold(m)}" onchange="App.setLowStockThreshold('${m.id}', this.value)"></td>
                        <td class="col-status">${badge}</td>
                        <td class="col-actions"><div class="row-actions">
                          <div class="stepper-mini">
                            <button aria-label="Remove one ${esc(m.name)}" onclick="App.adjustStock('${m.id}',-1)">−1</button>
                            <button aria-label="Add one ${esc(m.name)}" onclick="App.adjustStock('${m.id}',1)">+1</button>
                            <button aria-label="Add ten ${esc(m.name)}" onclick="App.adjustStock('${m.id}',10)">+10</button>
                          </div>
                          <button class="btn btn-outline btn-xs" onclick="App.setStockPrompt('${m.id}')">Set…</button>
                        </div></td>
                      </tr>`;
                    }).join('') || `<tr><td colspan="6" class="table-empty">No products yet.</td></tr>`}</tbody>
                  </table></div>
                  ${paginationHtml('staffInventory', sortedPage.page, sortedPage.totalPages)}
                </section>`;
        }

        /* ---------- Returns & refunds ---------- */
        function staffReturns() {
            const ph = currentStaffPharmacy();
            const all = pharmacyReturns(ph.id).slice().sort((a, b) => b.at - a.at);
            const f = state.staff.returnFilter;
            const list = all.filter(r => f === 'all' ? true : r.status === f);
            const listPage = paginate(list, 'staffReturns');
            const refunded = all.filter(r => r.status === 'refunded');
            const refundTotal = refunded.reduce((s, r) => s + (r.refundAmount || 0), 0);
            const requested = all.filter(r=>r.status==='requested').length;
            return pageHead('Returns &amp; Refunds', esc(ph.name), '', 'After-care') +
                `<div class="stat-row">
                  ${statCard('Awaiting review', requested, { icon: 'bell', tone: requested ? 'alert' : '', onclick: "App.setReturnFilter('requested')" })}
                  ${statCard('Approved', all.filter(r=>r.status==='approved').length, { icon: 'check', onclick: "App.setReturnFilter('approved')" })}
                  ${statCard('Refunded', refunded.length, { icon: 'returns', onclick: "App.setReturnFilter('refunded')" })}
                  ${statCard('Refunded value', money(refundTotal), { icon: 'cash' })}
                </div>
                <section class="panel">
                  <div class="panel-head">
                    ${segTabs([['all','All'],['requested','Requested'],['approved','Approved'],['refunded','Refunded'],['rejected','Rejected']], f, k => `App.setReturnFilter('${k}')`)}
                  </div>
                  ${list.length ? `<div class="table-wrap"><table class="data">
                    <thead><tr><th>Order</th><th>Customer</th><th>Reason</th><th class="text-right">Order total</th><th class="col-status">Status</th><th>Requested</th><th class="col-actions"><span class="sr-only">Actions</span></th></tr></thead>
                    <tbody>${listPage.items.map(r=>{
                      const o = order(r.orderId);
                      return `<tr>
                        <td class="mono strong">#${r.orderId.replace('o','')}</td>
                        <td>${esc(customerName(r.customerId))}</td>
                        <td class="wrap">${esc(r.reason)}</td>
                        <td class="text-right mono">${o ? money(orderTotal(o)) : '—'}</td>
                        <td class="col-status"><span class="badge ${RETURN_BADGE[r.status]}">${RETURN_LABEL[r.status]}</span>${r.refundAmount!=null?`<span class="cell-sub mono">${money(r.refundAmount)}</span>`:''}</td>
                        <td class="mono muted nowrap">${fmtDate(r.at)}</td>
                        <td class="col-actions"><div class="row-actions">
                          ${r.status==='requested' ? `<button class="btn btn-sage btn-xs" onclick="App.approveReturn('${r.id}')">Approve</button>
                            <button class="btn btn-danger btn-xs" onclick="App.rejectReturn('${r.id}')">Reject</button>` : ''}

                        </div></td>
                      </tr>`;
                    }).join('')}</tbody>
                  </table></div>${paginationHtml('staffReturns', listPage.page, listPage.totalPages)}` : emptyState('ledger', 'No return requests.', 'Returns raised by customers or recorded from an order appear here.', '', 'inline')}
                </section>`;
        }

            const onCount = NOTIF_EVENTS.filter(e => tpls[e.id] && tpls[e.id].enabled).length;
            return pageHead('Notices', 'Automated messages and announcements sent to your customers.', '', 'Outreach') +
                `<div class="ops-split ops-split--notices">

                      const t = tpls[e.id];
                      return `<div class="tpl ${t.enabled?'':'is-off'}">

        /* Rounds a chart maximum up to a clean tick value. */
        function niceCeil(v) {
            if (!(v > 0)) return 1;
            const p = Math.pow(10, Math.floor(Math.log10(v)));
            const n = v / p;
            return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
        }

        function staffSales() {
            const ph = currentStaffPharmacy();
            const orders = DB.orders.filter(o => o.pharmacyId === ph.id);
            const completed = orders.filter(o => o.status === 'completed');
            const cancelled = orders.filter(o => o.status === 'cancelled');
            const revenue = completed.reduce((s, o) => s + orderTotal(o), 0);
            const aov = completed.length ? revenue / completed.length : 0;
            const refunds = pharmacyReturns(ph.id).filter(r => r.status === 'refunded')
                .reduce((s, r) => s + (r.refundAmount || 0), 0);
            const days = state.staff.salesRange;
            const since = Date.now() - days * 864e5;
            const inRange = completed.filter(o => new Date(o.createdAt).getTime() >= since);
            const rangeRevenue = inRange.reduce((s, o) => s + orderTotal(o), 0);

            /* Product performance */
            const perf = {};
            completed.forEach(o => o.items.forEach(it => {
                if (!perf[it.medId]) perf[it.medId] = { units: 0, revenue: 0 };
                perf[it.medId].units += it.qty;
                perf[it.medId].revenue += it.price * it.qty;
            }));
            const perfRows = Object.entries(perf).map(([medId, p]) => ({ med: orderItemMed({ medId, price: 0 }), ...p }))
                .sort((a, b) => b.revenue - a.revenue);

            /* Customer insights */
            const byCustomer = {};
            orders.forEach(o => {
                if (!byCustomer[o.customerId]) byCustomer[o.customerId] = { orders: 0, spend: 0 };
                byCustomer[o.customerId].orders++;
                if (o.status === 'completed') byCustomer[o.customerId].spend += orderTotal(o);
            });
            const custRows = Object.entries(byCustomer).map(([id, c]) => ({ id, ...c }))
                .sort((a, b) => b.spend - a.spend);
            const repeat = custRows.filter(c => c.orders > 1).length;
            const avgItems = orders.length ? (orders.reduce((s, o) => s + o.items.reduce((n, it) => n + it.qty, 0), 0) /
                orders.length).toFixed(1) : '0.0';

            /* Daily trend over the selected range */
            const buckets = [];
            const span = Math.min(days, 14);
            for (let i = span - 1; i >= 0; i--) {
                const start = new Date();
                start.setHours(0, 0, 0, 0);
                start.setDate(start.getDate() - i);
                const end = new Date(start);
                end.setDate(end.getDate() + 1);
                const dayOrders = completed.filter(o => { const t = new Date(o.createdAt); return t >= start && t < end; });
                buckets.push({ label: start.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' }),
                    total: dayOrders.reduce((s, o) => s + orderTotal(o), 0) });
            }
            const maxBucket = Math.max(0, ...buckets.map(b => b.total));
            const top = niceCeil(maxBucket);
            const maxIdx = maxBucket > 0 ? buckets.findIndex(b => b.total === maxBucket) : -1;

            return pageHead('Sales &amp; Analytics', esc(ph.name),
                    segTabs([[7,'7 days'],[30,'30 days'],[365,'1 year']], days, d => `App.setSalesRange(${d})`), 'Business') +
                `<div class="stat-row stat-row--6">
                  ${statCard('Revenue · range', money(rangeRevenue), { note: `Completed orders, last ${days} days` })}
                  ${statCard('Lifetime revenue', money(revenue))}
                  ${statCard('Avg. order value', money(aov))}
                  ${statCard('Total orders', orders.length)}
                  ${statCard('Cancelled', cancelled.length, { tone: cancelled.length ? 'warn' : '' })}
                  ${statCard('Refunded', money(refunds))}
                </div>
                <section class="panel">
                  <div class="panel-head"><h2 class="panel-title">Daily revenue</h2><span class="panel-meta">Completed orders · last ${span} days</span></div>
                  <div class="colchart ${span > 7 ? 'colchart--dense' : ''}" role="img" aria-label="Daily completed-order revenue for the last ${span} days. Highest day: ${maxIdx > -1 ? esc(buckets[maxIdx].label) + ', ' + money(maxBucket) : 'no sales yet'}.">
                    <div class="colchart-y mono" aria-hidden="true"><span>${money(top)}</span><span>${money(top / 2)}</span><span>${money(0)}</span></div>
                    <div class="colchart-plot">
                      ${buckets.map((b, i) => `<div class="col" tabindex="0" data-tip="${esc(b.label)} · ${money(b.total)}">
                          <div class="col-bar ${b.total ? '' : 'is-zero'}" style="height:${b.total / top * 100}%">${i === maxIdx ? `<span class="col-val mono">${money(b.total)}</span>` : ''}</div>
                          <span class="col-x mono">${esc(b.label)}</span>
                        </div>`).join('')}
                    </div>
                  </div>
                </section>
                <div class="split split--even">
                  <section class="panel">
                    <div class="panel-head"><h2 class="panel-title">Product performance</h2></div>
                    ${perfRows.length ? `<div class="table-wrap"><table class="data">
                      <thead><tr><th>Product</th><th class="text-right">Units</th><th class="text-right">Revenue</th><th class="text-right">In stock</th><th class="text-right">Rating</th></tr></thead>
                      <tbody>${perfRows.map(r=>`<tr>
                        <td><div class="cell-with-thumb">${medPicture(r.med,36)}<span class="cell-text">${esc(r.med.name)}</span></div></td>
                        <td class="text-right mono">${r.units}</td><td class="text-right mono">${money(r.revenue)}</td>
                        <td class="text-right mono muted">${r.med.stock}</td>
                        <td class="text-right mono">${medReviews(r.med.id).length ? medRatingAvg(r.med.id).toFixed(1)+' ★' : '—'}</td>
                      </tr>`).join('')}</tbody>
                    </table></div>` : emptyState('ledger','No completed sales yet.', 'Product revenue appears once orders are completed.', '', 'inline')}
                  </section>
                  <section class="panel">
                    <div class="panel-head"><h2 class="panel-title">Customer insights</h2></div>
                    <div class="mini-stats">
                      <div><span class="mini-n">${custRows.length}</span><span>Customers served</span></div>
                      <div><span class="mini-n">${repeat}</span><span>Repeat customers</span></div>
                      <div><span class="mini-n">${custRows.length?Math.round(repeat/custRows.length*100):0}%</span><span>Repeat rate</span></div>
                      <div><span class="mini-n">${avgItems}</span><span>Avg. items / order</span></div>
                    </div>
                    ${custRows.length ? `<div class="table-wrap table-wrap--flat"><table class="data">
                      <thead><tr><th>Customer</th><th class="text-right">Orders</th><th class="text-right">Lifetime spend</th></tr></thead>
                      <tbody>${custRows.slice(0,8).map(c=>`<tr><td>${esc(customerName(c.id))}</td><td class="text-right mono">${c.orders}</td><td class="text-right mono">${money(c.spend)}</td></tr>`).join('')}</tbody>
                    </table></div>` : `<p class="hint panel-pad">No customers yet.</p>`}
                  </section>
                </div>
                <section class="panel">
                  <div class="panel-head"><h2 class="panel-title">All orders</h2><span class="panel-meta">${orders.length} total</span></div>
                  <div class="table-wrap"><table class="data">
                  <thead><tr><th>Order</th><th>Customer</th><th class="col-status">Status</th><th class="text-right">Total</th><th>Date</th></tr></thead>
                  ${(() => { const sortedOrders = orders.slice().sort((a,b)=>b.createdAt-a.createdAt);
                     const ordersPage = paginate(sortedOrders, 'staffSalesOrders');
                     return '<tbody>' + (ordersPage.items.map(o=>`<tr>
                    <td class="mono strong">#${o.id.replace('o','')}</td><td>${esc(customerName(o.customerId))}</td>
                    <td class="col-status">${statusPill(o.status)}</td>
                    <td class="text-right mono">${money(orderTotal(o))}</td><td class="mono muted nowrap">${fmtDate(o.createdAt)}</td>
                  </tr>`).join('') || `<tr><td colspan="5" class="table-empty">No orders yet.</td></tr>`) + '</tbody></table></div>' + paginationHtml('staffSalesOrders', ordersPage.page, ordersPage.totalPages); })()}
                </section>`;
        }

        function adminInventory() {
            const allMeds = DB.medicines;
            const totalProducts = allMeds.length;
            const totalUnits = allMeds.reduce((s, m) => s + m.stock, 0);
            const lowStock = allMeds.filter(m => m.stock > 0 && m.stock <= 10);
            const outOfStock = allMeds.filter(m => m.stock === 0);
            const totalValue = allMeds.reduce((s, m) => s + m.stock * m.price, 0);

            const medsPage = paginate(allMeds, 'adminInventory');

            return pageHead('Inventory management', 'Platform-wide inventory — stock levels across all pharmacies.', '', 'Catalog') +
                `<div class="stat-row stat-row--kpi">
                  ${statCard('Total products', totalProducts)}
                  ${statCard('Total units', totalUnits)}
                  ${statCard('Low stock', lowStock.length, { tone: lowStock.length ? 'warn' : '' })}
                  ${statCard('Out of stock', outOfStock.length, { tone: outOfStock.length ? 'alert' : '' })}
                  ${statCard('Total value', money(totalValue))}
                </div>
                ${(lowStock.length || outOfStock.length) ? `<section class="panel panel--alert">
                    <div class="panel-head"><h2 class="panel-title">${icon('bell',16)} Stock alerts</h2></div>
                    <ul class="alert-list">
                    ${outOfStock.slice(0, 5).map(m=>{
                        const ph = pharmacy(m.pharmacyId);
                        return `<li class="alert-row"><span class="badge badge-cancelled">Out</span><span class="alert-name">${esc(m.name)}</span><span class="alert-meta">${ph ? esc(ph.name) : 'Unknown'}</span>
                        <button class="btn btn-sage btn-xs" onclick="App.adjustStockAdmin('${m.id}',25)">Restock +25</button></li>`;
                    }).join('')}
                    ${lowStock.slice(0, 5).map(m=>{
                        const ph = pharmacy(m.pharmacyId);
                        return `<li class="alert-row"><span class="badge badge-pending">Low</span><span class="alert-name">${esc(m.name)}</span><span class="alert-meta">${m.stock} left · ${ph ? esc(ph.name) : 'Unknown'}</span>
                        <button class="btn btn-sage btn-xs" onclick="App.adjustStockAdmin('${m.id}',25)">Restock +25</button></li>`;
                    }).join('')}
                    </ul>
                    ${(outOfStock.length + lowStock.length > 10) ? `<p class="hint panel-pad">Showing top alerts. See full list below.</p>` : ''}
                  </section>` : `<div class="all-good">${icon('check',16)} All products are in stock.</div>`}

                  <div class="panel-head"><h2 class="panel-title">All products</h2></div>
                  <div class="table-wrap"><table class="data data--dense">
                    <thead><tr><th>Product</th><th>Pharmacy</th><th>Category</th><th class="text-right">Price</th><th class="text-right">Stock</th><th class="text-right">Sold</th><th class="col-status">Status</th><th class="col-actions">Adjust</th></tr></thead>
                    <tbody>${medsPage.items.map(m=>{
                      const ph = pharmacy(m.pharmacyId);
                      const st = m.stock === 0 ? 'out' : m.stock <= 10 ? 'low' : 'ok';

                      return `<tr>

        function avgResponseHours() {
            let diffs = [];
            DB.threads.forEach(t => {
                const firstCust = t.messages.find(m => m.from === 'customer');
                const firstStaff = t.messages.find(m => m.from === 'staff');
                if (firstCust && firstStaff && firstStaff.at > firstCust.at) { diffs.push((firstStaff.at - firstCust
                        .at) / 36e5); }
            });
            if (diffs.length === 0) return null;
            return (diffs.reduce((a, b) => a + b, 0) / diffs.length).toFixed(1);
        }
