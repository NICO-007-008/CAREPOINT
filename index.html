        .med-picture-lg .pack { position: relative; z-index: 1; width: 58%; filter: drop-shadow(0 14px 14px rgba(35, 25, 21, .18)); transition: transform .4s var(--ease); }
        .med-picture-lg.is-zoom .pack { transform: scale(1.75) translateY(4%); }
        .med-picture-lg.is-tilt .pack { transform: rotate(-14deg) translateX(-6%); }
        .med-picture-lg.is-photo::after { display: none; }
        .med-picture-lg .med-pic-label {
            display: inline-block; position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 2;
            padding: 3px 10px; border-radius: var(--r-pill); background: rgba(255, 253, 249, .92);
            font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap;
        }
        .gallery-video { cursor: pointer; }
        .gallery-video .pack { opacity: .55; filter: blur(1px) saturate(.7); }
        .gallery-play-btn {
            position: absolute; z-index: 3; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 64px; height: 64px; border-radius: 50%; border: none;
            background: var(--ink); color: var(--paper-raise); display: grid; place-items: center; box-shadow: var(--shadow-3);
        }
        .gallery-video.playing .gallery-play-btn { animation: pulseRing 1.4s ease-in-out infinite; }
        @keyframes pulseRing { 0%, 100% { box-shadow: 0 0 0 0 rgba(35, 25, 21, .35), var(--shadow-3); } 50% { box-shadow: 0 0 0 14px rgba(35, 25, 21, 0), var(--shadow-3); } }
        .video-progress { position: absolute; left: 18%; right: 18%; bottom: 44px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .5); overflow: hidden; z-index: 3; }
        .video-progress span { display: block; height: 100%; background: var(--ink); animation: progress 12s linear forwards; }
        @keyframes progress { from { width: 0; } to { width: 100%; } }
        .gallery-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: var(--s-2); }
        .gallery-thumb { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; border: 1.5px solid transparent; border-radius: var(--r-sm); background: none; color: var(--ink-3); }
        .gallery-thumb:hover { background: var(--paper-deep); }
        .gallery-thumb.active { border-color: var(--ink); color: var(--ink); background: var(--paper-bright); }
        .gallery-thumb-pic {
            position: relative; width: 100%; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; display: grid; place-items: center;
            background: linear-gradient(170deg, var(--p1, var(--paper-deep)), var(--p2, var(--rule-strong)));
        }
        .gallery-thumb-pic.is-photo { background-size: cover; background-position: center; }
        .gallery-thumb-pic .pack { width: 70%; }
        .gallery-thumb-pic.is-zoom .pack { transform: scale(1.7); }
        .gallery-thumb-play { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }
        .gallery-thumb-label { font-size: 11px; font-weight: 600; }
        .pdp-info { min-width: 0; padding-top: var(--s-2); }
        .pdp-cat { display: flex; align-items: center; gap: var(--s-2); font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--sage-600); }
        .pdp-title { font-size: var(--fs-3xl); line-height: 1; letter-spacing: -0.035em; font-weight: 540; margin: var(--s-3) 0 var(--s-3); text-wrap: balance; }
        .pdp-rating { margin-bottom: var(--s-3); }
        .pdp-seller { color: var(--ink-2); font-size: var(--fs-sm); }
        .sep-dot { color: var(--ink-4); margin: 0 4px; }
        .pdp-buy { margin: var(--s-5) 0; padding: var(--s-5); background: var(--paper-bright); border: 1px solid var(--rule); border-radius: var(--r-md); box-shadow: var(--shadow-1); }
        .pdp-buy .apo-note { margin-top: 0; }
        .pdp-buy .hint { margin-top: var(--s-3); }
        .pdp-price-row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-4); }
        .pdp-price { font-family: var(--font-mono); font-size: 32px; font-weight: 500; letter-spacing: -0.03em; }
        .pdp-cta { display: flex; gap: var(--s-2); flex-wrap: wrap; }
        .pdp-cta .btn-primary { flex: 1; min-width: 200px; }
        .wish-toggle.saved { color: var(--oxblood-500); border-color: var(--oxblood-100); background: var(--oxblood-50); }
        .assure { list-style: none; margin: 0 0 var(--s-6); padding: 0; display: grid; gap: var(--s-2); }
        .assure li { display: flex; align-items: flex-start; gap: var(--s-2); font-size: 13.5px; color: var(--ink-2); }
        .assure .ic { color: var(--sage-500); margin-top: 2px; }
        .pdp-section { padding: var(--s-5) 0; border-top: 1px solid var(--rule); }
        .pdp-h { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-md); margin-bottom: var(--s-3); }
        .pdp-h-n { font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--ink-3); }
        .pdp-desc { color: var(--ink-2); line-height: 1.65; max-width: 62ch; }
        .pdp-where { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); }
        /* label & specs: the clinical register */
        .spec-table { margin: 0; border: 1px solid var(--ink); border-radius: var(--r-xs); background: var(--paper-bright); }
        .spec-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: var(--s-3); padding: 10px 14px; border-bottom: 1px solid var(--rule); font-size: var(--fs-sm); }
        .spec-row:last-child { border-bottom: none; }
        .spec-row:first-child { background: var(--ink); color: var(--paper-raise); }
        .spec-row:first-child .spec-key { color: var(--amber-200); }
        .spec-key { margin: 0; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); align-self: center; }
        .spec-val { margin: 0; font-weight: 600; }
        .map-frame {
            height: 200px; margin-top: var(--s-3); border-radius: var(--r-md); overflow: hidden;
            background: var(--paper-deep); border: 1px solid var(--rule);
            display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 13px;
        }
        .map-frame--tall { height: 280px; margin-bottom: var(--s-3); }
        .rating-summary { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s-5); align-items: center; padding: var(--s-4); margin-bottom: var(--s-4); background: var(--paper-bright); border: 1px solid var(--rule); border-radius: var(--r-md); }
        .rating-big { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
        .rating-big .hint { margin: 0; font-size: 12px; }
        .rating-big-n { font-family: var(--font-display); font-size: var(--fs-2xl); line-height: 1; font-weight: 500; }
        .rating-dist { display: grid; gap: 5px; }
        .rating-dist-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 24px; gap: var(--s-2); align-items: center; font-size: 12px; color: var(--ink-3); }
        .rating-dist-track { height: 6px; border-radius: 3px; background: var(--paper-deep); overflow: hidden; }
        .rating-dist-track span { display: block; height: 100%; background: var(--amber-300); border-radius: 0 3px 3px 0; }
        .review-list { display: flex; flex-direction: column; }
        .review-item { display: flex; gap: var(--s-3); padding: var(--s-3) 0; border-bottom: 1px solid var(--rule); }
        .review-item:last-child { border-bottom: none; }
        .review-main { flex: 1; min-width: 0; }
        .review-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
        .review-name { font-weight: 600; font-size: var(--fs-sm); }
        .review-date { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
        .rate-box { padding: var(--s-4); margin-bottom: var(--s-4); background: var(--amber-50); border: 1px solid var(--amber-100); border-radius: var(--r-md); }
        .rate-box-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); font-weight: 600; font-size: var(--fs-sm); margin-bottom: var(--s-2); }
        .rate-box-head .mono { font-size: 11.5px; color: var(--ink-3); font-weight: 400; }

        /* ---------- satchel & checkout ---------- */
        .cart-lines { padding: 0; overflow: hidden; }
        .cart-from { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-3) var(--s-5); background: var(--paper); border-bottom: 1px solid var(--rule); font-size: 13px; font-weight: 600; color: var(--ink-2); }
        .cart-from .hint { margin: 0; font-weight: 400; }
        .cart-line { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto 112px; gap: var(--s-4); align-items: center; padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--rule); }
        .cart-line:last-child { border-bottom: none; }
        .cart-name { font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.2; }
        .cart-unit { font-size: 13px; color: var(--ink-3); margin: 2px 0; }
        .cart-total { text-align: right; font-size: 16px; }
        .qty-stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--rule-strong); border-radius: var(--r-sm); background: var(--paper-bright); }
        .qty-stepper button { width: 38px; height: 40px; display: grid; place-items: center; border: none; background: none; color: var(--ink-2); }
        .qty-stepper button:hover { background: var(--paper-deep); color: var(--ink); }
        .qty-stepper span { min-width: 30px; text-align: center; font-size: 15px; }
        .summary-card {
            position: sticky; top: 96px;
            background: var(--paper-bright); border: 1px solid var(--rule); border-radius: var(--r-md);
            padding: var(--s-5); box-shadow: var(--shadow-2);
        }
        .summary-title { display: flex; align-items: center; font-size: var(--fs-md); padding-bottom: var(--s-3); margin-bottom: var(--s-3); border-bottom: 1.5px solid var(--ink); }
        .sum-row { display: flex; justify-content: space-between; gap: var(--s-3); padding: 6px 0; font-size: var(--fs-sm); }
        .sum-row--muted { color: var(--ink-3); }
        .sum-row--total { margin: var(--s-2) 0 var(--s-4); padding-top: var(--s-3); border-top: 1px dashed var(--rule-strong); font-size: var(--fs-md); font-weight: 600; }
        .sum-row--total .mono { font-size: 22px; }
        .sum-items { display: flex; flex-direction: column; gap: var(--s-3); padding-bottom: var(--s-3); margin-bottom: var(--s-2); border-bottom: 1px solid var(--rule); max-height: 280px; overflow-y: auto; }
        .sum-item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: var(--s-3); align-items: center; font-size: 13.5px; }
        .sum-item-name { font-weight: 600; min-width: 0; }
        .summary-back { display: inline-flex; align-items: center; gap: 6px; margin-top: var(--s-3); }
        .summary-trust { display: flex; gap: 8px; align-items: flex-start; margin: var(--s-4) 0 0; font-size: 12.5px; color: var(--ink-3); }
        .summary-trust .ic { color: var(--sage-500); margin-top: 2px; }
        .meter { margin: var(--s-3) 0 var(--s-4); }
        .meter-text { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
        .meter-track { height: 6px; border-radius: 3px; background: var(--paper-deep); overflow: hidden; }
        .meter-track span { display: block; height: 100%; background: var(--sage-500); border-radius: 3px; transition: width .4s var(--ease); }
        .checkout-form { display: flex; flex-direction: column; gap: var(--s-4); min-width: 0; }
        .form-section { background: var(--paper-bright); border: 1px solid var(--rule); border-radius: var(--r-md); padding: var(--s-5); }
        .form-section-head { display: flex; gap: var(--s-3); align-items: flex-start; margin-bottom: var(--s-4); }
        .form-section-head h2 { font-size: var(--fs-md); }
        .form-section-head p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-3); }
        .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s-3); margin-bottom: var(--s-3); }
        .choice {
            display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: var(--s-3);
            align-items: center; text-align: left; padding: var(--s-4);
            border: 1.5px solid var(--rule-strong); border-radius: var(--r-md); background: var(--paper-bright);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .choice:hover { border-color: var(--ink-3); }
        .choice.active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--paper); }
        .choice-icon { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-deep); color: var(--ink-2); }
        .choice.active .choice-icon { background: var(--ink); color: var(--amber-200); }
        .choice-title { font-weight: 600; }
        .choice-sub { grid-column: 2; font-size: 12.5px; color: var(--ink-3); }
        .choice-price { grid-row: 1 / span 2; grid-column: 3; font-family: var(--font-mono); font-size: 13px; }
        .pickup-card { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-3) var(--s-4); border-radius: var(--r-sm); background: var(--paper); border: 1px solid var(--rule); }
        .pickup-card div { display: flex; flex-direction: column; font-size: 13.5px; color: var(--ink-2); }
        .pickup-card strong { color: var(--ink); }
        .pay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: var(--s-2); margin-bottom: var(--s-4); }
        .pay-method {
            display: flex; align-items: center; gap: var(--s-2); min-height: 48px; padding: 0 var(--s-3);
            border: 1.5px solid var(--rule-strong); border-radius: var(--r-sm); background: var(--paper-bright);
            font-size: 13.5px; font-weight: 600; color: var(--ink-2); text-align: left;
        }
        .pay-method:hover { border-color: var(--ink-3); }
        .pay-method.active { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
        .pay-fields { padding: var(--s-4); border-radius: var(--r-sm); background: var(--paper); border: 1px solid var(--rule); }
        .pay-fields .field:last-child, .pay-fields .field-row:last-child .field { margin-bottom: 0; }
        .pay-summary { display: inline-flex; align-items: center; gap: 6px; }
        .pay-processing { display: inline-flex; align-items: center; gap: 10px; }
        .spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .7s linear infinite; }

        /* receipt — a real slip with perforated edges */
        .receipt-wrap { display: flex; justify-content: center; padding: var(--s-4) 0 var(--s-6); filter: drop-shadow(0 18px 28px rgba(35, 25, 21, .16)) drop-shadow(0 2px 3px rgba(35, 25, 21, .06)); }
        .receipt {
            position: relative; width: 100%; max-width: 520px; padding: var(--s-6) var(--s-6) var(--s-5);
            background: var(--paper-bright);
            -webkit-mask: radial-gradient(circle 7px at 50% 0, transparent 6.5px, #000 7px) 50% 0 / 18px 51% repeat-x, radial-gradient(circle 7px at 50% 100%, transparent 6.5px, #000 7px) 50% 100% / 18px 51% repeat-x;
            mask: radial-gradient(circle 7px at 50% 0, transparent 6.5px, #000 7px) 50% 0 / 18px 51% repeat-x, radial-gradient(circle 7px at 50% 100%, transparent 6.5px, #000 7px) 50% 100% / 18px 51% repeat-x;
            animation: rise .5s var(--ease-out);
        }
        .receipt-head { text-align: center; padding-bottom: var(--s-5); border-bottom: 1.5px dashed var(--rule-strong); }
        .receipt-check { width: 56px; height: 56px; margin: 0 auto var(--s-3); display: block; }
        .receipt-check circle { fill: var(--sage-50); stroke: var(--sage-500); stroke-width: 2; }
        .receipt-check path { fill: none; stroke: var(--sage-600); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .25s var(--ease-out) forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .receipt-title { font-size: var(--fs-2xl); margin: var(--s-2) 0; line-height: 1.05; }
        .receipt-head p { color: var(--ink-2); margin: 0; }
        .receipt-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3) var(--s-4); margin: 0; padding: var(--s-5) 0; border-bottom: 1.5px dashed var(--rule-strong); }
        .receipt-meta dt { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
        .receipt-meta dd { margin: 2px 0 0; font-size: 14px; font-weight: 600; }
        .receipt-items { padding: var(--s-4) 0; border-bottom: 1.5px dashed var(--rule-strong); }
        .receipt-item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: var(--s-3); align-items: center; padding: 6px 0; font-size: 14px; }
        .receipt-item-name { display: flex; flex-direction: column; font-weight: 600; min-width: 0; }
        .receipt-item-name span { font-weight: 400; font-size: 12px; color: var(--ink-3); }
        .receipt-totals { padding: var(--s-3) 0 0; }
        .receipt-note { display: flex; gap: var(--s-4); align-items: center; padding: var(--s-4); margin-top: var(--s-2); background: var(--sage-50); border-radius: var(--r-sm); }
        .receipt-note p { margin: 0; font-size: 13px; color: var(--ink-2); }
        .stamp--received { color: var(--sage-600); font-size: 12px; padding: 6px 10px; transform: rotate(-6deg); flex-shrink: 0; }
        .receipt-actions { display: flex; gap: var(--s-2); justify-content: center; flex-wrap: wrap; margin-top: var(--s-5); }

        /* ---------- order tracking ---------- */
        .order-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-4); margin-bottom: var(--s-5); flex-wrap: wrap; }
        .order-head .badge { font-size: 13px; padding: 5px 12px 5px 10px; margin-top: var(--s-3); }
        .timeline-card { padding: var(--s-6) var(--s-5) var(--s-5); margin-bottom: var(--s-5); }
        .timeline { position: relative; }
        .timeline-track { position: absolute; top: 21px; left: 12.5%; right: 12.5%; height: 3px; background: var(--rule); border-radius: 3px; }
        .timeline-fill { height: 100%; width: var(--progress); background: var(--sage-500); border-radius: 3px; animation: stemGrow .9s var(--ease-out); }
        @keyframes stemGrow { from { width: 0; } }
        .timeline-steps { position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .timeline-step { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 0 var(--s-2); }
        .timeline-node {
            width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; margin-bottom: var(--s-2);
            background: var(--paper-bright); border: 2px solid var(--rule-strong); color: var(--ink-4);
            transition: background-color .3s ease, border-color .3s ease;
        }
        .timeline-step.is-done .timeline-node { background: var(--sage-500); border-color: var(--sage-500); color: #fff; }
        .timeline-step.is-current .timeline-node { background: var(--amber-50); border-color: var(--amber-400); color: var(--amber-600); animation: nodePulse 2s ease-in-out infinite; }
        @keyframes nodePulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(195, 138, 51, .35); } 50% { box-shadow: 0 0 0 9px rgba(195, 138, 51, 0); } }
        .timeline-label { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-3); }
        .timeline-step.is-done .timeline-label, .timeline-step.is-current .timeline-label { color: var(--ink); }
        .timeline-sub { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
        .timeline-cancelled { display: flex; gap: var(--s-3); align-items: center; padding: var(--s-3) var(--s-4); border-radius: var(--r-sm); background: var(--oxblood-50); color: var(--oxblood-500); }
        .timeline-cancelled div { display: flex; flex-direction: column; }
        .timeline-cancelled span { font-size: 13px; color: var(--ink-2); }
        .detail-list { margin: 0; display: grid; gap: var(--s-4); }
        .detail-list dt { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
        .detail-list dd { margin: 4px 0 0; font-size: var(--fs-sm); color: var(--ink); }
        .detail-list dd .hint { display: block; margin-top: 2px; font-size: 12px; }
        .detail-list--grid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: var(--s-4) var(--s-5) var(--s-5); }
        .action-bar {
            position: sticky; bottom: var(--s-4); z-index: 20;
            display: flex; justify-content: space-between; align-items: center; gap: var(--s-4); flex-wrap: wrap;
            margin-top: var(--s-5); padding: var(--s-3) var(--s-3) var(--s-3) var(--s-5);
            background: var(--ink); color: #D9D0C2; border-radius: var(--r-md); box-shadow: var(--shadow-3);
        }
        .action-bar-text { font-size: 13px; max-width: 40ch; }
        .action-bar-btns { display: flex; gap: var(--s-2); flex-wrap: wrap; }
        .action-bar .btn-outline { background: transparent; color: var(--paper-raise); border-color: rgba(251, 247, 240, .3); }
        .action-bar .btn-outline:hover { border-color: var(--paper-raise); }
        .action-bar .btn-ghost { color: #D9D0C2; }
        .action-bar .btn-ghost:hover { background: rgba(255, 255, 255, .08); color: #fff; }
        .action-bar .btn-sage { background: var(--sage-400); color: var(--ink); border-color: var(--sage-400); }
        .action-bar .btn-sage:hover { background: var(--sage-300); }
        .rate-card { margin-top: var(--s-5); }
        .rate-card--locked { display: flex; gap: var(--s-4); align-items: flex-start; color: var(--ink-3); background: var(--paper); }
        .rate-card--locked .card-title { margin-bottom: 0; }
        .rate-list { margin-top: var(--s-3); }
        .rate-row { display: flex; justify-content: space-between; align-items: center; gap: var(--s-4); flex-wrap: wrap; padding: var(--s-3) 0; border-top: 1px solid var(--rule); }
        .rate-inline { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
        .rate-inline .star-input { margin: 0; }
        .rated { display: flex; align-items: center; gap: var(--s-2); }
        .rated .hint { margin: 0; }

        /* ---------- messages ---------- */
        .thread-list { display: flex; flex-direction: column; background: var(--paper-bright); border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; }
        .thread-row {
            display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s-3); align-items: center;
            width: 100%; padding: var(--s-4) var(--s-5); text-align: left;
            border: none; border-bottom: 1px solid var(--rule); background: transparent;
            transition: background-color .12s ease;
        }
        .thread-row:last-child { border-bottom: none; }
        .thread-row:hover { background: var(--paper); }
        .thread-row.is-unread { background: var(--amber-50); }
        .thread-row.is-unread .thread-subject { font-weight: 700; }
        .thread-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .thread-top { display: flex; justify-content: space-between; gap: var(--s-3); align-items: baseline; }
        .thread-subject { font-family: var(--font-display); font-size: 16.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .thread-clip { color: var(--ink-3); display: inline-flex; vertical-align: -2px; }
        .thread-time { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
        .thread-preview { font-size: 13.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .thread-preview strong { color: var(--ink-2); font-weight: 600; }
        .thread-tags { display: flex; gap: 6px; align-items: center; }
        .thread-list--dense .thread-row { padding: var(--s-3) var(--s-4); }
        .convo { max-width: 820px; background: var(--paper-bright); border: 1px solid var(--rule); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-1); }
        .convo-head { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
        .convo-title { flex: 1; min-width: 200px; }
        .convo-title h1 { font-size: var(--fs-md); line-height: 1.2; }
        .convo-title p { margin: 2px 0 0; font-size: 13px; color: var(--ink-3); }
        .convo-head-actions { display: flex; align-items: center; gap: var(--s-2); }
        .convo-body {
            display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-5);
            min-height: 260px; max-height: 58vh; overflow-y: auto;
            background: var(--paper); background-image: radial-gradient(rgba(35, 25, 21, .05) 1px, transparent 1px); background-size: 16px 16px;
        }
        .thread-msg { max-width: min(78%, 520px); padding: 10px 14px; border-radius: 14px; font-size: var(--fs-sm); line-height: 1.5; box-shadow: var(--shadow-1); }
        .thread-msg.theirs { align-self: flex-start; background: var(--paper-bright); border: 1px solid var(--rule); border-bottom-left-radius: 4px; }
        .thread-msg.mine { align-self: flex-end; background: var(--ink); color: var(--paper-raise); border-bottom-right-radius: 4px; }
        .thread-msg .meta { font-size: 11px; color: var(--ink-3); margin-top: 4px; font-family: var(--font-mono); }
        .thread-msg.mine .meta { color: #B8AD9E; }
        .thread-msg img { display: block; max-width: 240px; border-radius: var(--r-sm); margin-bottom: 6px; cursor: zoom-in; }
        .thread-msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }
        .convo-empty { margin: auto; text-align: center; color: var(--ink-3); font-size: var(--fs-sm); }
        .convo-empty .ill { width: 80px; }
        .convo-compose { padding: var(--s-4) var(--s-5) var(--s-5); border-top: 1px solid var(--rule); }
        .convo-compose textarea { width: 100%; min-height: 64px; padding: 12px 14px; border: 1.5px solid var(--rule-strong); border-radius: var(--r-sm); background: var(--paper-bright); resize: vertical; line-height: 1.5; }
        .convo-compose-bar { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); margin-top: var(--s-3); }
        .convo-compose .hint { margin-top: var(--s-2); font-size: 12px; }

        /* ---------- profile ---------- */
        .addr-list { display: flex; flex-direction: column; }
        .addr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s-3); align-items: center; padding: var(--s-3) 0; border-bottom: 1px solid var(--rule); }
        .addr-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--clay-50); color: var(--clay-600); }
        .addr-text { display: flex; flex-direction: column; min-width: 0; }
        .addr-text span { font-size: 13px; color: var(--ink-3); }

        /* ---------- static pages ---------- */
        .prose-page { max-width: 760px; margin: 0 auto; padding-bottom: var(--s-6); }
        .prose-title { font-size: var(--fs-3xl); line-height: 1; letter-spacing: -0.035em; margin: var(--s-3) 0 var(--s-6); font-weight: 520; }
        .prose { white-space: pre-wrap; font-size: 1.125rem; line-height: 1.75; color: var(--ink-2); }
        .prose::first-letter { float: left; font-family: var(--font-display); font-size: 4.2em; line-height: .8; padding: 6px 10px 0 0; color: var(--clay-600); font-weight: 500; }
        .faq-list { border-top: 1.5px solid var(--ink); }
        .faq { border-bottom: 1px solid var(--rule-strong); }
        .faq summary { list-style: none; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: var(--s-3); align-items: baseline; padding: var(--s-4) 0; cursor: pointer; }
        .faq summary::-webkit-details-marker { display: none; }
        .faq-n { font-size: 12px; color: var(--clay-600); }
        .faq-q { font-family: var(--font-display); font-size: var(--fs-md); font-weight: 600; line-height: 1.25; }
        .faq-toggle { color: var(--ink-3); transition: transform .2s var(--ease); }
        .faq[open] .faq-toggle { transform: rotate(45deg); }
        .faq p { margin: 0 0 var(--s-4) 52px; color: var(--ink-2); line-height: 1.65; max-width: 60ch; }

        /* =====================================================================
           AUTH — split screen
           ===================================================================== */
        .auth-split { display: grid; grid-template-columns: minmax(0, 42fr) minmax(0, 58fr); min-height: calc(100vh - 106px); }
        .auth-form-col { display: flex; align-items: center; justify-content: center; padding: var(--s-7) 40px; }
        .auth-form-inner { width: 100%; max-width: 420px; }
        .auth-form-inner > .crumb-back { display: flex; margin-bottom: var(--s-6); color: var(--ink-3); font-weight: 500; }
        .auth-form-inner > .eyebrow { display: flex; }
        .auth-title { font-size: var(--fs-2xl); line-height: 1.02; letter-spacing: -0.03em; margin: var(--s-3) 0 var(--s-2); font-weight: 540; }
        .auth-sub { color: var(--ink-2); margin-bottom: var(--s-5); }
        .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: var(--s-5); border-bottom: 1px solid var(--rule-strong); }
        .auth-tabs button { position: relative; min-height: 44px; border: none; background: none; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-3); }
        .auth-tabs button::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); transform: scaleX(0); transition: transform .25s var(--ease); }
        .auth-tabs button.active { color: var(--ink); }
        .auth-tabs button.active::after { transform: scaleX(1); }
        .auth-foot { margin: var(--s-5) 0 0; text-align: center; font-size: var(--fs-sm); color: var(--ink-3); }
        .auth-foot a { display: inline-flex; align-items: center; gap: 4px; color: var(--clay-600); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--clay-200); }
        .auth-body .apo-note { margin-top: 0; }
        .auth-panel { position: relative; overflow: hidden; background: var(--herbarium); color: var(--paper-raise); display: flex; align-items: flex-end; padding: var(--s-7); }
        .auth-panel::before { content: ''; position: absolute; inset: 0; background: radial-gradient(700px 500px at 100% 0%, rgba(201, 162, 94, .2), transparent 60%); z-index: 1; }
        .auth-panel-art {
            position: absolute; top: 8%; right: 8%; width: min(46%, 380px); aspect-ratio: 5 / 6; overflow: hidden;
            border-radius: 50% 50% var(--r-md) var(--r-md) / 38% 38% var(--r-md) var(--r-md);
            outline: 8px solid rgba(251, 247, 240, .06); box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .6);
            opacity: .92;
        }
        .auth-panel-art .cabinet { width: 100%; height: 100%; display: block; }
        .auth-panel-copy { position: relative; z-index: 2; max-width: 560px; }
        .auth-panel-quote { font-family: var(--font-display); font-size: clamp(2.4rem, 4vw, 3.8rem); line-height: .98; letter-spacing: -0.035em; font-weight: 480; margin: 0 0 var(--s-6); color: var(--paper-raise); }
        .auth-panel-quote em { color: var(--amber-200); font-variation-settings: "SOFT" 100, "WONK" 1; }
        .auth-ledger { list-style: none; margin: 0 0 var(--s-5); padding: 0; border-top: 1px solid rgba(251, 247, 240, .18); }
        .auth-ledger li { display: flex; gap: var(--s-3); align-items: center; padding: var(--s-3) 0; border-bottom: 1px solid rgba(251, 247, 240, .12); font-size: var(--fs-sm); color: #D9D3C4; }
        .auth-ledger .ic { color: var(--amber-200); }
        .auth-stats { display: flex; gap: var(--s-5); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #9FA898; }
        .auth-split--pharmacy .auth-panel { background: #2B1F19; }

        /* =====================================================================
           OPERATIONAL SHELL — staff (calm kraft), owner (walnut & brass),
           console (graphite & verdigris)
           ===================================================================== */
        .ops {
            --ops-bg: #F1ECE3; --panel-bg: #FFFDF9; --panel-rule: #E2D8C7; --th-bg: #F8F3EB;
            --sb-bg: #E8E0D2; --sb-ink: var(--ink); --sb-ink-2: var(--ink-3); --sb-rule: #D7CCB9;
            --sb-hover: rgba(35, 25, 21, .05); --sb-active-bg: #FFFDF9; --sb-active-bar: var(--sage-500); --sb-badge: var(--amber-300);
            --btn-primary: var(--sage-600); --btn-primary-hover: var(--sage-700); --focus: var(--sage-600);
            --row-hover: rgba(98, 122, 85, .06);
            display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh;
            background: var(--ops-bg);
        }
        .ops--owner {
            --sb-bg: #2A1E18; --sb-ink: #EFE6D8; --sb-ink-2: #B5A592; --sb-rule: rgba(239, 230, 216, .12);
            --sb-hover: rgba(239, 230, 216, .06); --sb-active-bg: rgba(239, 230, 216, .09); --sb-active-bar: #C9A25E; --sb-badge: #C9A25E;
            --btn-primary: var(--clay-600); --btn-primary-hover: var(--clay-700); --focus: var(--clay-600);

        }
        .ops--console {
            --ops-bg: #ECEEEB; --panel-bg: #FFFFFF; --panel-rule: #D9DED9; --th-bg: #F4F6F3; --panel-radius: 6px;
            --sb-bg: #141817; --sb-ink: #D7DBD7; --sb-ink-2: #858F89; --sb-rule: rgba(215, 219, 215, .09);
            --sb-hover: rgba(215, 219, 215, .05); --sb-active-bg: rgba(95, 168, 151, .12); --sb-active-bar: var(--verdigris-400); --sb-badge: var(--verdigris-400);
            --btn-primary: var(--verdigris-600); --btn-primary-hover: var(--verdigris-700); --focus: var(--verdigris-600);
            --seg-bg: #E2E6E2; --row-hover: rgba(63, 138, 121, .06);
            --rule: #DFE3DF; --rule-strong: #C3CAC4; --paper-bright: #FFFFFF; --paper: #F4F6F3; --paper-deep: #E6EAE6;
            background-image: linear-gradient(rgba(20, 24, 23, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 24, 23, .035) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .sidebar {
            position: sticky; top: 0; height: 100vh; overflow-y: auto; scrollbar-width: thin;
            display: flex; flex-direction: column; gap: var(--s-4);
            padding: var(--s-5) var(--s-3) var(--s-4);
            background: var(--sb-bg); color: var(--sb-ink); border-right: 1px solid var(--sb-rule);
        }
        .sb-brand { display: flex; align-items: center; gap: 10px; padding: 0 var(--s-2); }
        .sb-word { font-family: var(--font-display); font-weight: 650; font-size: 19px; line-height: 1; letter-spacing: -0.02em; }
        .sb-sub { margin-top: 3px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--sb-ink-2); }
        .sb-ctx { margin: 0 var(--s-1); padding: var(--s-3); border: 1px solid var(--sb-rule); border-radius: var(--r-sm); background: rgba(255, 255, 255, .25); }
        .ops--owner .sb-ctx, .ops--console .sb-ctx { background: rgba(255, 255, 255, .03); }
        .sb-ctx-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--sb-ink-2); }
        .sb-ctx-name { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.2; margin-top: 4px; }
        .sb-ctx-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--sb-ink-2); }
        .sb-nav { display: flex; flex-direction: column; gap: var(--s-3); flex: 1; }
        .sb-group-label { padding: 0 var(--s-3); margin-bottom: 4px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--sb-ink-2); }
        .sb-item {
            position: relative; display: flex; align-items: center; gap: var(--s-3); width: 100%;
            min-height: 40px; padding: 0 var(--s-3); border: none; border-radius: var(--r-sm); background: transparent;
            color: var(--sb-ink); font-size: 14px; font-weight: 500; text-align: left; opacity: .86;
            transition: background-color .12s ease, opacity .12s ease;
        }
        .sb-item .ic { opacity: .75; }
        .sb-item:hover { background: var(--sb-hover); opacity: 1; }
        .sb-item.active { background: var(--sb-active-bg); opacity: 1; font-weight: 600; box-shadow: var(--sb-active-shadow, none); }
        .sb-item.active::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--sb-active-bar); }
        .sb-item.active .ic { opacity: 1; color: var(--sb-active-bar); }
        .ops--staff .sb-item.active { --sb-active-shadow: var(--shadow-1); }
        .sb-item-label { flex: 1; min-width: 0; }
        .sb-badge { background: var(--sb-badge); color: #1B1411; }
        .sb-foot { border-top: 1px solid var(--sb-rule); padding-top: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); }
        .sb-user { display: flex; align-items: center; gap: 10px; padding: 0 var(--s-2); min-width: 0; }
        .sb-user .avatar { width: 34px; height: 34px; font-size: 13px; }
        .ops--owner .sb-user .avatar { background: #C9A25E; color: #2A1E18; }
        .ops--console .sb-user .avatar { background: var(--verdigris-500); color: #fff; border-radius: var(--r-sm); }
        .sb-user-text { min-width: 0; }
        .sb-user-name { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sb-user-role { font-size: 11.5px; color: var(--sb-ink-2); }
        .sb-logout { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 var(--s-3); border: 1px solid var(--sb-rule); border-radius: var(--r-sm); background: transparent; color: var(--sb-ink-2); font-size: 13px; font-weight: 500; }
        .sb-logout:hover { color: var(--sb-ink); border-color: var(--sb-ink-2); }
        .ops-main { min-width: 0; display: flex; flex-direction: column; }
        .ops-bar {
            position: sticky; top: 0; z-index: 40;
            display: flex; align-items: center; justify-content: space-between; gap: var(--s-4);
            min-height: 60px; padding: 8px var(--s-6);
            background: var(--ops-bg); background: color-mix(in srgb, var(--ops-bg) 94%, transparent); border-bottom: 1px solid var(--panel-rule);
        }
        .ops-crumb { display: flex; align-items: center; gap: var(--s-2); min-width: 0; font-size: 14px; }
        .ops-crumb-ctx { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
        .ops-crumb .sep { color: var(--ink-4); }
        .ops-crumb-page { font-weight: 600; white-space: nowrap; }
        .ops-crumb-sub { color: var(--ink-3); font-weight: 500; }
        .ops-tools { display: flex; align-items: center; gap: var(--s-2); }
        .quick-find { position: relative; display: flex; align-items: center; }
        .quick-find > .ic { position: absolute; left: 11px; color: var(--ink-3); pointer-events: none; }
        .quick-find select { min-height: 38px; width: 280px; padding-left: 34px; font-size: 13.5px; border-width: 1px; }
        .msg-btn .msg-dot, .ops-bar .msg-dot { border-color: var(--ops-bg); }
        .ops-logout { display: none; }
        .sys-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 10px; border-radius: var(--r-xs); background: #E2E6E2; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); }
        .sys-chip.is-live { background: rgba(63, 138, 121, .12); color: var(--verdigris-700); }
        .sys-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); display: inline-block; }
        .sys-dot.is-live { background: var(--verdigris-400); box-shadow: 0 0 0 3px rgba(95, 168, 151, .25); }
        .sys-date { font-size: 12px; color: var(--ink-3); }
        .ops-content { width: 100%; max-width: 1400px; padding: var(--s-6) var(--s-6) var(--s-8); }
        .ops .page-title { font-size: var(--fs-xl); }
        .ops .page-head { margin-bottom: var(--s-5); }
        .ops .page-sub { font-size: var(--fs-sm); }
        .ops .card { background: var(--panel-bg); border-color: var(--panel-rule); box-shadow: none; }
        .ops--owner .page-title { font-weight: 650; }
        .ops--owner .eyebrow { color: var(--clay-600); }

        /* operational detail layouts */
        .ops-split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s-5); align-items: start; }
        .ops-split--notices { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
        .ops-split-main { min-width: 0; }
        .action-rail { position: sticky; top: 76px; background: var(--panel-bg); border: 1px solid var(--panel-rule); border-radius: var(--panel-radius, var(--r-md)); }
        .rail-block { padding: var(--s-4); border-bottom: 1px solid var(--panel-rule); display: flex; flex-direction: column; gap: var(--s-2); }
        .rail-block:last-child { border-bottom: none; }
        .rail-block .field { margin-bottom: 0; }
        .rail-block .hint { margin: 0; }
        .rail-block-title { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
        .rail-btn-row { display: flex; gap: var(--s-2); flex-wrap: wrap; }
        .alert-list { list-style: none; margin: 0; padding: 0; }
        .alert-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: var(--s-3); align-items: center; padding: 10px var(--s-4); border-bottom: 1px solid var(--panel-rule); font-size: var(--fs-sm); }
        .alert-row:last-child { border-bottom: none; }
        .alert-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .alert-meta { font-size: 12px; color: var(--ink-3); }
        .tpl-list { padding: 0 var(--s-4) var(--s-2); }
        .tpl { padding: var(--s-4) 0; border-bottom: 1px solid var(--panel-rule); }
        .tpl:last-child { border-bottom: none; }
        .tpl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-3); margin-bottom: var(--s-2); }
        .tpl-head strong { display: block; font-size: 14.5px; }
        .tpl-head .hint { margin: 0; font-size: 12.5px; display: block; }
        .tpl textarea { width: 100%; min-height: 60px; padding: 10px 12px; border: 1.5px solid var(--rule-strong); border-radius: var(--r-sm); background: var(--paper-bright); resize: vertical; font-size: 14px; line-height: 1.5; }
        .tpl.is-off textarea { background: var(--paper); color: var(--ink-3); }
        .tpl-actions { display: flex; gap: 6px; margin-top: var(--s-2); }
        .switch { display: inline-flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 10px 0 4px; border: 1px solid var(--rule-strong); border-radius: var(--r-pill); background: var(--paper); font-size: 12px; font-weight: 600; color: var(--ink-3); flex-shrink: 0; }
        .switch-knob { position: relative; width: 34px; height: 20px; border-radius: 10px; background: var(--rule-strong); transition: background-color .2s ease; }
        .switch-knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-1); transition: transform .2s var(--ease); }
        .switch.is-on { color: var(--sage-700); border-color: var(--sage-300); background: var(--sage-50); }
        .switch.is-on .switch-knob { background: var(--sage-500); }
        .switch.is-on .switch-knob::after { transform: translateX(14px); }
        .compose-panel { position: sticky; top: 76px; }
        .mini-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--panel-rule); }
        .mini-stats > div { display: flex; flex-direction: column; gap: 2px; padding: var(--s-3) var(--s-4); font-size: 12px; color: var(--ink-3); }
        .mini-stats > div + div { border-left: 1px solid var(--panel-rule); }
        .mini-n { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--ink); line-height: 1.1; }

        /* console register: denser, mono numerals, systems tone */
        .ops--console .page-title { font-family: var(--font-ui); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
        .ops--console .eyebrow { color: var(--verdigris-600); }
        .ops--console .stat { min-height: 0; padding: var(--s-3) var(--s-4); gap: 6px; }
        .ops--console .stat-num { font-family: var(--font-mono); font-size: 24px; font-weight: 500; letter-spacing: -0.03em; font-variation-settings: normal; }
        .ops--console .stat-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
        .ops--console .stat--alert { background: #FFFFFF; border-color: var(--clay-200); box-shadow: inset 3px 0 0 var(--clay-500); }
        .ops--console .stat--warn { background: #FFFFFF; box-shadow: inset 3px 0 0 var(--amber-400); }
        .ops--console .panel-title { font-size: 14px; }
        .ops--console .badge { border-radius: var(--r-xs); font-size: 11.5px; padding: 2px 8px 2px 7px; }
        .ops--console .seg-btn.active .seg-n, .ops--console .seg-n { background: #E2E6E2; color: var(--ink-2); }
        .stat-row--kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-2); }
        .stat-row--kpi.stat-row--6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        .data--dense { font-size: 13px; }
        .data--dense th { padding: 8px 12px; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .1em; }
        .data--dense td { padding: 8px 12px; }
        .data--log td { font-size: 12.5px; }
        .save-bar {
            position: sticky; bottom: var(--s-4); z-index: 20;
            display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); flex-wrap: wrap;
            padding: var(--s-3) var(--s-3) var(--s-3) var(--s-4);
            background: #141817; color: #C9CFCA; border-radius: var(--r-sm); box-shadow: var(--shadow-3);
        }
        .save-bar-text { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
        .save-bar-btns { display: flex; gap: var(--s-2); }
        .save-bar .btn-ghost { color: #C9CFCA; }
        .save-bar .btn-ghost:hover { background: rgba(255, 255, 255, .08); color: #fff; }
        .banner-preview { position: relative; margin: var(--s-4); padding: var(--s-6) var(--s-5) var(--s-5); border-radius: var(--r-sm); background: #F3ECE0; color: var(--ink); border: 1px dashed #C3CAC4; }
        .banner-preview-tag { position: absolute; top: 10px; right: 12px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #858F89; }
        .banner-preview-title { font-family: var(--font-display); font-size: var(--fs-xl); line-height: 1.05; letter-spacing: -0.03em; font-weight: 540; max-width: 24ch; }
        .banner-preview-title em { color: var(--clay-600); }
        .banner-preview p { margin: var(--s-2) 0 var(--s-4); color: var(--ink-2); max-width: 52ch; }
        .banner-preview-cta { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px; border-radius: var(--r-sm); background: var(--clay-500); color: #fff; font-size: 13px; font-weight: 600; }
        .page-list { display: flex; flex-direction: column; }
        .page-row { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: var(--s-4); align-items: center; padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--panel-rule); }
        .page-row:last-child { border-bottom: none; }
        .page-row-key { font-size: 12px; color: var(--verdigris-600); }
        .page-row-text { display: flex; flex-direction: column; min-width: 0; }
        .page-row-text span { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ---------- charts ---------- */
        .colchart { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s-3); padding: var(--s-5) var(--s-5) var(--s-4); }
        .colchart-y { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; height: 200px; font-size: 11px; color: var(--ink-3); transform: translateY(-6px); }
        .colchart-plot {
            position: relative; display: flex; align-items: flex-end; gap: 2px; height: 200px;
            border-bottom: 1px solid var(--ink-3);
            background: linear-gradient(var(--rule) 1px, transparent 1px) 0 0 / 100% 50%;
        }
        .col { position: relative; flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; outline: none; }
        .col-bar { position: relative; width: 100%; max-width: 24px; background: var(--clay-400); border-radius: 4px 4px 0 0; transition: background-color .15s ease; animation: barGrow .7s var(--ease-out); transform-origin: bottom; }
        .col-bar.is-zero { height: 2px !important; background: var(--rule-strong); border-radius: 0; animation: none; }
        @keyframes barGrow { from { transform: scaleY(0); } }
        .col:hover .col-bar:not(.is-zero), .col:focus-visible .col-bar:not(.is-zero) { background: var(--clay-600); }
        .col-val { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink); white-space: nowrap; }
        .col-x { position: absolute; top: calc(100% + 6px); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
        .colchart--dense .col:nth-child(even) .col-x { visibility: hidden; }
        .col::after, .hbar::after {
            content: attr(data-tip); position: absolute; z-index: 5; pointer-events: none;
            padding: 6px 10px; border-radius: var(--r-xs); background: var(--ink); color: var(--paper-raise);
            font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap;
            opacity: 0; transform: translateY(4px); transition: opacity .12s ease, transform .12s ease;
        }
        .col::after { bottom: calc(100% + 8px); }
        .col:hover::after, .col:focus-visible::after, .hbar:hover::after, .hbar:focus-visible::after { opacity: 1; transform: none; }
        .colchart { padding-bottom: var(--s-6); }
        .hbar-chart { display: flex; flex-direction: column; gap: 2px; padding: var(--s-4) var(--s-5) var(--s-5); }
        .hbar { position: relative; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: var(--s-4); align-items: center; min-height: 40px; padding: 0 var(--s-2); border-radius: var(--r-xs); outline: none; }
        .hbar:hover, .hbar:focus-visible { background: var(--row-hover); }
        .hbar::after { right: var(--s-2); top: 50%; transform: translateY(-50%) translateX(4px); }
        .hbar:hover::after, .hbar:focus-visible::after { transform: translateY(-50%); }
        .hbar-track { display: flex; align-items: center; gap: var(--s-2); border-left: 1px solid var(--ink-3); min-height: 24px; }
        .hbar-fill { height: 14px; background: var(--verdigris-500); border-radius: 0 4px 4px 0; animation: hbarGrow .7s var(--ease-out); }
        .hbar-fill.is-zero { width: 2px !important; background: var(--rule-strong); animation: none; }
        @keyframes hbarGrow { from { width: 0; } }
        .hbar-val { font-size: 12.5px; color: var(--ink); }

        /* =====================================================================
           DIALOGS & SHEETS — centred modal on desktop, bottom sheet on phones
           ===================================================================== */
        .modal-layer {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center; padding: var(--s-6) var(--s-4);
            background: rgba(27, 19, 15, .48); overflow-y: auto;
            animation: fadeIn .18s ease;
        }
        .modal {
            width: 100%; max-width: 520px; max-height: calc(100vh - 64px); display: flex; flex-direction: column;
            background: var(--paper-bright); border-radius: var(--r-lg); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .45);
            animation: rise .24s var(--ease-out);
        }
        .modal--wide { max-width: 760px; }
        .modal .more-sheet-handle { display: none; }
        .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-3); padding: var(--s-5) var(--s-5) var(--s-3); border-bottom: 1px solid var(--rule); }
        .modal-title { font-size: var(--fs-lg); line-height: 1.15; margin-top: 4px; }
        .modal-body { padding: var(--s-5); overflow-y: auto; }
        .modal-body > .apo-note:first-child { margin-top: 0; }
        .modal-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); padding: var(--s-3) var(--s-5); border-top: 1px solid var(--rule); background: var(--paper); border-radius: 0 0 var(--r-lg) var(--r-lg); }
        .modal-foot-right { display: flex; gap: var(--s-2); margin-left: auto; }

        .more-sheet-overlay { position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-end; background: rgba(27, 19, 15, .45); animation: fadeIn .18s ease; }
        .more-sheet {
            width: 100%; max-height: 82vh; overflow-y: auto;
            background: var(--paper-bright); border-radius: var(--r-lg) var(--r-lg) 0 0;
            padding: var(--s-2) var(--s-3) calc(var(--s-4) + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 -10px 30px rgba(35, 25, 21, .18);
        }
        .more-sheet--animate { animation: sheetUp .28s var(--ease-out); }
        .more-sheet-handle { width: 40px; height: 4px; border-radius: 4px; background: var(--rule-strong); margin: 6px auto var(--s-3); }
        .more-sheet-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); margin-bottom: var(--s-2); }
        .more-sheet-item {
            display: flex; align-items: center; gap: var(--s-3); width: 100%; min-height: 56px; padding: 0 var(--s-4);
            border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--paper-bright);
            font-size: 15px; font-weight: 600; color: var(--ink); text-align: left;
        }
        .more-sheet-item.active { border-color: var(--ink); }
        .more-sheet-item:active { background: var(--paper-deep); }
        .more-sheet-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-deep); color: var(--ink-2); flex-shrink: 0; }
        .more-sheet-item .badge-count { margin-left: auto; }
        .more-sheet-logout { border: none; color: var(--oxblood-500); min-height: 48px; }
        .filter-sheet { padding-left: var(--s-4); padding-right: var(--s-4); }
        .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s-3); }
        .sheet-title { font-size: var(--fs-md); }
        .sheet-foot { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); position: sticky; bottom: calc(-1 * var(--s-4)); padding: var(--s-3) 0 var(--s-2); background: var(--paper-bright); }

        /* ---------- bottom tab bar (native app + phones in the ops shell) ---------- */
        .bottom-tabbar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
            display: flex; padding: 4px 6px env(safe-area-inset-bottom, 0px);
            background: rgba(251, 247, 240, .98); border-top: 1px solid var(--rule);
            box-shadow: 0 -6px 20px rgba(35, 25, 21, .06);
        }
        .bottom-tab {
            flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            min-height: 58px; padding: 6px 2px; border: none; background: none; color: var(--ink-3);
            font-size: 11px; font-weight: 600;
        }
        .bottom-tab-icon { position: relative; display: grid; place-items: center; width: 52px; height: 30px; border-radius: var(--r-pill); transition: background-color .2s ease; }
        .bottom-tab.active { color: var(--ink); }
        .bottom-tab.active .bottom-tab-icon { background: var(--paper-deep); }
        .bottom-tab-label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bottom-tab-dot { position: absolute; top: 2px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--clay-500); border: 1.5px solid var(--paper-raise); }
        .bottom-tabbar--admin { background: rgba(20, 24, 23, .98); border-top-color: rgba(215, 219, 215, .1); }
        .bottom-tabbar--admin .bottom-tab { color: #858F89; }
        .bottom-tabbar--admin .bottom-tab.active { color: #E7EAE7; }
        .bottom-tabbar--admin .bottom-tab.active .bottom-tab-icon { background: rgba(95, 168, 151, .18); color: var(--verdigris-300); }
        .ops--owner .bottom-tabbar { background: rgba(42, 30, 24, .98); border-top-color: rgba(239, 230, 216, .1); }
        .ops--owner .bottom-tab { color: #B5A592; }
        .ops--owner .bottom-tab.active { color: #EFE6D8; }
        .ops--owner .bottom-tab.active .bottom-tab-icon { background: rgba(201, 162, 94, .2); color: #E3C68E; }

        /* ---------- lightbox ---------- */
        .lightbox-overlay { position: fixed; inset: 0; z-index: 2000; overflow: auto; padding: 72px 20px; background: rgba(20, 14, 11, .94); animation: fadeIn .18s ease; }
        .lightbox-inner { min-height: 100%; display: flex; align-items: center; justify-content: center; }
        .lightbox-inner img { border-radius: var(--r-sm); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); cursor: zoom-in; }
        .lightbox-inner img.fit { max-width: 90vw; max-height: 80vh; }
        .lightbox-inner img.zoomed { max-width: none; max-height: none; cursor: zoom-out; }
        .lightbox-close, .lightbox-zoombtn {
            position: fixed; top: 16px; z-index: 2001; height: 42px; border: none; border-radius: var(--r-sm);
            background: var(--paper-bright); color: var(--ink); box-shadow: var(--shadow-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .lightbox-close { right: 16px; width: 42px; }
        .lightbox-zoombtn { right: 66px; padding: 0 16px; font-size: 13px; font-weight: 600; }
        .lightbox-hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 2001; padding: 6px 14px; border-radius: var(--r-pill); background: rgba(0, 0, 0, .4); color: #EFE7DC; font-size: 12px; }

        /* ---------- boot splash & navigation loading ---------- */
        #bootSplash {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--herbarium); transition: opacity .35s ease;
        }
        #bootSplash.fade-out { opacity: 0; pointer-events: none; }
        .boot-splash-mark {
            width: 72px; height: 86px; margin-bottom: 22px; display: grid; place-items: center;
            border-radius: 50% 50% 8px 8px / 42% 42% 8px 8px; background: var(--clay-500); color: #FBF7F0;
            box-shadow: inset 0 -10px 0 rgba(0, 0, 0, .12), 0 20px 40px -10px rgba(0, 0, 0, .5);
        }
        .boot-splash-mark svg { margin-top: 8px; }
        .boot-splash-title { font-family: var(--font-display); font-weight: 600; font-size: 30px; letter-spacing: -0.02em; color: #FBF7F0; }
        .boot-splash-sub { margin-top: 6px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: #9FA898; }
        .boot-splash-bar { width: 120px; height: 2px; margin-top: 28px; border-radius: 2px; background: rgba(251, 247, 240, .12); overflow: hidden; }
        .boot-splash-bar span { display: block; width: 40%; height: 100%; background: var(--amber-300); animation: bootSlide 1.1s ease-in-out infinite; }
        @keyframes bootSlide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
        .nav-loading-overlay { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; background: var(--paper); }
        .nav-jar { position: relative; width: 34px; height: 42px; border: 2px solid var(--ink); border-radius: 6px 6px 8px 8px; overflow: hidden; }
        .nav-jar::before { content: ''; position: absolute; top: -2px; left: 4px; right: 4px; height: 6px; background: var(--ink); border-radius: 2px; }
        .nav-jar span { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sage-400); animation: jarFill .9s ease-in-out infinite alternate; }
        @keyframes jarFill { from { height: 10%; } to { height: 85%; } }

        .leaflet-container { font-family: var(--font-ui); z-index: 1; background: var(--paper-deep); }
        .leaflet-control-attribution { font-size: 10px; }

            .btn-add:disabled span { display: inline; }
            .feature-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }

            .feature-media { padding: var(--s-4) var(--s-4) 0; }

            .hero-label--slip { left: 0; }

            .timeline-card { padding: var(--s-4) var(--s-2); }
            .action-bar { padding: var(--s-3); }

            .page-title { font-size: var(--fs-xl); }
            .field-row, .field-row--3, .field-row--addr, .check-grid { grid-template-columns: minmax(0, 1fr); }
            .receipt { padding: var(--s-5) var(--s-4) var(--s-4); }

            .thread-row { grid-template-columns: auto minmax(0, 1fr); padding: var(--s-3) var(--s-4); }

        /* ---------- Maps (OpenStreetMap + Leaflet — no API key needed) ----------
           Interactive maps for the pharmacy profile pin and customer-facing
           location previews. Geocoding uses the free Nominatim service. */
        let mapsReady = false;
        let pharmMap = null, pharmMarker = null;

        function loadMaps() {
            if (typeof L !== 'undefined') {
                mapsReady = true;
                return;
            }
            // Leaflet is loaded from <head>; if it is still arriving, poll briefly.
            let tries = 0;
            const t = setInterval(() => {
                tries++;
                if (typeof L !== 'undefined') {
                    mapsReady = true;
                    clearInterval(t);
                    initPharmacyMapIfVisible();
                    initCustomerPharmacyMaps();
                } else if (tries > 40) {
                    clearInterval(t);
                }
            }, 100);
        }

        /* Draws (or redraws) the pharmacy-profile map into #phMapCanvas. */
        function initPharmacyMapIfVisible() {
            const canvas = document.getElementById('phMapCanvas');
            if (!canvas) return;
            if (!mapsReady || typeof L === 'undefined') {
                canvas.textContent = 'Loading map…';
                loadMaps();
                return;
            }
            // Fresh DOM node after each re-render — always rebuild.
            if (pharmMap) {
                try { pharmMap.remove(); } catch (e) {}
                pharmMap = null;
                pharmMarker = null;
            }
            canvas.innerHTML = '';
            const ph = currentStaffPharmacy();
            const lat = typeof ph.lat === 'number' ? ph.lat : 14.5906;
            const lng = typeof ph.lng === 'number' ? ph.lng : 120.9799;
            const zoom = typeof ph.lat === 'number' ? 17 : 12;
            pharmMap = L.map(canvas, { scrollWheelZoom: false }).setView([lat, lng], zoom);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(pharmMap);
            pharmMarker = L.marker([lat, lng], { draggable: true, title: ph.name || 'Pharmacy' }).addTo(pharmMap);

                const pos = pharmMarker.getLatLng();
                setPharmLatLngFields(pos.lat, pos.lng);
            });

            setTimeout(() => { try { pharmMap.invalidateSize(); } catch (e) {} }, 80);

        async function sbUpsert(table, obj) {
            if (!sbEnabled()) return;
            const tableName = SB_TABLE[table] || table;
            const row = toRow(table, obj);
            try {
                const { error } = await sb.from(tableName).upsert(row, { onConflict: 'id' });
                if (error) console.error('[Supabase upsert]', tableName, error);
            } catch (e) { console.error('[Supabase upsert]', tableName, e); }
        }

                if (error) console.error('[Supabase delete]', tableName, error);
            } catch (e) { console.error('[Supabase delete]', tableName, e); }

        /* ---------- Realtime sync (live messaging across devices) ----------
           Subscribes to Postgres change events on `threads` so that when
           one device sends a message (sbUpsert('threads', ...)), every
           other open device gets the update pushed to it instantly and
           re-renders — no refresh needed.
           Requires Realtime to be enabled for the `threads` table in
           Supabase (Database → Replication, or run:
             alter publication supabase_realtime add table threads;
           ). */
        let realtimeChannel = null;
        function setupRealtimeThreads() {
            if (!sbEnabled()) { console.warn('[Realtime] Skipped — Supabase not enabled.'); return; }
            if (realtimeChannel) return;
            console.log('[Realtime] Subscribing to threads channel…');
            realtimeChannel = sb.channel('threads-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'threads' }, (payload) => {
                    console.log('[Realtime] Event received:', payload.eventType, payload);
                    handleThreadRealtimeEvent(payload);
                })
                .subscribe((status, err) => {
                    console.log('[Realtime] Channel status:', status, err || '');
                    if (status === 'SUBSCRIBED') {
                        console.log('[Realtime] ✅ Connected — listening for live messages.');
                    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        console.error('[Realtime] ❌ Failed to connect.', err);
                        toast('Live messaging sync failed to connect — see console for details.', 'error');
                    } else if (status === 'CLOSED') {
                        console.warn('[Realtime] Channel closed.');
                        realtimeChannel = null;
                    }
                });
        }
        function handleThreadRealtimeEvent(payload) {
            const { eventType, new: newRow, old: oldRow } = payload;
            if (eventType === 'DELETE') {
                const id = oldRow && oldRow.id;
                DB.threads = DB.threads.filter(t => t.id !== id);
                update();
                return;
            }
            const incoming = fromRow('threads', newRow);
            if (!incoming) return;
            const idx = DB.threads.findIndex(t => t.id === incoming.id);
            const wasNew = idx === -1;
            const previous = wasNew ? null : DB.threads[idx];
            if (wasNew) DB.threads.push(incoming);
            else DB.threads[idx] = incoming;

            // If this device currently has that thread open, surface the new
            // message immediately and mark it read on this side.
            const role = state.activeRole;
            const viewingThisThread = role && state[role] && state[role].threadId === incoming.id
                && state[role].view === 'thread';
            const gotNewMessage = previous ? incoming.messages.length > previous.messages.length : incoming.messages.length > 0;
            if (viewingThisThread) {
                if (role === 'customer') incoming.unreadForCustomer = false;
                if (role === 'staff') incoming.unreadForStaff = false;
                if (gotNewMessage) {
                    const last = incoming.messages[incoming.messages.length - 1];
                    if (last && last.from !== role) toast('New message received.', 'success');
                }
            }
            update();
        }

        /* ---------- Realtime: live order + notification sync ----------

        let realtimeOrdersChannel = null;
        function setupRealtimeOrders() {
            if (!sbEnabled() || realtimeOrdersChannel) return;
            realtimeOrdersChannel = sb.channel('orders-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (payload) => {
                    console.log('[Realtime] Orders event:', payload.eventType, payload);
                    handleOrderRealtimeEvent(payload);

                .subscribe((status, err) => {
                    console.log('[Realtime] Orders channel status:', status, err || '');

                const id = oldRow && oldRow.id;
                DB.orders = DB.orders.filter(o => o.id !== id);
                update();
                return;
            }
            const incoming = fromRow('orders', newRow);
            if (!incoming) return;
            const idx = DB.orders.findIndex(o => o.id === incoming.id);
            const isNewOrder = idx === -1;
            if (isNewOrder) DB.orders.push(incoming);
            else DB.orders[idx] = incoming;

            // Alert the pharmacy's own staff, and platform admins, the moment
            // a brand-new order comes in — this is what makes the "New
            // Orders" jar and toast update without a refresh.
            if (isNewOrder && eventType === 'INSERT') {
                const role = state.activeRole;
                const staffPh = role === 'staff' && state.session.staff ? currentStaffPharmacy() : null;

        /* ---------- Resolve a Supabase Auth session into an app role ----------
           Called on boot (existing session) and right after a Google OAuth
           redirect comes back. Matches the authenticated user to an existing
           profile by linked user_id first, then by email for accounts not
           yet migrated (e.g. the seeded admin signing in with Google for the
           first time), and only creates a brand-new profile if nothing
           matches at all — a pharmacy signup if one was staged via
           registerStaffWithGoogle(), otherwise a plain customer account. */
        async function resolveAuthSession(user) {
            let role = null, profile = null;
            profile = DB.customers.find(u => u.userId === user.id); if (profile) role = 'customer';
            if (!profile) { profile = DB.staff.find(u => u.userId === user.id); if (profile) role = 'staff'; }
            if (!profile) { profile = DB.admins.find(u => u.userId === user.id); if (profile) role = 'admin'; }

            if (!profile) {
                const email = (user.email || '').toLowerCase();
                let match = DB.customers.find(u => u.email.toLowerCase() === email && !u.userId);
                if (match) { role = 'customer'; profile = match; }
                if (!profile) { match = DB.staff.find(u => u.email.toLowerCase() === email && !u.userId); if (match) { role = 'staff'; profile = match; } }
                if (!profile) { match = DB.admins.find(u => u.email.toLowerCase() === email && !u.userId); if (match) { role = 'admin'; profile = match; } }
                if (profile) {
                    profile.userId = user.id;
                    sbUpsert(role === 'customer' ? 'customers' : role === 'staff' ? 'staff' : 'admins', profile);
                }
            }

            if (!profile) {
                const pendingRaw = sessionStorage.getItem('cp_pending_pharmacy_signup');
                sessionStorage.removeItem('cp_pending_pharmacy_signup');
                const pending = pendingRaw ? JSON.parse(pendingRaw) : null;
                if (pending) {
                    const pid = 'p_' + Date.now();
                    const sid = 's_' + Date.now();
                    const newPh = { id: pid, name: pending.pharmName, location: pending.pharmLocation,
                        hours: pending.pharmHours, status: 'pending', lat: null, lng: null };
                    const newStaff = { id: sid, name: pending.name, email: user.email, password: null,
                        userId: user.id, pharmacyId: pid, status: 'pending', isOwner: true };
                    DB.pharmacies.push(newPh);
                    DB.staff.push(newStaff);
                    sbUpsert('pharmacies', newPh);
                    sbUpsert('staff', newStaff);
                    toast('Registration submitted! Awaiting admin approval.', 'success');
                    update();
                    return;
                }
                const name = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) ||
                    (user.email || '').split('@')[0];
                const id = 'c' + (DB.customers.length + 1) + '_' + Date.now();
                profile = { id, name, email: user.email, password: null, userId: user.id, status: 'active',
                    addresses: [], wishlist: [] };
                DB.customers.push(profile);
                sbUpsert('customers', profile);
                role = 'customer';
            }

            if (role === 'staff' && profile.status === 'pending') { toast(
                    'Your pharmacy is awaiting admin approval.', 'error'); await sb.auth.signOut(); return; }
            if (role === 'staff' && profile.status === 'rejected') { toast(
                    'Registration was rejected. Contact support.', 'error'); await sb.auth.signOut(); return; }
            if (role !== 'admin' && profile.status === 'disabled') { toast(
                    'Account disabled. Contact support.', 'error'); await sb.auth.signOut(); return; }

            state.activeRole = role;
            state.session[role] = profile.id;
            state.publicView = 'landing';
            state.publicMedId = null;
            toast('Welcome, ' + profile.name.split(' ')[0] + '!', 'success');
            update();
        }

        /* ---------- Xendit: real GCash payment gateway ----------
           A GCash payment fully leaves the app (Xendit's hosted GCash
           checkout), so the order can't be created until the customer is
           redirected back — see payWithGcash() above for how the request
           gets sent. This is the return half. */
        function finalizePendingOrder(pending) {
            const id = 'o' + (counters.order++);
            const items = pending.items;
            items.forEach(it => { const med = medicine(it.medId);
                if (med) { med.stock -= it.qty; med.sold = (med.sold || 0) + it.qty; } });
            const newOrder = { id, customerId: pending.customerId, pharmacyId: pending.pharmacyId, items,
                fulfillment: pending.fulfillment, addressId: pending.addressId, status: 'pending',
                createdAt: new Date(), paymentMethod: 'gcash', paymentLabel: pending.paymentLabel };
            DB.orders.push(newOrder);
            items.forEach(it => { const med = medicine(it.medId); if (med) sbUpsert('medicines', med); });
            sbUpsert('orders', newOrder);
            notifyOrderEvent(order(id), 'orderPlaced');
            sendReceiptEmail(newOrder);
            delete state.carts[pending.customerId];
            state.checkout = { fulfillment: 'pickup', addressId: null, paymentMethod: 'card', processing: false };
            if (state.session.customer === pending.customerId) state.customer.view = 'orders';
            toast('Order #' + id.replace('o', '') + ' placed via GCash!', 'success');
            update();
        }
        async function checkGcashReturn() {
            const params = new URLSearchParams(window.location.search);
            const gcashStatus = params.get('gcash');
            if (!gcashStatus) return;
            // Clean the URL immediately so a later refresh can't re-trigger this.
            window.history.replaceState({}, '', window.location.origin + window.location.pathname);

            const pendingRaw = sessionStorage.getItem('cp_pending_gcash_order');
            sessionStorage.removeItem('cp_pending_gcash_order');
            if (!pendingRaw) return;
            const pending = JSON.parse(pendingRaw);

            if (gcashStatus !== 'success') {
                toast('GCash payment was not completed — order not placed.', 'error');
                return;
            }
            // Don't just trust the redirect URL — actually verify the
            // charge reached SUCCEEDED via the serverless function (which
            // holds the Xendit secret key) before creating the order.
            try {
                const res = await fetch('/.netlify/functions/check-gcash-status?id=' + encodeURIComponent(pending.chargeId));
                const json = await res.json();
                if (!res.ok || json.status !== 'SUCCEEDED') {
                    toast('Payment could not be verified — order not placed.', 'error');
                    return;
                }
            } catch (err) {
                console.error('[Xendit] Verification failed:', err);
                toast('Could not verify payment — order not placed.', 'error');
                return;
            }
            finalizePendingOrder(pending);
        }
