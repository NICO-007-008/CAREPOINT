        function icon(name, size, cls) {
            return `<svg viewBox="0 0 24 24" width="${size||18}" height="${size||18}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic ${cls||''}" aria-hidden="true" focusable="false">${ICONS[name]||''}</svg>`;
        }

        function heartIcon(filled, size) {
            return `<svg viewBox="0 0 24 24" width="${size||18}" height="${size||18}" fill="${filled?'currentColor':'none'}" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS.heart}</svg>`;
        }

        function starRow(avg, count, size) {
            size = size || 13;
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                const filled = avg >= i - 0.25;
                stars +=
                    `<svg viewBox="0 0 24 24" width="${size}" height="${size}" class="star ${filled?'is-on':''}" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS.star}</svg>`;
            }
            const label = count == null ? '' :
                `<span class="stars-label">${count ? avg.toFixed(1)+' <span class="stars-n">('+count+')</span>' : 'No ratings yet'}</span>`;
            const spoken = count == null ? `${Math.round(avg * 10) / 10} out of 5 stars` :
                count ? `Rated ${avg.toFixed(1)} out of 5 from ${count} rating${count===1?'':'s'}` : 'No ratings yet';
            return `<span class="stars" role="img" aria-label="${spoken}">${stars}${label}</span>`;
        }

        function medReviews(medId) { return DB.reviews.filter(r => r.medId === medId); }

        function medRatingAvg(medId) {
            const rs = medReviews(medId);
            if (!rs.length) return 0;
            return rs.reduce((s, r) => s + r.rating, 0) / rs.length;
        }
        const CAT_ICON = {
            'Pain Relief': 'leaf',
            'Cold & Flu': 'droplet',
            'Allergy': 'flower',
            'Vitamins': 'capsule',
            'First Aid': 'cross',
            'Digestive': 'sprout',
            'Skin Care': 'jar',
            'Prescription': 'quill',
        };

        function catIcon(cat) { return icon(CAT_ICON[cat] || 'leaf', 13); }

            'Paracetamol': '💊',
            'Ibuprofen': '💊',

            'Cough Syrup': '🍯',

        function getMedEmoji(name) {
            for (const [key, val] of Object.entries(MED_EMOJI)) {
                if (name.includes(key)) return val;
            }
            return '💊';
        }

        function getMedGradient(name) {
            for (const [key, val] of Object.entries(MED_GRADIENT)) {
                if (name.includes(key)) return val;
            }
            return ['#D4D4D4', '#B8B8B8'];
        }

        /* ---------- Product art ----------
           Listings without an uploaded photo get an illustrated package that
           matches their shelf (blister pack, syrup bottle, tin…), set on an
           arched "cabinet window" plate. The plate tint comes from the product
           name when it is a known remedy, otherwise from its category. */
        const CATEGORY_TONE = {
            'Pain Relief': ['#F1E1D0', '#E2C6AA'],
            'Cold & Flu': ['#F3E3C6', '#E6CB9C'],
            'Allergy': ['#E2E8DC', '#C9D4BE'],

            'Prescription': ['#EFE2CF', '#DCC4A2'],

            const g = getMedGradient(m.name);
            if (g[0] === '#D4D4D4') return CATEGORY_TONE[m.category] || CATEGORY_TONE['Pain Relief'];
            return g;
        }

            'First Aid': 'tin', 'Digestive': 'sachet', 'Skin Care': 'tube', 'Prescription': 'rx' };
        function packArt(m) {

            const [c1, c2] = plateTones(m);

                    <g fill="${c2}"><ellipse cx="38" cy="41" rx="4.6" ry="3.2"/><ellipse cx="62" cy="41" rx="4.6" ry="3.2"/><ellipse cx="38" cy="60" rx="4.6" ry="3.2"/><ellipse cx="62" cy="60" rx="4.6" ry="3.2"/><ellipse cx="62" cy="78" rx="4" ry="2.8"/></g>`,
                syrup: `<rect x="41" y="9" width="18" height="12" rx="2.5" fill="#3A2C24"/>
                    <path d="M43 21h14v8c6 2 12 6 12 14v40a7 7 0 0 1-7 7H38a7 7 0 0 1-7-7V43c0-8 6-12 12-14Z" fill="#A9671F"/>
                    <path d="M35.5 40v44" stroke="#fff" stroke-opacity=".32" stroke-width="3" stroke-linecap="round"/>
                    <rect x="36" y="50" width="29" height="27" rx="2" fill="#FBF6EC"/><rect x="36" y="50" width="29" height="7" fill="${c2}"/>
                    ${lines(41, 64, 19, 12)}`,
                tub: `<rect x="29" y="15" width="42" height="16" rx="3" fill="#3D5A86"/>
                    <path d="M34 15v16M39 15v16M44 15v16M49 15v16M54 15v16M59 15v16M64 15v16" stroke="#2F466A" stroke-opacity=".55"/>
                    <rect x="31" y="31" width="38" height="59" rx="6" fill="#F7F2EA" stroke="#D6C8B3" stroke-width="1.2"/>
                    <rect x="31" y="47" width="38" height="28" fill="${c1}"/><rect x="31" y="47" width="38" height="5" fill="${c2}"/>
                    <g transform="rotate(-30 50 64)"><rect x="40" y="60" width="20" height="8" rx="4" fill="#FBF8F2" stroke="#8C7A68"/><path d="M44 60h6v8h-6a4 4 0 0 1 0-8Z" fill="#B65D36"/></g>`,
                jar: `<rect x="27" y="17" width="46" height="15" rx="4" fill="#627A55"/>
                    <rect x="24" y="31" width="52" height="59" rx="12" fill="#D98E4B"/>
                    <path d="M30 38v7M30 76v6" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
                    <rect x="24" y="49" width="52" height="24" fill="#FBF6EC"/>
                    <circle cx="37" cy="61" r="6.5" fill="${c2}"/><circle cx="37" cy="61" r="2.6" fill="#FBF6EC"/>
                    ${lines(49, 58, 20, 13)}`,
                tin: `<path d="M40 31v-7a3.5 3.5 0 0 1 3.5-3.5h13A3.5 3.5 0 0 1 60 24v7" fill="none" stroke="#742C22" stroke-width="3"/>
                    <rect x="17" y="30" width="66" height="58" rx="9" fill="#B04A3A"/>
                    <path d="M17 39a9 9 0 0 1 9-9h48a9 9 0 0 1 9 9v2H17Z" fill="#943A2C"/>
                    <rect x="44" y="49" width="12" height="32" rx="2" fill="#FBF6EC"/><rect x="34" y="59" width="32" height="12" rx="2" fill="#FBF6EC"/>`,
                sachet: `<path d="M28 18l4-4 4 4 4-4 4 4 4-4 4 4 4-4 4 4 4-4 4 4v72H28Z" fill="${c1}" stroke="${c2}" stroke-width="1.4" stroke-linejoin="round"/>
                    <path d="M28 30h44" stroke="${c2}" stroke-width="1.2" stroke-dasharray="2 3"/>
                    <circle cx="50" cy="55" r="12" fill="#FBF6EC"/>
                    <path d="M43 57c2-8 10-10 15-8-1 7-8 11-15 8Z" fill="#627A55"/><path d="M43 57c3-2 6-4 10-5" stroke="#FBF6EC" stroke-width="1"/>
                    <path d="M38 77h24M42 83h16" stroke="${c2}" stroke-width="1.6" stroke-linecap="round"/>`,
                tube: `<rect x="38" y="76" width="24" height="14" rx="2.5" fill="#3A2C24"/>
                    <path d="M26 14h48l-9 62H35Z" fill="#F4F0F2" stroke="#D3C6CC" stroke-width="1.2"/>
                    <path d="M26 14h48v7H26z" fill="${c2}"/>
                    <path d="M37 38h26l-2.6 20H39.6Z" fill="${c1}"/>
                    <path d="M41 45h18M43 51h11" stroke="#8C7A68" stroke-width="1.4" stroke-linecap="round"/>`,
                rx: `<rect x="28" y="14" width="44" height="16" rx="3" fill="#F7F2EA" stroke="#D6C8B3" stroke-width="1.2"/>
                    <rect x="31" y="30" width="38" height="60" rx="5" fill="#B5782A"/>

        function medPicture(m, size, extraClass) {
            size = size || 72;
            if (m.images && m.images.length) {
                return `<div class="med-picture is-photo ${extraClass||''}" style="width:${size}px;height:${size}px;background-image:url('${m.images[0]}');" role="img" aria-label="Photo of ${esc(m.name)}"></div>`;
            }
            const [c1, c2] = plateTones(m);
            return `<div class="med-picture ${extraClass||''}" style="width:${size}px;height:${size}px;--p1:${c1};--p2:${c2};" role="img" aria-label="Picture of ${esc(m.name)}">${packArt(m)}</div>`;
        }

        /* Full-width arched product plate used on shop cards. */
        function medPlate(m) {
            if (m.images && m.images.length) {
                return `<div class="plate is-photo" style="background-image:url('${m.images[0]}');" role="img" aria-label="Photo of ${esc(m.name)}"></div>`;
            }
            const [c1, c2] = plateTones(m);
            return `<div class="plate" style="--p1:${c1};--p2:${c2};" role="img" aria-label="Illustration of ${esc(m.name)}">${packArt(m)}</div>`;
        }

        function medPictureLg(m, labelOverride, imageOverride) {
            const photo = imageOverride || (m.images && m.images.length ? m.images[0] : null);
            const label = labelOverride || m.category;
            if (photo) {
                return `<div class="med-picture med-picture-lg is-photo" style="background-image:url('${photo}');" role="img" aria-label="${esc(label)} — photo of ${esc(m.name)}">
            <span class="med-pic-label">${esc(label)}</span>
          </div>`;
            }
            const [c1, c2] = plateTones(m);
            const variant = label === 'Label' ? 'is-zoom' : label === 'In Use' ? 'is-tilt' : '';
            return `<div class="med-picture med-picture-lg ${variant}" style="--p1:${c1};--p2:${c2};" role="img" aria-label="${esc(label)} view of ${esc(m.name)}">
            ${packArt(m)}
            <span class="med-pic-label">${esc(label)}</span>
          </div>`;
        }

        /* ---------- Product gallery (images + video placeholder) ---------- */
        function medGalleryShots(m) {
            if (m.images && m.images.length) {
                return m.images.map((src, i) => ({ type: 'image', label: 'Photo ' + (i + 1), src }))
                    .concat([{ type: 'video', label: 'How to use (video)' }]);
            }
            return [
                { type: 'image', label: 'Front' },
                { type: 'image', label: 'Label' },
                { type: 'image', label: 'In Use' },
                { type: 'video', label: 'How to use (video)' },
            ];
        }
        function medVideoView(m) {
            const [c1, c2] = plateTones(m);
            const playing = state.gallery.playing;
            return `<div class="med-picture med-picture-lg gallery-video ${playing?'playing':''}" style="--p1:${c1};--p2:${c2};" onclick="App.toggleGalleryVideo()">
                ${packArt(m)}
                <button class="gallery-play-btn" aria-label="${playing?'Pause':'Play'} the how-to-use video" onclick="event.stopPropagation();App.toggleGalleryVideo()">${icon(playing?'pause':'play',24)}</button>
                <span class="med-pic-label">${playing?'Playing · How to use':'How to use'}</span>
                ${playing ? '<span class="video-progress"><span></span></span>' : ''}
              </div>`;
        }
        function medGalleryHtml(m) {
            const shots = medGalleryShots(m);
            const idx = Math.min(state.gallery.index || 0, shots.length - 1);

        function initEmailJs() {
            if (emailjsReady || typeof emailjs === 'undefined') return;
            if (EMAILJS_PUBLIC_KEY === 'YOUR_EMAILJS_PUBLIC_KEY') return; // not configured yet

        async function sendReceiptEmail(ord) {
            initEmailJs();
            if (!emailjsReady) { console.warn('[EmailJS] Not configured — skipping receipt email.'); return; }
            const cust = customer(ord.customerId);
            const ph = pharmacy(ord.pharmacyId);
            if (!cust || !cust.email) return;
            const rows = ord.items.map(it => {
                const med = medicine(it.medId);

            }).join('');
            const total = ord.items.reduce((s, it) => s + it.price * it.qty, 0);

            }

        /* True when this page is running inside the CarePoint Android app
           (Capacitor), as opposed to a normal web browser. Capacitor apps
           always serve their content from https://localhost — this is a
           reliable, INSTANT, synchronous signal (unlike checking
           window.CapCore, which only becomes available once the deferred
           Capacitor bridge module script finishes loading — a race that
           could let the very first render use the wrong, desktop-style

        /* Handles the deep-link return from Google sign-in inside the
           Capacitor app. Registered once at boot (see boot() below).
           Capacitor's App plugin fires 'appUrlOpen' with the full
           carepoint://auth-callback#access_token=...&refresh_token=...
           URL once Android hands control back to the app. */
        /* Shared logic for handling a carepoint://auth-callback URL,
           however it arrives — either via the live 'appUrlOpen' event
           (app was already running) or via getLaunchUrl() (app's process
           was killed while the browser was open and cold-started back in,
           which is common on Android under memory pressure — the event
           can fire before any listener exists to catch it in that case,
           and Capacitor does not replay it, so this direct check is
           necessary too). */
        async function processCapacitorAuthUrl(urlString) {
            if (!urlString) return;
            console.log('[Capacitor] Processing auth URL:', urlString);
            try {
                const url = new URL(urlString);
                const hashParams = new URLSearchParams(url.hash.startsWith('#') ? url.hash.slice(1) : url.hash);
                const access_token = hashParams.get('access_token');
                const refresh_token = hashParams.get('refresh_token');
                const code = url.searchParams.get('code');

                let sessionData = null, error = null;
                if (access_token && refresh_token && sbEnabled()) {
                    ({ data: sessionData, error } = await sb.auth.setSession({ access_token, refresh_token }));
                } else if (code && sbEnabled()) {
                    ({ data: sessionData, error } = await sb.auth.exchangeCodeForSession(code));
                } else {
                    return; // not an auth callback URL — nothing to do
                }

                if (window.CapBrowser && window.CapBrowser.close) window.CapBrowser.close();

                if (!error && sessionData && sessionData.user) {
                    await resolveAuthSession(sessionData.user);
                } else if (error) {
                    console.error('[Capacitor] Auth error:', error);
                    toast(error.message || 'Sign-in failed.', 'error');
                }
            } catch (err) {
                console.error('[Capacitor] Failed to handle auth deep link:', err);
            }
        }

        function setupCapacitorAuthListener() {
            // The Capacitor bridge script (a <script type="module">) loads
            // slightly after this classic script runs, so window.CapAppPlugin
            // may not exist on the very first call — poll briefly instead of
            // giving up immediately.
            let tries = 0;
            const tryRegister = () => {
                if (window.CapAppPlugin && window.CapAppPlugin.addListener) {
                    // Case 1: app was already running, browser closes and
                    // hands control back via the normal event.
                    window.CapAppPlugin.addListener('appUrlOpen', (data) => {
                        processCapacitorAuthUrl(data.url);
                    });
                    // Case 2: app's process was killed while the browser was
                    // open (cold start) — ask Capacitor directly for the URL
                    // that launched this fresh instance, since the event
                    // above may have already fired and been lost before this
                    // listener existed.
                    if (window.CapAppPlugin.getLaunchUrl) {
                        window.CapAppPlugin.getLaunchUrl().then(result => {
                            if (result && result.url) processCapacitorAuthUrl(result.url);
                        }).catch(() => {});
                    }
                    console.log('[Capacitor] appUrlOpen listener registered.');
                    return;
                }
                tries++;
                if (tries < 60) setTimeout(tryRegister, 50);
                else console.warn('[Capacitor] Gave up waiting for CapAppPlugin bridge.');
            };
            tryRegister();
        }

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',

        /* ---------- Pagination (used across every list in the app) ----------
           Each list on screen gets its own independent page number, tracked
           by a short string key (e.g. 'customerShop', 'adminOrders') in
           state.pagination. paginate() slices the list; paginationHtml()
           renders the Prev/Next + page-number control to go under it. */
        const PAGE_SIZE = 10;
        function paginate(list, key, pageSize) {
            pageSize = pageSize || PAGE_SIZE;
            const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
            let page = state.pagination[key] || 1;
            if (page > totalPages) page = totalPages;
            if (page < 1) page = 1;
            const start = (page - 1) * pageSize;
            return { items: list.slice(start, start + pageSize), page, totalPages, total: list.length };
        }
        function paginationHtml(key, page, totalPages) {
            if (totalPages <= 1) return '';
            let shown;
            if (totalPages <= 7) {
                shown = Array.from({ length: totalPages }, (_, i) => i + 1);
            } else {
                shown = [1];
                if (page > 3) shown.push('…');
                for (let i = Math.max(2, page - 1); i <= Math.min(totalPages - 1, page + 1); i++) shown.push(i);
                if (page < totalPages - 2) shown.push('…');
                shown.push(totalPages);
            }
            return `<nav class="pagination" aria-label="Pagination">
                <button class="page-step" ${page<=1?'disabled':''} onclick="App.setPage('${key}',${page-1})">${icon('arrowLeft',15)}<span>Prev</span></button>
                <div class="pagination-nums">
                  ${shown.map(p => p==='…' ? `<span class="pagination-ellipsis" aria-hidden="true">…</span>` :
                    `<button class="pagination-num ${p===page?'active':''}" ${p===page?'aria-current="page"':''} aria-label="Page ${p}" onclick="App.setPage('${key}',${p})">${p}</button>`).join('')}
                </div>
                <span class="pagination-of">Page ${page} of ${totalPages}</span>
                <button class="page-step" ${page>=totalPages?'disabled':''} onclick="App.setPage('${key}',${page+1})"><span>Next</span>${icon('arrowRight',15)}</button>
              </nav>`;
        }

        /* Drop a delisted medicine from carts and wishlists so nothing renders a missing item. */
        function purgeMedicineReferences(medId) {

            Object.keys(state.carts).forEach(custId => {
                const cart = state.carts[custId];
                cart.items = cart.items.filter(it => it.medId !== medId);
                if (!cart.items.length) delete state.carts[custId];
            });
        }

        function toast(msg, type) {
            const box = document.createElement('div');
            box.className = 'toast' + (type ? ' ' + type : '');
            box.textContent = msg;
            document.getElementById('toastContainer').appendChild(box);
            setTimeout(() => { box.remove(); }, 3200);
        }

        /* ---------- Render engine ---------- */
        function update() {
            document.body.classList.toggle('native-app', isNativeAndroidApp());
            const active = document.activeElement;
            const activeId = active && active.id ? active.id : null;
            const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
            const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;
            document.getElementById('app').innerHTML = buildApp();
            if (activeId) {
                const el = document.getElementById(activeId);
                if (el) {
                    el.focus();
                    if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (
                        e) {} }
                }
            }
            if (state.staff.view === 'profile') { setTimeout(initPharmacyMapIfVisible, 0); }
            setTimeout(initCustomerPharmacyMaps, 0);
        }

        document.addEventListener('click', (e) => {
            if (state.notifPanelOpen && !e.target.closest('.notif-wrap')) { state.notifPanelOpen = false;
                update(); }
        });

        /* =========================================================
           SHELL — the frame differs by role, not just by colour:
           guests & customers get a retail top bar; pharmacy staff and
           owners get a working sidebar; platform admins get a darker,
           denser console sidebar. Phones and the native app fall back
           to the bottom tab bar for every logged-in role.
           ========================================================= */
        function buildApp() {
            const role = state.activeRole;
            const loggedIn = !!(role && state.session[role]);
            const native = isNativeAndroidApp();
            if (native && state.navLoading) {
                return `<div class="nav-loading-overlay" role="status" aria-label="Loading"><div class="nav-jar"><span></span></div></div>`;
            }
            if (loggedIn && (role === 'staff' || role === 'admin')) {
                return opsShell(role) + lightboxHtml();
            }
            const bleed = !loggedIn && state.publicView === 'auth';
            const landing = !loggedIn && state.publicView === 'landing';
            return topbar() + `<main class="${bleed ? 'main-bleed' : landing ? 'main-landing' : ''}">` + mainContent() + '</main>' +
                (native ? bottomTabBar() : '') + (bleed ? '' : footerHtml()) + lightboxHtml();
        }

        function lightboxHtml() {
            if (!state.lightbox) return '';
            const zoomed = state.lightbox.zoomed;
            return `<div class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Prescription photo" onclick="App.closeLightbox()">
            <button class="lightbox-close" aria-label="Close photo" onclick="event.stopPropagation();App.closeLightbox()">${icon('close',20)}</button>
            <button class="lightbox-zoombtn" onclick="event.stopPropagation();App.toggleLightboxZoom()">${zoomed?icon('minus',16)+' Zoom out':icon('plus',16)+' Zoom in'}</button>
            <div class="lightbox-inner"><img class="${zoomed?'zoomed':'fit'}" src="${state.lightbox.src}" alt="Prescription photo" onclick="event.stopPropagation();App.toggleLightboxZoom()"></div>
            <div class="lightbox-hint">Click the photo to ${zoomed?'zoom back out':'zoom in'}</div>
          </div>`;
        }

        function brandMark(size) {
            return `<span class="brand-mark ${size==='sm'?'brand-mark--sm':''}" aria-hidden="true">${icon('leaf', size==='sm'?13:17)}</span>`;
        }
        function initials(name) {
            return esc(String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w.charAt(0).toUpperCase()).join('') || '?');
        }
        function todayLabel() {
            return new Date().toLocaleDateString('en-PH', { weekday: 'long', month: 'long', day: 'numeric' });
        }
        function statusPill(status) {
            return `<span class="badge badge-${esc(status)}">${esc(STATUS_LABEL[status] || status)}</span>`;
        }

        function footerHtml() {
            const loggedIn = state.activeRole && state.session[state.activeRole];
            if (loggedIn) {
                return `<footer class="app-footer app-footer--slim"><div class="footer-base">
                    <span>${brandMark('sm')} CarePoint — “The Neighborhood Apothecary.”</span>
                    <span class="mono">${esc(DB.settings.supportEmail)}</span>
                  </div></footer>`;
            }
            return `<footer class="app-footer">
              <div class="footer-inner">
                <div class="footer-brand">
                  ${brandMark()}
                  <div>
                    <div class="footer-word">CarePoint</div>
                    <p>Real pharmacies and real pharmacists, a short walk — or a tap — away.</p>
                  </div>
                </div>
                <nav class="footer-links" aria-label="Site">
                  <div class="footer-col">
                    <div class="eyebrow">The shop</div>
                    <a href="#" onclick="event.preventDefault();App.goPublic('catalog')">Browse the shelf</a>
                    <a href="#" onclick="event.preventDefault();App.goAuth('register')">Open an account</a>
                    <a href="#" onclick="event.preventDefault();App.goAuth('registerPharmacy')">List your pharmacy</a>
                  </div>
                  <div class="footer-col">
                    <div class="eyebrow">CarePoint</div>
                    <a href="#" onclick="event.preventDefault();App.goStaticPage('about')">${esc(DB.pages.about.title)}</a>
                    <a href="#" onclick="event.preventDefault();App.goStaticPage('contact')">${esc(DB.pages.contact.title)}</a>
                    <a href="#" onclick="event.preventDefault();App.goStaticPage('faqs')">FAQs</a>
                    <a href="#" onclick="event.preventDefault();App.goStaticPage('privacy')">${esc(DB.pages.privacy.title)}</a>
                  </div>
                </nav>
              </div>
              <div class="footer-base">
                <span>CarePoint — “The Neighborhood Apothecary.”</span>
                <span class="mono">${esc(DB.settings.supportEmail)}</span>
              </div>
            </footer>`;
        }

        /* ---------- Top bar (guests & customers) ---------- */
        function topbar() {
            const role = state.activeRole;
            const loggedInId = role ? state.session[role] : null;
            const native = isNativeAndroidApp();
            const home = loggedInId && role === 'customer' ? "App.setView('customer','home')" : "App.goPublic('landing')";
            const brand = `<a class="brand" href="#" aria-label="CarePoint home" onclick="event.preventDefault();${home}">
                ${brandMark()}
                <span class="brand-word">CarePoint<span class="brand-tag">The Neighborhood Apothecary</span></span>
              </a>`;

            if (role === 'customer' && loggedInId) {
                const c = currentCustomer();
                const n = cartCount();
                const unread = unreadForCustomer(state.session.customer);
                const unreadN = unreadNotifCount(state.session.customer);
                const cur = activeTabKey('customer');
                return `<header class="topbar topbar--customer"><div class="topbar-inner">
                  ${brand}
                  ${subnav()}
                  <div class="nav-tools">
                    <div class="notif-wrap">
                      <button class="icon-btn bell-btn" title="Notifications" aria-label="Notifications${unreadN?', '+unreadN+' unread':''}" aria-expanded="${state.notifPanelOpen}" onclick="event.stopPropagation();App.toggleNotifPanel()">${icon('bell',19)}${unreadN?`<span class="bell-dot"></span>`:''}</button>
                      ${state.notifPanelOpen ? notifPanel() : ''}
                    </div>
                    <button class="icon-btn msg-btn native-only" title="Messages" aria-label="Messages${unread?', unread messages':''}" onclick="App.setView('customer','messages')">${icon('message',18)}${unread?`<span class="msg-dot"></span>`:''}</button>
                    <button class="icon-btn satchel-btn ${cur==='cart'?'active':''}" id="satchelIcon" title="Your Satchel" aria-label="Your Satchel, ${n} item${n===1?'':'s'}" onclick="App.setView('customer','cart')">${icon('cart',19)}${n?`<span class="satchel-count">${n}</span>`:''}</button>
                    <button class="account-btn ${cur==='profile'?'active':''}" aria-label="Your profile" onclick="App.setView('customer','profile')"><span class="avatar avatar--sm">${initials(c.name)}</span><span class="account-name">${esc(c.name.split(' ')[0])}</span></button>
                    <button class="btn-link logout-link" onclick="App.logout()">Log out</button>
                  </div>
                </div></header>`;
            }

            const stats = platformStats();
            const s = DB.settings;
            return `<header class="topbar topbar--guest">
              ${native ? '' : `<div class="notice-strip"><div class="notice-inner">
                <span><span class="live-dot"></span>${stats.pharmacies} neighborhood pharmac${stats.pharmacies===1?'y':'ies'} open</span>
                <span>${stats.meds} remed${stats.meds===1?'y':'ies'} on the shelf</span>
                ${s.deliveryEnabled && s.freeDeliveryOver > 0 ? `<span>Free delivery over ${money(s.freeDeliveryOver)}</span>` : ''}
                <span>Ratings only from completed orders</span>
              </div></div>`}
              <div class="topbar-inner">${brand}${guestNav()}</div>
            </header>`;
        }

        /* Visitors get their own nav so the site is browsable without an account. */
        function guestNav() {
            const v = state.publicView;
            const native = isNativeAndroidApp();
            return `${native ? '' : `<nav class="nav-links" aria-label="Main">
                <button class="nav-link ${v==='landing'?'active':''}" ${v==='landing'?'aria-current="page"':''} onclick="App.goPublic('landing')">Home</button>
                <button class="nav-link ${(v==='catalog'||v==='medicine')?'active':''}" ${(v==='catalog'||v==='medicine')?'aria-current="page"':''} onclick="App.goPublic('catalog')">The shelf</button>
                <button class="nav-link nav-link--minor ${v==='auth'&&state.authView==='registerPharmacy'?'active':''}" onclick="App.goAuth('registerPharmacy')">For pharmacies</button>
              </nav>`}
              <div class="nav-tools guest-nav">
                ${native ? '' : `<button class="nav-search" onclick="App.goPublic('catalog')">${icon('search',16)}<span>Search remedies…</span></button>`}
                <button class="nav-link ${v==='auth'&&state.authView==='login'?'active':''}" onclick="App.goAuth('login')">Log in</button>
                <button class="btn btn-ink btn-sm" onclick="App.goAuth('register')">Open an account</button>
              </div>`;
        }

        const NOTIF_ICON = { order: 'receipt', message: 'message', promo: 'leaf' };
        function notifPanel() {
            const list = custNotifications(state.session.customer);
            return `<div class="notif-backdrop" onclick="event.stopPropagation();App.toggleNotifPanel()"></div>
            <div class="notif-panel" role="dialog" aria-label="Notifications" onclick="event.stopPropagation();">
              <div class="more-sheet-handle"></div>
              <div class="notif-panel-head">
                <div><div class="eyebrow">Notices</div><strong>From your pharmacies</strong></div>
                ${list.length ? `<button class="btn-link" onclick="App.markAllNotifsRead()">Mark all read</button>` : ''}
              </div>
              <div class="notif-list">
              ${list.length ? list.map(n=>`<div class="notif-item ${n.read?'':'unread'}">
                  <span class="notif-kind notif-kind--${esc(n.type)}">${icon(NOTIF_ICON[n.type] || 'bell', 15)}</span>
                  <div class="notif-copy">
                    <div class="notif-text">${n.read?'':'<span class="row-unread-dot" title="Unread"></span>'}${esc(n.text)}</div>
                    <div class="notif-time">${fmtDate(n.at)}</div>
                  </div>
                </div>`).join('') : `<div class="notif-empty">${illustration('seal')}<strong>All caught up.</strong><span>Order updates and notes from your pharmacist land here.</span></div>`}
              </div>
            </div>`;
        }

        /* ---------- Navigation model ---------- */
        /* Single source of truth for each role's navigation tabs — used by
           the customer top bar, the staff/admin sidebars and the bottom tab
           bar / "More" sheet. Returns [key, label, badgeCount]. */
        function tabsForRole(role) {
            if (role === 'customer') {
                const unreadCount = unreadForCustomer(state.session.customer);
                const wishCount = (currentCustomer().wishlist || []).length;
                return [
                    ['home', 'Shop', 0],
                    ['wishlist', 'Wishlist', wishCount],
                    ['cart', 'Satchel', cartCount()],
                    ['orders', 'My Orders', 0],
                    ['messages', 'Messages', unreadCount],
                    ['profile', 'Profile', 0]
                ];
            }
            if (role === 'staff') {
                const ph = currentStaffPharmacy();
                const pending = DB.orders.filter(o => o.pharmacyId === ph.id && o.status === 'pending').length;
                const openMsgs = unreadForStaffPharmacy(ph.id);
                const lowStock = lowStockMedicines(ph.id).length + outOfStockMedicines(ph.id).length;
                const openReturns = pharmacyReturns(ph.id).filter(r => r.status === 'requested').length;
                return [
                    ['orders', 'Workbench', pending],
                    ...(isPharmacyOwner() ? [['listings', 'The Shelf', 0]] : []),
                    ...(isPharmacyOwner() ? [['inventory', 'Inventory', lowStock]] : []),
                    ['returns', 'Returns', openReturns],
                    ['messages', 'Counter', openMsgs],
                    ['sales', 'Sales', 0],
                    ['notices', 'Notices', 0],
                    ...(isPharmacyOwner() ? [['team', 'Team', 0]] : []),
                    ['profile', 'Profile', 0]
                ];
            }
            if (role === 'admin') {
                const pendingApprovals = DB.staff.filter(s => s.status === 'pending').length;
                const openFlags = DB.flags.filter(f => f.status === 'open').length;
                return [
                    ['approvals', 'Registry', pendingApprovals],
                    ['accounts', 'Accounts', 0],
                    ['catalog', 'Herbal Index', 0],
                    ['orders', 'All Orders', 0],
                    ['flags', 'Flags', openFlags],
                    ['reports', 'Tally', 0],
                    ['content', 'Content', 0],
                    ['audit', 'Audit Trail', 0],
                    ['settings', 'Settings', 0]
                ];
            }
            return [];
        }
        const TAB_ICON = {
            home: 'store', wishlist: 'heart', cart: 'cart', orders: 'receipt', messages: 'message', profile: 'user',
            listings: 'jar', inventory: 'box', returns: 'returns', sales: 'chart', notices: 'bell', team: 'users',
            approvals: 'shield', accounts: 'users', catalog: 'capsule', flags: 'flag', reports: 'chart',
            content: 'quill', audit: 'book', settings: 'gear'
        };
        /* Sidebar grouping — purely presentational, keyed by tab. */
        const STAFF_NAV_GROUPS = { orders: 'Today', messages: 'Today', returns: 'Today', listings: 'Shelf',
            inventory: 'Shelf', sales: 'Business', notices: 'Business', team: 'Pharmacy', profile: 'Pharmacy' };
        const ADMIN_NAV_GROUPS = { approvals: 'Marketplace', accounts: 'Marketplace', catalog: 'Marketplace',
            orders: 'Marketplace', flags: 'Trust & safety', audit: 'Trust & safety', reports: 'Insight',
            content: 'Publishing', settings: 'System' };
        /* Sub-views highlight the tab they belong to. */
        function activeTabKey(role) {
            const v = state[role].view;
            if (role === 'customer') return { medicine: 'home', checkout: 'cart', receipt: 'orders', orderDetail: 'orders', thread: 'messages' }[v] || v;
            return { orderDetail: 'orders', thread: 'messages' }[v] || v;
        }

        /* First 4 tabs appear directly in the bottom bar; everything else
           lives behind "More" — a real bottom tab bar can't fit 6-9 items. */
        function bottomTabBar() {
            const role = state.activeRole;
            if (!role || !state.session[role]) return '';
            const tabs = tabsForRole(role);
            const primary = tabs.slice(0, 4);
            const overflow = tabs.slice(4);
            const activeView = activeTabKey(role);
            const overflowActive = overflow.some(([key]) => key === activeView);
            const tabBtn = ([key, label, badge]) => `
                <button class="bottom-tab ${activeView===key?'active':''}" ${activeView===key?'aria-current="page"':''} onclick="App.setView('${role}','${key}')">
                    <span class="bottom-tab-icon">${icon(TAB_ICON[key] || 'leaf', 21)}${badge ? `<span class="bottom-tab-dot"></span>` : ''}</span>
                    <span class="bottom-tab-label">${esc(label)}</span>
                </button>`;
            const moreBtn = overflow.length ? `
                <button class="bottom-tab ${overflowActive?'active':''}" aria-expanded="${state.mobileMoreOpen}" onclick="App.toggleMoreSheet()">
                    <span class="bottom-tab-icon">${icon('dots', 21)}${overflow.some(([,,b]) => b) ? `<span class="bottom-tab-dot"></span>` : ''}</span>
                    <span class="bottom-tab-label">More</span>
                </button>` : '';
            return `<nav class="bottom-tabbar bottom-tabbar--${role}" aria-label="Sections">${primary.map(tabBtn).join('')}${moreBtn}</nav>${moreSheetHtml(role, overflow)}`;
        }
        function moreSheetHtml(role, overflow) {
            if (!state.mobileMoreOpen) return '';
            const activeView = activeTabKey(role);
            return `<div class="more-sheet-overlay" onclick="App.toggleMoreSheet()">
                <div class="more-sheet more-sheet--animate" role="dialog" aria-modal="true" aria-label="More sections" onclick="event.stopPropagation();">
                    <div class="more-sheet-handle"></div>
                    <div class="more-sheet-grid">
                    ${overflow.map(([key, label, badge]) => `
                        <button class="more-sheet-item ${activeView===key?'active':''}" onclick="App.setView('${role}','${key}');App.toggleMoreSheet()">
                            <span class="more-sheet-icon">${icon(TAB_ICON[key] || 'leaf', 19)}</span>
                            <span>${esc(label)}</span>
                            ${badge ? `<span class="badge-count">${badge}</span>` : ''}
                        </button>`).join('')}
                    </div>
                    <button class="more-sheet-item more-sheet-logout" onclick="App.logout()">${icon('logout',19)}<span>Log out</span></button>
                </div>
            </div>`;
        }

        /* Customer section links, set inside the top bar. */
        function subnav() {
            const role = state.activeRole;
            if (role !== 'customer' || !state.session[role]) return '';
            const cur = activeTabKey('customer');
            const tabs = tabsForRole('customer').filter(([key]) => key !== 'cart' && key !== 'profile');
            return `<nav class="nav-links" aria-label="Shop sections">${tabs.map(([key, label, badge]) =>
                `<button class="nav-link ${cur===key?'active':''}" ${cur===key?'aria-current="page"':''} onclick="App.setView('customer','${key}')">${esc(label)}${badge ? (key==='messages' ? `<span class="nav-dot" aria-label="${badge} unread"></span>` : `<span class="nav-count">${badge}</span>`) : ''}</button>`
              ).join('')}</nav>`;
        }

        /* ---------- Operational shell (pharmacy staff / owner / platform admin) ---------- */
        function opsShell(role) {
            const native = isNativeAndroidApp();
            const isAdmin = role === 'admin';
            const variant = isAdmin ? 'console' : isPharmacyOwner() ? 'owner' : 'staff';
            return `<div class="ops ops--${variant}">
                ${native ? '' : opsSidebar(role, variant)}
                <div class="ops-main">
                  ${opsBar(role)}
                  <main class="ops-content">${mainContent()}</main>
                </div>
                ${bottomTabBar()}
              </div>`;
        }

        function opsSidebar(role, variant) {
            const tabs = tabsForRole(role);
            const groupMap = role === 'admin' ? ADMIN_NAV_GROUPS : STAFF_NAV_GROUPS;
            const active = activeTabKey(role);
            const groups = [];
            tabs.forEach(t => {
                const label = groupMap[t[0]] || 'More';
                let g = groups.find(x => x.label === label);
                if (!g) { g = { label, items: [] }; groups.push(g); }
                g.items.push(t);
            });
            let ctx, who, whoRole;
            if (role === 'admin') {
                const a = currentAdmin();
                const live = DB.pharmacies.filter(p => p.status === 'approved').length;
                ctx = `<div class="sb-ctx-label">Environment</div>
                  <div class="sb-ctx-name">${esc(DB.settings.platformName)} marketplace</div>
                  <div class="sb-ctx-meta mono"><span class="sys-dot ${sbEnabled()?'is-live':''}"></span>${sbEnabled()?'live':'local'} · ${live} pharmac${live===1?'y':'ies'}</div>`;
                who = a.name; whoRole = 'Site administrator';
            } else {
                const s = currentStaff();
                const ph = currentStaffPharmacy();
                ctx = `<div class="sb-ctx-label">${variant==='owner' ? 'Your pharmacy' : 'On shift at'}</div>
                  <div class="sb-ctx-name">${esc(ph.name)}</div>
                  <div class="sb-ctx-meta">${icon('clock',13)} ${esc(ph.hours)}</div>`;
                who = s.name; whoRole = s.isOwner ? 'Pharmacy admin' : 'Pharmacy staff';
            }
            const sub = variant === 'console' ? 'Console' : variant === 'owner' ? 'Owner’s desk' : 'Workbench';
            return `<aside class="sidebar" aria-label="${role==='admin'?'Console':'Pharmacy'} navigation">
                <div class="sb-brand">${brandMark()}<div><div class="sb-word">CarePoint</div><div class="sb-sub">${sub}</div></div></div>
                <div class="sb-ctx">${ctx}</div>
                <nav class="sb-nav">${groups.map(g => `<div class="sb-group">
                    <div class="sb-group-label">${esc(g.label)}</div>
                    ${g.items.map(([key, label, badge]) => `<button class="sb-item ${active===key?'active':''}" ${active===key?'aria-current="page"':''} onclick="App.setView('${role}','${key}')">
                        ${icon(TAB_ICON[key] || 'leaf', 18)}<span class="sb-item-label">${esc(label)}</span>${badge ? `<span class="sb-badge">${badge}</span>` : ''}
                      </button>`).join('')}
                  </div>`).join('')}</nav>
                <div class="sb-foot">
                  <div class="sb-user"><span class="avatar">${initials(who)}</span><div class="sb-user-text"><div class="sb-user-name">${esc(who)}</div><div class="sb-user-role">${whoRole}</div></div></div>
                  <button class="sb-logout" onclick="App.logout()">${icon('logout',16)}<span>Log out</span></button>
                </div>
              </aside>`;
        }

        function opsBar(role) {
            const tabs = tabsForRole(role);
            const active = activeTabKey(role);
            const cur = (tabs.find(t => t[0] === active) || [null, ''])[1];
            const sub = { orderDetail: 'Order', thread: 'Conversation' }[state[role].view];
            const crumbPage = `<span class="ops-crumb-page">${esc(cur)}${sub ? `<span class="ops-crumb-sub"> / ${sub}</span>` : ''}</span>`;
            if (role === 'admin') {
                const a = currentAdmin();
                const live = sbEnabled();
                return `<header class="ops-bar">
                  <div class="ops-crumb"><span class="ops-crumb-ctx mono">console</span><span class="sep" aria-hidden="true">/</span>${crumbPage}</div>
                  <div class="ops-tools">
                    <span class="sys-chip ${live?'is-live':''}"><span class="sys-dot ${live?'is-live':''}"></span>${live?'Live sync':'Local data'}</span>
                    <span class="sys-date mono">${new Date().toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
                    <span class="avatar avatar--sm" title="${esc(a.name)}">${initials(a.name)}</span>
                    <button class="icon-btn ops-logout" aria-label="Log out" onclick="App.logout()">${icon('logout',18)}</button>
                  </div>
                </header>`;
            }
            const ph = currentStaffPharmacy();
            const s = currentStaff();
            const unread = unreadForStaffPharmacy(ph.id);
            const open = DB.orders.filter(o => o.pharmacyId === ph.id && o.status !== 'completed' && o.status !== 'cancelled')
                .sort((a, b) => b.createdAt - a.createdAt);
            return `<header class="ops-bar">
              <div class="ops-crumb"><span class="ops-crumb-ctx">${esc(ph.name)}</span><span class="sep" aria-hidden="true">/</span>${crumbPage}</div>
              <div class="ops-tools">
                <label class="quick-find">${icon('search',16)}<span class="sr-only">Jump to an open order</span>
                  <select onchange="if(this.value)App.openOrder('staff',this.value)">
                    <option value="">${open.length ? 'Jump to an open order…' : 'No open orders'}</option>
                    ${open.map(o => `<option value="${o.id}">#${o.id.replace('o','')} · ${esc(customerName(o.customerId))} · ${STATUS_LABEL[o.status]}</option>`).join('')}
                  </select>
                </label>
                <button class="icon-btn msg-btn" title="Counter messages" aria-label="Counter messages${unread?', '+unread+' unread':''}" onclick="App.setView('staff','messages')">${icon('message',18)}${unread?`<span class="msg-dot"></span>`:''}</button>
                <span class="avatar avatar--sm" title="${esc(s.name)}${s.isOwner?' (Admin)':''}">${initials(s.name)}</span>
                <button class="icon-btn ops-logout" aria-label="Log out" onclick="App.logout()">${icon('logout',18)}</button>
              </div>
            </header>`;
        }

        /* ---------- Shared building blocks ---------- */
        function pageHead(title, sub, actions, kicker) {
            return `<header class="page-head">
                <div class="page-head-text">
                  ${kicker ? `<div class="eyebrow">${kicker}</div>` : ''}
                  <h1 class="page-title">${title}</h1>
                  ${sub ? `<p class="page-sub">${sub}</p>` : ''}
                </div>
                ${actions ? `<div class="page-actions">${actions}</div>` : ''}
              </header>`;
        }
        function crumbs(backCall, backLabel, here) {
            return `<nav class="crumbs" aria-label="Breadcrumb"><button class="crumb-back" onclick="${backCall}">${icon('arrowLeft',15)}<span>${backLabel}</span></button>${here ? `<span class="crumb-sep" aria-hidden="true">/</span><span class="crumb-here">${here}</span>` : ''}</nav>`;
        }
        function statCard(label, value, opts) {
            opts = opts || {};
            const tag = opts.onclick ? 'button' : 'div';
            return `<${tag} class="stat ${opts.tone ? 'stat--' + opts.tone : ''}" ${opts.onclick ? `onclick="${opts.onclick}"` : ''}>
                <span class="stat-top"><span class="stat-label">${label}</span>${opts.icon ? `<span class="stat-icon">${icon(opts.icon, 16)}</span>` : ''}</span>
                <span class="stat-num">${value}</span>
                ${opts.note ? `<span class="stat-note">${opts.note}</span>` : ''}
              </${tag}>`;
        }
        function segTabs(items, current, call) {
            return `<div class="seg" role="tablist">${items.map(([k, label, n]) =>
                `<button class="seg-btn ${current===k?'active':''}" role="tab" aria-selected="${current===k}" onclick="${call(k)}">${label}${n != null ? `<span class="seg-n">${n}</span>` : ''}</button>`).join('')}</div>`;
        }
        /* Dialog: centred on desktop, a bottom sheet on phones and in the app. */
        function modalHtml(title, body, foot, closeCall, opts) {
            opts = opts || {};
            return `<div class="modal-layer">
                <div class="modal ${opts.wide ? 'modal--wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(opts.label || '')}">
                  <div class="more-sheet-handle"></div>
                  <div class="modal-head">
                    <div>${opts.kicker ? `<div class="eyebrow">${opts.kicker}</div>` : ''}<h2 class="modal-title">${title}</h2></div>
                    <button class="icon-btn" aria-label="Close" onclick="${closeCall}">${icon('close',18)}</button>
                  </div>
                  <div class="modal-body">${body}</div>
                  ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
                </div>
              </div>`;
        }

        /* ================= PUBLIC (no login required) ================= */
        function publicScreen() {
            if (state.publicView === 'auth') return authScreen();
            if (state.publicView === 'catalog') return publicCatalog();
            if (state.publicView === 'medicine') return publicMedicineDetail();
            if (state.publicView === 'page') return publicStaticPage();
            return landingPage();
        }

        /* CMS-managed static pages (About, Contact, Privacy) and FAQs, editable by the site admin. */
        function publicStaticPage() {
            const key = state.publicPageKey;
            const back = crumbs("App.goPublic('landing')", 'Back to CarePoint');
            if (key === 'faqs') {
                const faqPage = paginate(DB.faqs, 'publicFaqs');
                return `<article class="prose-page">${back}
                  <div class="eyebrow">Help</div>
                  <h1 class="prose-title">Frequently asked <em>questions</em></h1>
                  ${DB.faqs.length ? `<div class="faq-list">${faqPage.items.map((f, i) => `<details class="faq" ${i===0?'open':''}>
                      <summary><span class="faq-n mono">${String((faqPage.page - 1) * PAGE_SIZE + i + 1).padStart(2,'0')}</span><span class="faq-q">${esc(f.q)}</span><span class="faq-toggle" aria-hidden="true">${icon('plus',16)}</span></summary>
                      <p>${esc(f.a)}</p>
                    </details>`).join('')}</div>` : `<p class="hint">No FAQs published yet.</p>`}
                  ${paginationHtml('publicFaqs', faqPage.page, faqPage.totalPages)}
                </article>`;
            }
            const p = DB.pages[key];
            if (!p) return `<article class="prose-page">${back}${emptyState('ledger', 'Page not found.', 'It may have been moved or unpublished.')}</article>`;
            return `<article class="prose-page">${back}
              <div class="eyebrow">CarePoint</div>
              <h1 class="prose-title">${esc(p.title)}</h1>
              <div class="prose">${esc(p.body)}</div>
            </article>`;
        }

        function platformStats() {
            const openPharmacies = DB.pharmacies.filter(p => p.status === 'approved');
            const meds = DB.medicines.filter(m => {
                const ph = pharmacy(m.pharmacyId);
                return ph && ph.status === 'approved' && isListed(m);
            });
            const rated = meds.filter(m => medReviews(m.id).length);
            const avg = rated.length ?
                rated.reduce((s, m) => s + medRatingAvg(m.id), 0) / rated.length : 0;
            return { pharmacies: openPharmacies.length, meds: meds.length, avg,
                delivered: DB.orders.filter(o => o.status === 'completed').length };
        }

        function publicMedicines() {
            return DB.medicines.filter(m => {
                const ph = pharmacy(m.pharmacyId);
                return ph && ph.status === 'approved' && isListed(m);
            });
        }

        /* Italicises the last word of a CMS headline for the editorial treatment. */
        function editorialHeadline(text) {
            const words = String(text || '').trim().split(/\s+/);
            if (words.length < 3) return esc(text);
            const last = words.pop();
            return esc(words.join(' ')) + ' <em>' + esc(last) + '</em>';
        }

        function landingPage() {

                .slice(0, 6);
            const openPharmacies = DB.pharmacies.filter(p => p.status === 'approved');
            const topReviews = DB.reviews.slice().sort((a, b) => b.at - a.at).slice(0, 3);
            const banner = DB.homepageBanner;
            const activePromos = DB.promotions.filter(p => p.active);
            const lead = featured[0];
            return `<div class="landing">
              <section class="hero">
                <div class="hero-copy">
                  <div class="hero-eyebrow"><span class="live-dot"></span><span>The Neighborhood Apothecary</span><span class="eyebrow-rule" aria-hidden="true"></span><span class="hero-eyebrow-count">${stats.pharmacies} counter${stats.pharmacies===1?'':'s'} open</span></div>
                  <h1 class="hero-title">${banner.active ? editorialHeadline(banner.headline) : 'Remedies from the pharmacy <em>down your street</em>.'}</h1>
                  <p class="hero-sub">${banner.active ? esc(banner.subtext) : 'Browse real stock from trusted neighborhood pharmacies, ask a pharmacist about your prescription, and pick up or get it delivered. No account needed to look around.'}</p>

                  <dl class="hero-ledger">

                    <div><dt>Remedies on the shelf</dt><dd>${stats.meds}</dd></div>

              </section>` : ''}

              <section class="landing-section">
                <header class="section-head section-head--split">
                  <div><span class="kicker">The shelves</span><h2>Find it by what <em>ails you</em></h2></div>
                  <p>Every category is stocked by pharmacies in your neighborhood — pick a shelf to see what’s on it today.</p>
                </header>
                <div class="shelf-bento">
                  ${CATEGORIES.map((c, i)=>{
                    const n = pub.filter(m=>m.category===c).length;
                    return `<button class="shelf-tile shelf-tile--${i}" onclick="App.browseCategory('${esc(c)}')">
                      <span class="shelf-no mono">${String(i+1).padStart(2,'0')}</span>
                      <span class="shelf-icon">${icon(CAT_ICON[c]||'leaf', i===0 ? 46 : 28)}</span>
                      <span class="shelf-name">${esc(c)}</span>
                      <span class="shelf-count">${n} item${n===1?'':'s'} ${icon('arrowRight',14)}</span>
                    </button>`;
                  }).join('')}
                </div>
              </section>

              <section class="landing-section">
                <header class="section-head section-head--split">
                  <div><span class="kicker">Best loved</span><h2>What the neighborhood <em>reaches for</em></h2></div>
                  <button class="btn-text" onclick="App.goPublic('catalog')">See the full shelf ${icon('arrowRight',16)}</button>
                </header>
                ${lead ? `<div class="feature-grid">
                    ${featureCard(lead)}
                    ${featured.slice(1, 5).map(m => publicMedCard(m)).join('')}
                  </div>` : `<div class="card">${emptyState('shelf', 'The shelves are being stocked.', 'Pharmacies are adding their remedies now — check back shortly, or browse the full shelf.', `<button class="btn btn-outline" onclick="App.goPublic('catalog')">Browse the shelf</button>`)}</div>`}

              <section class="landing-section how">

                  <li class="how-step"><span class="how-num">01</span><span class="how-icon">${icon('search',22)}</span><h3>Browse the shelf</h3><p>Search live stock and prices from approved pharmacies near you — no account required.</p></li>
                  <li class="how-step"><span class="how-num">02</span><span class="how-icon">${icon('cart',22)}</span><h3>Order or ask</h3><p>Fill your satchel for pickup or delivery, or send a prescription photo to the pharmacist.</p></li>
                  <li class="how-step"><span class="how-num">03</span><span class="how-icon">${icon('star',22)}</span><h3>Receive &amp; rate</h3><p>Track your order from pending to ready. Once you receive it, rate the medicine for your neighbors.</p></li>

              <section class="landing-section">
                <header class="section-head section-head--split">
                  <div><span class="kicker">Neighborhood apothecaries</span><h2>Real counters, <em>real pharmacists</em></h2></div>
                  <p>Each one reviewed and approved by the CarePoint team before it can list a single remedy.</p>
                </header>
                ${openPharmacies.length ? `<div class="storefront-grid">
                  ${openPharmacies.map(p=>`<article class="storefront">
                    <div class="awning" aria-hidden="true"></div>
                    <div class="storefront-body">
                      <div class="storefront-top"><h3>${esc(p.name)}</h3><span class="badge badge-active">Open</span></div>
                      <p class="storefront-line">${icon('pin',15)} ${esc(p.location)}</p>
                      <p class="storefront-line">${icon('clock',15)} ${esc(p.hours)}</p>
                      <div class="storefront-foot">
                        <span class="mono">${DB.medicines.filter(m=>m.pharmacyId===p.id && !m.prescription).length} over-the-counter items</span>
                        <button class="btn-text" onclick="App.setSearchField('pharmacy','${p.id}');App.goPublic('catalog')">Browse ${icon('arrowRight',14)}</button>
                      </div>
                    </div>
                  </article>`).join('')}
                </div>` : `<p class="hint">No pharmacies open yet.</p>`}
              </section>

              ${topReviews.length ? `<section class="landing-section">
                <header class="section-head section-head--split">
                  <div><span class="kicker">Verified ratings</span><h2>Only from people who <em>received the order</em></h2></div>
                  <p>Nobody can rate a remedy until their order is complete.</p>
                </header>
                <div class="slips">
                  ${topReviews.map((r, i)=>{
                    const m = medicine(r.medId);
                    return `<figure class="slip slip--${i}">
                      <div class="slip-top"><span class="slip-score">${Number(r.rating).toFixed(1)}</span>${starRow(r.rating,null,15)}</div>
                      <blockquote class="slip-remedy">${esc(m ? m.name : 'A remedy')}</blockquote>
                      <figcaption><span>${esc(customerName(r.customerId))} · ${fmtDate(r.at)}</span><span class="stamp">Verified · received</span></figcaption>
                    </figure>`;
                  }).join('')}
                </div>
              </section>` : ''}

              <section class="cta-band">
                <div class="cta-band-inner">
                  <div class="cta-band-copy">
                    <span class="kicker kicker--light">Open an account</span>
                    <h2>Your pharmacy, <em>a tap away.</em></h2>

                  </div>
                  <div class="cta-band-actions">
                    <button class="btn btn-amber btn-lg" onclick="App.goAuth('register')">Create your account</button>
                    <button class="btn btn-ghost-light btn-lg" onclick="App.goAuth('registerPharmacy')">${icon('building',17)} List your pharmacy</button>
                  </div>
                </div>
                <svg class="cta-band-sprig" viewBox="0 0 200 260" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M100 258C98 180 104 110 132 20"/><path d="M104 200c-26-6-46-22-54-46 26 2 46 18 54 46Z"/><path d="M106 150c24-8 40-26 44-50-24 6-40 24-44 50Z"/><path d="M114 100c-20-10-30-28-30-48 20 8 30 26 30 48Z"/><path d="M124 58c16-10 24-24 24-40-16 8-24 22-24 40Z"/></svg>
              </section>
            </div>`;
        }

        /* The lead remedy on the landing page gets the editorial treatment. */
        function featureCard(m) {
            const ph = pharmacy(m.pharmacyId);
            const avg = medRatingAvg(m.id);
            const cnt = medReviews(m.id).length;
            return `<article class="feature-card" tabindex="0" onclick="App.openPublicMedicine('${m.id}')" onkeydown="if(event.key==='Enter'&&event.target===this)App.openPublicMedicine('${m.id}')">
                <div class="feature-media">${medPlate(m)}${plateTag(m)}</div>
                <div class="feature-body">
                  <span class="feature-rank mono">No. 1 · most loved this month</span>
                  <h3 class="feature-name">${esc(m.name)}</h3>
                  <p class="feature-desc">${esc(productDescription(m))}</p>
                  <div class="feature-meta">${starRow(medRatingAvg(m.id), cnt, 14)}<span>${esc(ph ? ph.name : 'Pharmacy')}${m.brand ? ' · ' + esc(m.brand) : ''}</span></div>
                  <div class="feature-foot">
                    <span class="price price--lg">${money(m.price)}</span>
                    <button class="btn btn-primary" onclick="event.stopPropagation();App.guestPrompt()">${icon('lock',15)} Log in to order</button>
                  </div>
                </div>
              </article>`;
        }

        function plateTag(m) {
            if (m.prescription) return `<span class="plate-tag plate-tag--rx">${icon('quill',12)} Rx required</span>`;
            if (m.stock === 0) return `<span class="plate-tag plate-tag--out">Out of stock</span>`;
            if (m.stock <= 10) return `<span class="plate-tag plate-tag--low">Only ${m.stock} left</span>`;
            return '';
        }

        /* Guest version of a product card — same look, ordering asks for a login. */
        function publicMedCard(m) {
            const ph = pharmacy(m.pharmacyId);
            const avg = medRatingAvg(m.id);
            const cnt = medReviews(m.id).length;
            return `<article class="product-card" tabindex="0" onclick="App.openPublicMedicine('${m.id}')" onkeydown="if(event.key==='Enter'&&event.target===this)App.openPublicMedicine('${m.id}')">
                <div class="product-media">${medPlate(m)}${plateTag(m)}</div>
                <div class="product-body">
                  <div class="product-cat">${catIcon(m.category)} ${esc(m.category)}</div>
                  <h3 class="product-name">${esc(m.name)}</h3>
                  <div class="product-src">${esc(ph ? ph.name : 'Pharmacy')}${m.brand ? ' · ' + esc(m.brand) : ''}</div>
